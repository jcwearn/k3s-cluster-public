apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 10m
  chart:
    spec:
      chart: reloader
      version: 2.2.17
      sourceRef:
        kind: HelmRepository
        name: reloader
        namespace: flux-system
  install:
    createNamespace: true
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    reloader:
      deployment:
        # The chart's pod securityContext is already non-root with seccomp;
        # its container securityContext ships empty.
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
