apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: exit-node-dns
spec:
  statefulSet:
    pod:
      # The Connector's two replicas must never share a node, or one node going
      # down takes both and the HA is only on paper. Required, not preferred:
      # with three nodes, a drained one still leaves room for both.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  tailscale.com/parent-resource: ts-pod-cidrs
                  tailscale.com/parent-resource-type: connector
              topologyKey: kubernetes.io/hostname
      dnsPolicy: "None"
      dnsConfig:
        # CoreDNS first, then public fallbacks. containerboot fetches its state Secret
        # from kubernetes.default.svc by name, so a resolver that cannot answer
        # cluster.local leaves the pod in CrashLoopBackOff -- which took the subnet
        # router down on 2026-09-19 when this list was made public-only. The public
        # entries are what let a running exit node re-reach controlplane.tailscale.com
        # through a CoreDNS outage; a restart during one is lost either way, since
        # the Secret lives behind the same API. Tailnet clients do not resolve through
        # this pod -- they use the tailnet's global nameserver -- so nothing here needs
        # to answer *.${DOMAIN} for anyone but the pod itself.
        # glibc honours only the first three nameserver lines (MAXNS).
        nameservers:
          - "10.43.0.10"
          - "9.9.9.9"
          - "1.1.1.1"
        searches:
          - "tailscale.svc.cluster.local"
          - "svc.cluster.local"
          - "cluster.local"
        options:
          - name: ndots
            value: "5"
          - name: timeout
            value: "2"
          - name: attempts
            value: "2"
