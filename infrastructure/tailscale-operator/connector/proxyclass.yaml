apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: exit-node-dns
spec:
  statefulSet:
    pod:
      dnsPolicy: "None"
      dnsConfig:
        # Public resolvers only, and no CoreDNS. This pod resolves one thing that
        # matters, controlplane.tailscale.com, and losing DNS must not cost remote
        # access: a cluster resolver would put the exit node and the subnet router
        # behind the cluster's own DNS, and a LAN address would put them behind the
        # gateway. Tailnet clients do not resolve through this pod -- they use the
        # tailnet's global nameserver -- so nothing here needs to answer *.${DOMAIN}.
        # glibc honours only the first three nameserver lines (MAXNS).
        nameservers:
          - "9.9.9.9"
          - "1.1.1.1"
          - "1.0.0.1"
        searches:
          - "tailscale.svc.cluster.local"
          - "svc.cluster.local"
          - "cluster.local"
        options:
          - name: ndots
            value: "5"
          - name: timeout
            value: "2"
          - name: attempts
            value: "2"
