apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: ts-pod-cidrs
  namespace: tailscale-operator
spec:
  proxyClass: exit-node-dns
  # Being replaced by the three pinned Connectors in connectors-per-node.yaml.
  # Renamed out of the way first: its pod-1 held the name k3s-exit-node-1, which
  # the new k3s-01 router needs. It keeps carrying the routes until the new
  # devices are approved, then is deleted in a follow-up.
  replicas: 2
  hostnamePrefix: k3s-exit-node-old
  subnetRouter:
    advertiseRoutes:
      - "${MGMT_PREFIX}.0/24"
      - "${LAN_PREFIX}.0/24"
  exitNode: true
