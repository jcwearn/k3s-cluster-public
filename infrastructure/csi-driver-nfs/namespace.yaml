apiVersion: v1
kind: Namespace
metadata:
  name: csi-driver-nfs
  labels:
    # The node DaemonSet mounts the host kubelet directory and propagates mounts
    # back to it, so it must run privileged.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
