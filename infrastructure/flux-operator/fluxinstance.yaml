apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    # Pinned exactly, not a range. Flux minor versions cannot be skipped --
    # each removes the APIs the previous one deprecated -- so moving this is a
    # decision, not a bump. The constraint is about *stored objects* rather than
    # the version number, so check before assuming it bites: compare every Flux
    # CRD's .status.storedVersions against the versions the target's
    # manifests.tar.gz actually serves. For 2.7.5 -> 2.9.4 they already matched
    # everywhere, so `flux migrate` had nothing to do and this went in one step.
    # The commands are in docs/plans/k3s-eol-upgrade/progress.md.
    #
    # 2.9 requires Kubernetes >= 1.34. Read that from the per-release notes --
    # the installation page's table lags a release behind and says 1.33.
    version: "2.9.4"
    registry: "ghcr.io/fluxcd"
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: true
    domain: "cluster.local"
  kustomize:
    patches:
      - patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --concurrent=10
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --requeue-dependency=5s
        target:
          kind: Deployment
          name: "(kustomize-controller|helm-controller)"
  sync:
    kind: GitRepository
    provider: github
    url: "https://github.com/jcwearn/k3s-cluster.git"
    ref: "refs/heads/main"
    path: "clusters/prod"
    pullSecret: "flux-system"
