apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 10m
  chart:
    spec:
      chart: flux-operator
      version: 0.60.0
      sourceRef:
        kind: HelmRepository
        name: flux-operator
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # flux_resource_info is the only Flux readiness metric Prometheus gets --
    # the controllers stopped exporting gotk_reconcile_condition in Flux 2.1.
    # The operator refreshes it when it rebuilds the FluxReport, every 5m by
    # default. At 5m a one-minute fetch blip caught in one snapshot would sit
    # in the metric for the full interval and trip a 5m `for:`. At 1m the
    # metric tracks the GitRepository's own 1m poll.
    reporting:
      interval: 1m
    serviceMonitor:
      create: true
      labels:
        release: kube-prometheus-stack
