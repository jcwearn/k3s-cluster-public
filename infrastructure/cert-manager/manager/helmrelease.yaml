apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 10m
  chart:
    spec:
      chart: cert-manager
      version: v1.21.3
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    createNamespace: true
    crds: Create
  upgrade:
    strategy:
      name: RetryOnFailure
    crds: CreateReplace
  values:
    crds:
      enabled: true
      keep: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    webhook:
      # Two replicas, spread across nodes, with a PDB. The webhook's
      # failurePolicy is Fail, so with one replica every node drain (k3s
      # upgrades, hypervisor work) left it with no endpoints and any
      # cert-manager object apply was rejected -- cert-manager-issuer
      # paged on each one. ScheduleAnyway so a node outage never leaves a
      # replica Pending; the PDB keeps a drain from taking both.
      replicaCount: 2
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: cert-manager
              app.kubernetes.io/component: webhook
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
    cainjector:
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
    extraArgs:
      - --dns01-recursive-nameservers-only
      - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53
    podDnsPolicy: None
    podDnsConfig:
      nameservers:
        - 1.1.1.1
        - 8.8.8.8
