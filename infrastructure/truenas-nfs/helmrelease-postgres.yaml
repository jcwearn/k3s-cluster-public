apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: truenas-nfs-postgres
  namespace: storage
spec:
  interval: 10m
  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      version: 4.0.18
      sourceRef:
        kind: HelmRepository
        name: nfs-subdir-external-provisioner
        namespace: flux-system
  install:
    createNamespace: true
  values:
    nfs:
      server: ${LAN_PREFIX}.200
      path: /mnt/pool/k8s-nfs-postgres
    storageClass:
      name: truenas-nfs-postgres
      defaultClass: false
      # The chart defaults this to true, which renames each released directory to
      # archived-<ns>-<pvc>-... instead of removing it. Nothing expires those, so
      # deleting a PVC never returned space and `df` quietly disagreed with the
      # cluster -- retiring Coder left 26G across 64 directories, spanning every
      # workspace ever created rather than the nine that were live.
      #
      # Off, because the safety net it duplicates is better: every dataset here
      # carries hourly/daily/weekly ZFS snapshots (24h / 14d / 8w) from
      # jcwearn/truenas-infra. Those are copy-on-write, actually expire, and cost
      # churn rather than a second full copy.
      archiveOnDelete: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
