apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease-events.yaml
  - helmrelease.yaml
  - namespace.yaml
configMapGenerator:
  # A real .alloy file rather than a block scalar in the HelmRelease. No hash
  # suffix, because the HelmRelease names the ConfigMap and cannot follow a
  # hash; the chart's config-reloader sidecar picks up edits instead.
  - name: alloy-config
    namespace: alloy
    files:
      - data/config.alloy
    options:
      disableNameSuffixHash: true
  - name: alloy-events-config
    namespace: alloy
    files:
      - data/events.alloy
    options:
      disableNameSuffixHash: true
