# Lets the alert agent's actor act in this namespace, as the apps
# namespaces' bindings in apps/alert-agent/rbac.yaml do. Removed with the
# drill.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alert-agent-actor
  namespace: medic-drill
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alert-agent-actor
subjects:
  - kind: ServiceAccount
    name: alert-agent-actor
    namespace: alert-agent
