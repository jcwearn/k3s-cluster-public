apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  url: https://prometheus-community.github.io/helm-charts
  interval: 10m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: prometheus
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 88.5.3
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    createNamespace: true
    crds: Create
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: Secret
      name: prometheus-secrets
      valuesKey: GRAFANA_ADMIN_USER
      targetPath: grafana.adminUser
    - kind: Secret
      name: prometheus-secrets
      valuesKey: GRAFANA_ADMIN_PASSWORD
      targetPath: grafana.adminPassword
    - kind: Secret
      name: prometheus-secrets
      valuesKey: NTFY_USERNAME
      targetPath: alertmanager.config.receivers[1].webhook_configs[0].http_config.basic_auth.username
    - kind: Secret
      name: prometheus-secrets
      valuesKey: NTFY_PASSWORD
      targetPath: alertmanager.config.receivers[1].webhook_configs[0].http_config.basic_auth.password
    - kind: Secret
      name: prometheus-secrets
      valuesKey: HEALTHCHECK_PING_URL
      targetPath: alertmanager.config.receivers[2].webhook_configs[0].url
  values:
    prometheus:
      prometheusSpec:
        # Until 2026-08-20 the TSDB was on an emptyDir, so every pod restart
        # took the history with it -- which is how a capacity question went
        # unanswerable during the follow-up #3 investigation.
        #
        # Sized from the upstream formula against measured ingest: 7,355
        # samples/sec over 278k active series at 1-2 bytes/sample is 18-36 GiB
        # for 30 days. retentionSize is the backstop to the volume size, because
        # a full TSDB volume is one of the ways this ends badly; Prometheus
        # prunes at 50 GiB rather than discovering 60 GiB the hard way.
        #
        # Retention was never set here before -- the 10d everyone assumed was
        # the chart default.
        # Sized from head series, not from what `kubectl top` reported at the
        # time: memory tracks series count at roughly 8 KiB each, and 234k
        # series puts steady state near 2 GiB. Measuring instead would have
        # given 823 MiB, because the pod had restarted minutes earlier and the
        # head block was still filling -- it climbed from 399 to 839 MiB in the
        # five minutes either side of the reading.
        #
        # The limit is deliberately 3x the request rather than snug. Compaction
        # and wide range queries both spike well above steady state, and an
        # OOM-kill mid-compaction is a worse outcome than a pod that is briefly
        # large. Reaching 6 GiB would mean something is genuinely wrong -- a
        # cardinality explosion, most likely -- and being killed for it is then
        # the right behaviour.
        resources:
          requests:
            cpu: 250m
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 6Gi
        retention: 30d
        retentionSize: 50GiB
        # Cuts WAL write volume, which is worth having when the WAL is on NFS.
        walCompression: true
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: truenas-nfs-monitoring
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 60Gi
        additionalScrapeConfigs:
          - job_name: truenas
            honor_labels: true
            static_configs:
              # Two sources, one job. Everything TrueNAS pushes arrives via
              # graphite-exporter; disk temperature and per-dataset space do
              # not, and are read from the API by truenas-api-exporter instead.
              # Keeping both under
              # job="truenas" means the alert rules do not have to know which
              # path a metric took, and instance="truenas" is true of both --
              # they describe the same machine.
              - targets: ['graphite-exporter-svc.prometheus.svc.cluster.local:9108']
                labels:
                  instance: truenas
              - targets: ['truenas-api-exporter-svc.prometheus.svc.cluster.local:9101']
                labels:
                  instance: truenas
          - job_name: pve
            static_configs:
              - targets:
                  - ${LAN_PREFIX}.21
                  - ${LAN_PREFIX}.22
                  - ${LAN_PREFIX}.23
            metrics_path: /pve
            params:
              module: [default]
              cluster: ['1']
              node: ['1']
            relabel_configs:
              - source_labels: [__address__]
                target_label: __param_target
              - source_labels: [__param_target]
                target_label: instance
              - target_label: __address__
                replacement: pve-exporter-svc.prometheus.svc.cluster.local:9221
          - job_name: proxmox-nodes
            static_configs:
              - targets:
                  - ${LAN_PREFIX}.21:9100
                  - ${LAN_PREFIX}.22:9100
                  - ${LAN_PREFIX}.23:9100
          # DNS probes via blackbox-exporter. The relabel dance is the standard
          # blackbox pattern: the target moves into __param_target so the exporter knows
          # what to query, and __address__ is rewritten to the exporter itself.
          - job_name: dns-adguard
            metrics_path: /probe
            params:
              module: [dns_local_rewrite]
            static_configs:
              - targets:
                  - ${LAN_PREFIX}.2
                  - ${LAN_PREFIX}.102
                  - ${LAN_PREFIX}.103
            relabel_configs:
              - source_labels: [__address__]
                target_label: __param_target
              - source_labels: [__param_target]
                target_label: instance
              - target_label: __address__
                replacement: blackbox-exporter-svc.prometheus.svc.cluster.local:9115
          # The UDM Pro is the off-cluster fallback resolver, and a public resolver is the
          # control: if both fail together it is the WAN, not DNS.
          - job_name: dns-forwarders
            metrics_path: /probe
            params:
              module: [dns_public]
            static_configs:
              - targets:
                  - ${MGMT_PREFIX}.1
                  - 9.9.9.9
            relabel_configs:
              - source_labels: [__address__]
                target_label: __param_target
              - source_labels: [__param_target]
                target_label: instance
              - target_label: __address__
                replacement: blackbox-exporter-svc.prometheus.svc.cluster.local:9115
          # The endoflife.date catalogue. A plain self-scrape -- unlike blackbox
          # and pve there is no target to pass through, the exporter holds the
          # whole catalogue. Scraped slowly because it refreshes every six hours.
          - job_name: eol
            scrape_interval: 5m
            static_configs:
              - targets: ['eol-exporter-svc.prometheus.svc.cluster.local:9099']
      service:
        type: LoadBalancer
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: "prometheus"
          kube-vip.io/loadbalancerIPs: "${LAN_PREFIX}.3"
      ingress:
        enabled: false
    alertmanager:
      ingress:
        enabled: false
      service:
        type: LoadBalancer
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: "alertmanager"
          kube-vip.io/loadbalancerIPs: "${LAN_PREFIX}.18"
      config:
        route:
          group_by: ["namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: "null"
          routes:
            - receiver: "healthcheck"
              matchers:
                - alertname = "Watchdog"
              group_wait: 0s
              group_interval: 1m
              repeat_interval: 5m
            - receiver: "null"
              matchers:
                - alertname = "InfoInhibitor"
            # Renovate's Jobs are the retry mechanism, not the incident. A run that
            # dies -- a node drained under it, a github blip -- is corrected by the
            # next tick 30 minutes later, but the failed Job object lingers for
            # ttlSecondsAfterFinished (24h) and KubeJobFailed is a bare `> 0` gauge,
            # so one dead pod alerted for a full day. The Job is kept that long on
            # purpose, for logs; it just must not page. RenovateStale covers the case
            # where the failures are not transient.
            - receiver: "null"
              matchers:
                - alertname = "KubeJobFailed"
                - namespace = "renovate"
            # Lifecycle alerts are standing conditions, not incidents -- an
            # end-of-life release stays end-of-life for weeks by design. At the
            # global 12h repeat a 90-day warning window would be roughly 180
            # pushes, which is how a real signal gets tuned out. Weekly instead.
            #
            # This is a route, not a receiver. The receivers list below is
            # index-addressed by the valuesFrom block at the top of this file, so
            # inserting into it would silently misroute the ntfy credentials.
            - receiver: "ntfy"
              matchers:
                - alertname =~ "Release.*|Eol.*"
              repeat_interval: 168h
            - receiver: "ntfy"
              matchers:
                - alertname != "Watchdog"
        receivers:
          - name: "null"
          - name: "ntfy"
            webhook_configs:
              - url: "http://alertmanager-ntfy-svc.ntfy.svc.cluster.local:4081/hook"
                http_config:
                  basic_auth:
                    username: ""
                    password: ""
          - name: "healthcheck"
            webhook_configs:
              - url: "https://hc-ping.com/placeholder"
                send_resolved: false
      alertmanagerSpec:
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            cpu: 200m
            memory: 256Mi
        # Silences and the notification log. Small, but losing a silence on
        # restart means a deliberately-quietened alert starts paging again.
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: truenas-nfs-monitoring
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi
        volumes:
          - name: password-file-volume
            secret:
              secretName: prometheus-secrets
              items:
                - key: alertmanager-ntfy-password
                  path: alertmanager-ntfy-password
        volumeMounts:
          - name: password-file-volume
            mountPath: /passwords
            readOnly: true
    grafana:
      resources:
        requests:
          cpu: 50m
          memory: 384Mi
        limits:
          cpu: 500m
          memory: 1Gi
      # Dashboards come from ConfigMaps, so what this preserves is the SQLite
      # database: preferences, annotations, API keys and starred dashboards.
      persistence:
        enabled: true
        type: pvc
        storageClassName: truenas-nfs-monitoring
        accessModes: ["ReadWriteOnce"]
        size: 5Gi
      # Required once persistence is on. Grafana is a Deployment, and the
      # default RollingUpdate would start the replacement pod before the old one
      # releases the volume -- which deadlocks on a single-writer claim.
      deploymentStrategy:
        type: Recreate
      sidecar:
        # Covers both sidecars -- grafana-sc-dashboard and
        # grafana-sc-datasources share this key.
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        dashboards:
          folderAnnotation: grafana_folder
      ingress:
        enabled: false
      prune: true
    prometheusOperator:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      # The sidecar injected into both the Prometheus and Alertmanager pods, so
      # this one key covers two containers.
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 25m
          memory: 48Mi
        limits:
          cpu: 100m
          memory: 128Mi
    kubeControllerManager:
      enabled: false
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    defaultRules:
      create: true
      rules:
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        windows: false
      # Both PVC fill rules read kubelet_volume_stats_available_bytes, which on
      # NFS is the statfs of the mount -- the exporting dataset, not the PVC.
      # Every PVC in the cluster is on nfs.csi.k8s.io, so all 25 of them report
      # the same figure to the byte, and it is the pool's free space rather than
      # the refquota that actually bounds them: 8.7 TiB reported against the
      # 1 TiB refquota on pool/k8s-nfs, overstating headroom 8.5x.
      #
      # The rule therefore cannot single out a filling PVC, and when it does
      # fire it fires for all 25 at once. TrueNASDatasetNearRefquota watches the
      # bound that is real. KubePersistentVolumeErrors stays enabled -- a
      # provisioning failure is still a provisioning failure.
      disabled:
        KubePersistentVolumeFillingUp: true
        KubePersistentVolumeInodesFillingUp: true
    additionalPrometheusRulesMap:
      dns-health:
        groups:
          - name: dns-health
            rules:
              # One instance failing is the signal that matters most: it is the state that
              # used to decay unnoticed until the remaining ones followed it down.
              - alert: AdGuardInstanceDown
                expr: probe_success{job="dns-adguard"} == 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "AdGuard Home not answering ({{ $labels.instance }})"
                  description: "{{ $labels.instance }} has failed DNS probes for 5 minutes. The other instances may still be answering, so clients may not have noticed yet."
              - alert: AdGuardAllDown
                expr: sum(probe_success{job="dns-adguard"}) == 0
                for: 2m
                labels:
                  severity: critical
                annotations:
                  summary: "All AdGuard Home instances are down"
                  description: "No AdGuard instance has answered a DNS probe for 2 minutes. LAN clients are relying on the UDM Pro fallback; the exit node is relying on its public resolvers."
              # The break-glass fallback. Silent rot here is only discovered when it is
              # needed, which is the worst possible time to discover it.
              - alert: FallbackResolverDown
                expr: probe_success{job="dns-forwarders", instance="${MGMT_PREFIX}.1"} == 0
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "UDM Pro fallback resolver not answering"
                  description: "The off-cluster fallback resolver has failed DNS probes for 15 minutes. AdGuard may still be fine, but the fallback path is not there if it stops."
              # Both forwarders failing at once points at the WAN rather than at DNS, so
              # this is deliberately separate from the two above.
              - alert: DnsEgressDown
                expr: sum(probe_success{job="dns-forwarders"}) == 0
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "No forwarding resolver reachable"
                  description: "Both the UDM Pro and the public control resolver have failed for 10 minutes. This points at WAN or routing rather than at DNS itself."
      truenas-health:
        groups:
          - name: truenas-health
            rules:
              - alert: TrueNASDiskTemperatureHigh
                expr: disk_temperature{job="truenas"} > 65
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "TrueNAS disk temperature high ({{ $labels.serial }})"
                  description: "Disk {{ $labels.serial }} on {{ $labels.instance }} is at {{ $value }}°C (threshold: 65°C)."
              - alert: TrueNASDiskTemperatureCritical
                expr: disk_temperature{job="truenas"} > 70
                for: 2m
                labels:
                  severity: critical
                annotations:
                  summary: "TrueNAS disk temperature critical ({{ $labels.serial }})"
                  description: "Disk {{ $labels.serial }} on {{ $labels.instance }} is at {{ $value }}°C (threshold: 70°C)."
              - alert: TrueNASHighCpuUsage
                expr: (100 - cpu_total{job="truenas", kind="idle"}) > 90
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "TrueNAS high CPU usage ({{ $labels.instance }})"
                  description: "TrueNAS CPU usage is above 90% for more than 5 minutes.\n  VALUE = {{ $value }}%"
              # Two things were wrong here, and the second is the interesting one.
              #
              # The expression used to be used/(used+free), which returned NOTHING:
              # both sides carry a different `kind` label, so the vectors never
              # matched and the whole rule evaluated empty. It could not fire.
              #
              # Fixing the matching alone would have been worse than leaving it
              # broken. On a ZFS box `cached` is the ARC -- 8.6 GiB of 11.5 GiB
              # here -- and used/(used+free) excludes it, leaving a denominator of
              # about a quarter of RAM. That reads 79% on an idle box and climbs
              # toward the 90% threshold as the ARC does exactly what it is for.
              # It would have alerted on ZFS working correctly.
              #
              # Cache is not pressure. The denominator is total RAM.
              - alert: TrueNASHighMemoryUsage
                expr: (sum(physical_memory{job="truenas", kind="used"}) / sum(physical_memory{job="truenas"}) * 100) > 90
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "TrueNAS high memory usage ({{ $labels.instance }})"
                  description: "TrueNAS memory usage is above 90% for more than 5 minutes.\n  VALUE = {{ $value }}%"
              # `type="cache"` never existed. The label values come straight from
              # Netdata's chart and dimension names via the mapping in
              # graphite-exporter.yaml, so they are ddhit/dmhit/ddmis/dmmis --
              # demand data and demand metadata, hits and misses. This rule
              # matched zero series at every point in the retention window and had
              # never fired once since it was written.
              #
              # Verified against the box rather than assumed: hits+misses sums to
              # 332.2665 against a reported dread of 332.2667, so the components
              # are the whole of demand reads and nothing is being double counted.
              #
              # No guard against division by zero on an idle box: 0/0 is NaN and
              # NaN < 50 is false, so it stays quiet. A minimum-traffic guard was
              # considered and dropped -- demand reads never fell below 235/s over
              # the retention window, so it would have been complexity the data
              # does not support.
              - alert: TrueNASZfsArcHitRatioLow
                expr: (sum(truenas_arcstats{job="truenas", type=~"ddhit|dmhit"}) / sum(truenas_arcstats{job="truenas", type=~"ddhit|dmhit|ddmis|dmmis"}) * 100) < 50
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "TrueNAS ZFS ARC hit ratio low ({{ $labels.instance }})"
                  description: "ZFS ARC hit ratio is below 50% for more than 15 minutes.\n  VALUE = {{ $value }}%"
              # BOOT-POOL ONLY, despite the name. netdata's diskspace collector
              # reports _root, _var_log, _tmp, _usr and the rest -- there is no
              # /mnt/pool* mountpoint in disk_bytes_used at all. This rule has
              # never watched a single dataset behind a PVC, and read as healthy
              # the whole time it was not watching them. That gap let a Renovate
              # cache reach 34G, a third of pool/k8s-nfs, across 141 days.
              #
              # It is kept because a full /var/log on the NAS is still worth
              # knowing about. The dataset rules below are what cover the pool.
              #
              # The mountpoint exclusion drops the tmpfs entries the collector
              # mixes in -- _dev, _dev_shm, _run, _run_lock, _run_user,
              # _run_netdata, _tmp. Those are memory, not the boot pool, and a
              # full one of them would otherwise page as boot-pool pressure.
              - alert: TrueNASBootPoolHighDiskUtilization
                expr: (disk_bytes_used{job="truenas", mountpoint!~"_dev.*|_run.*|_tmp"} / (disk_bytes_used{job="truenas", mountpoint!~"_dev.*|_run.*|_tmp"} + disk_bytes_avail{job="truenas", mountpoint!~"_dev.*|_run.*|_tmp"}) * 100) > 85
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "TrueNAS boot-pool filesystem usage high ({{ $labels.mountpoint }})"
                  description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is above 85% used. This covers boot-pool paths only; pool datasets are covered by TrueNASDataset* .\n  VALUE = {{ $value }}%"

              # Dataset space, from the API exporter rather than graphite.
              #
              # usedbydataset / refquota, NOT used / refquota. refquota bounds
              # REFERENCED data and does not count snapshots -- measured on
              # 2026-08-22, wiping 34G moved 27.5 GiB into usedbysnapshots while
              # refquota headroom recovered in full immediately. Dividing `used`
              # by refquota would page for snapshots the quota does not bound.
              #
              # The `> 0` guard is not defensive: 0 is ZFS's own encoding for
              # "no refquota set", so without it every unbounded dataset divides
              # by zero and returns +Inf, which is > 0.8.
              - alert: TrueNASDatasetNearRefquota
                expr: (truenas_dataset_used_bytes / (truenas_dataset_refquota_bytes > 0)) > 0.80
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: "TrueNAS dataset {{ $labels.dataset }} is near its refquota"
                  description: "{{ $labels.dataset }} has used over 80% of its refquota (referenced data; snapshots are not counted against it).\n  VALUE = {{ $value }}"
              - alert: TrueNASDatasetRefquotaCritical
                expr: (truenas_dataset_used_bytes / (truenas_dataset_refquota_bytes > 0)) > 0.95
                for: 10m
                labels:
                  severity: critical
                annotations:
                  summary: "TrueNAS dataset {{ $labels.dataset }} is about to hit its refquota"
                  description: "{{ $labels.dataset }} is over 95% of its refquota. At 100% writes fail with ENOSPC, which surfaces as application errors rather than as a storage alert.\n  VALUE = {{ $value }}"

              # Pool free space. The root dataset's `available` is the pool's,
              # and needs no POOL_READ role to read.
              # Pool fullness as a fraction, not an absolute byte count. The
              # previous thresholds were 500 GiB and 200 GiB free, which on an
              # 8.1 TiB pool is 94% and 97.6% full -- past the point where ZFS
              # is still writing well and far past the point where there is time
              # to do anything about it.
              #
              # 80% is where ZFS allocation switches from first-fit to best-fit
              # and write throughput starts degrading, so it is worth knowing
              # about for its own sake, independent of the capacity question.
              #
              # Capacity is derived rather than read: the API exposes no pool
              # size without a POOL_READ grant, but on the root dataset
              # `used` (recursive) plus `available` is the usable size.
              - alert: TrueNASPoolLowFreeSpace
                expr: >-
                  truenas_dataset_total_used_bytes{dataset="pool"}
                  / (truenas_dataset_total_used_bytes{dataset="pool"} + truenas_dataset_available_bytes{dataset="pool"})
                  > 0.80
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: "TrueNAS pool is {{ $value | humanizePercentage }} full"
                  description: >-
                    The pool is over 80% full, where ZFS write performance begins to
                    degrade. Snapshots hold space after a delete until they expire, so
                    check truenas_dataset_snapshots_bytes before assuming a live workload
                    is responsible.
              - alert: TrueNASPoolCriticallyLowFreeSpace
                expr: >-
                  truenas_dataset_total_used_bytes{dataset="pool"}
                  / (truenas_dataset_total_used_bytes{dataset="pool"} + truenas_dataset_available_bytes{dataset="pool"})
                  > 0.90
                for: 10m
                labels:
                  severity: critical
                annotations:
                  summary: "TrueNAS pool is {{ $value | humanizePercentage }} full"
                  description: "The pool is over 90% full."

              # Trend rules. Everything above this point is a static line: it
              # tells you that you have arrived, not that you are on the way.
              # These are the early warning, and they follow the shape upstream
              # uses for NodeFilesystemSpaceFillingUp -- a utilisation guard AND
              # a linear projection -- because a projection on its own is noise.
              # A pool that wobbles by a gigabyte around a flat mean will happily
              # extrapolate to zero; the guard is what stops that from paging.
              #
              # The input window is 7d rather than the 24h upstream uses, because
              # these measure storage that fills over weeks, not a filesystem that
              # fills over hours. Note that Prometheus history here only begins
              # 2026-08-21 -- predict_linear uses whatever the window holds, so
              # these are correct but conservative until roughly late September.
              - alert: TrueNASPoolFillingUp
                expr: >-
                  (
                    truenas_dataset_total_used_bytes{dataset="pool"}
                    / (truenas_dataset_total_used_bytes{dataset="pool"} + truenas_dataset_available_bytes{dataset="pool"})
                    > 0.50
                  )
                  and
                  predict_linear(truenas_dataset_available_bytes{dataset="pool"}[7d], 30 * 24 * 3600) < 0
                for: 6h
                labels:
                  severity: warning
                annotations:
                  summary: "TrueNAS pool is on course to fill within 30 days"
                  description: >-
                    The pool is over half full ({{ $value | humanizePercentage }}) and its
                    seven-day trend projects it running out inside 30 days. This is the
                    alert that is supposed to arrive while there is still time to choose
                    between deleting, expiring snapshots and buying disks.

              # Projecting `used` against refquota rather than projecting the
              # headroom directly: refquota is effectively constant, so the two
              # are equivalent, and this way avoids a subquery.
              - alert: TrueNASDatasetRefquotaFillingUp
                expr: >-
                  (truenas_dataset_used_bytes / (truenas_dataset_refquota_bytes > 0) > 0.50)
                  and
                  predict_linear(truenas_dataset_used_bytes[7d], 14 * 24 * 3600) > (truenas_dataset_refquota_bytes > 0)
                for: 6h
                labels:
                  severity: warning
                annotations:
                  summary: "TrueNAS dataset {{ $labels.dataset }} is on course to hit its refquota within 14 days"
                  description: >-
                    {{ $labels.dataset }} is over half its refquota
                    ({{ $value | humanizePercentage }}) and its seven-day trend projects it
                    reaching the limit inside 14 days. Every PVC on this dataset gets
                    ENOSPC when it does.

              # Pool health, not pool space. zfs_pool arrives from netdata as one
              # series per pool per state, with a 1 on whichever state is current.
              # Nothing has ever alerted on it: a vdev could fault in the array
              # holding every PVC in the cluster and the only symptom would be a
              # colour on a dashboard nobody has open.
              #
              # max by (pool) collapses the state dimension so the alert names the
              # pool rather than repeating per state.
              - alert: TrueNASPoolDegraded
                expr: max by (pool) (zfs_pool{job="truenas", state=~"degraded|faulted|unavail|removed"}) == 1
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "TrueNAS pool {{ $labels.pool }} is not ONLINE"
                  description: >-
                    ZFS reports pool {{ $labels.pool }} in a degraded, faulted, unavailable
                    or removed state. Run `zpool status {{ $labels.pool }}` on the NAS.

              # Snapshots are the one way the pool fills that no other rule sees.
              # TrueNASDatasetNearRefquota divides usedbydataset by refquota, and
              # that is correct -- refquota bounds referenced data and excludes
              # snapshots -- but it means snapshot growth is invisible to it by
              # construction. Snapshots still consume pool space.
              #
              # pool/k8s-nfs already holds more in snapshots (83.2 GB) than live
              # data (79.2 GB), a ratio of 1.05, so the threshold is set above
              # today's steady state rather than at it.
              #
              # Ratio alone is not enough. pool/k8s-nfs-monitoring sits at 3.72
              # against 1.32 GB of live data, because a Prometheus TSDB rewrites
              # its blocks constantly and every snapshot diverges from the last
              # almost immediately -- structurally normal there, and it would
              # have made this rule fire on the day it merged. The 50 GiB floor
              # is the second half of the question: snapshots have to dominate
              # live data AND be large enough to be worth reclaiming.
              #
              # The `> 1 GiB` denominator guard is the same shape as the `> 0` on
              # refquota below: on a dataset holding a few hundred KiB the ratio
              # is arithmetically true and operationally meaningless.
              - alert: TrueNASSnapshotsExceedLiveData
                expr: ((truenas_dataset_snapshots_bytes > 53687091200) / (truenas_dataset_used_bytes > 1073741824)) > 1.5
                for: 6h
                labels:
                  severity: warning
                annotations:
                  summary: "TrueNAS dataset {{ $labels.dataset }} holds more snapshot than live data"
                  description: >-
                    Snapshots on {{ $labels.dataset }} are {{ $value | humanize }}x its live
                    data. refquota does not bound snapshots, so this consumes pool space that
                    no dataset-level alert can see. Review the snapshot retention task.
              # Guards, not alerts about the NAS.
              #
              # Every rule above depends on a metric family that can stop
              # arriving without anything failing. Four of the six rules in this
              # group could not fire at all until 2026-08-21, and every one of
              # them failed the same way: the expression returned an empty vector
              # and Prometheus reported the alert as healthily inactive. Nothing
              # says "this alert has had no data for a month".
              #
              # `up` does not cover this. It is scraped from graphite-exporter,
              # not from the NAS -- TrueNAS pushes, Prometheus scrapes the
              # exporter -- so if netdata stops sending, the exporter stays
              # perfectly scrapeable and `up` stays 1 while the series vanish.
              # That has already happened: a TrueNAS update reset
              # /etc/netdata/netdata.conf and silently dropped arcstats,
              # diskspace, meminfo and disk I/O, and it went unnoticed until an
              # unrelated audit.
              #
              # One rule per family rather than an `or` chain. absent() returns a
              # series carrying the matcher's labels, so every branch of a chain
              # produces an identical {job="truenas"} label set -- it fires
              # without naming what went missing, which is the only useful thing
              # it could say. The repetition below is the price of the alert
              # telling you what broke.
              #
              # `for: 10m` rides out a Prometheus restart or a rolling deploy of
              # the exporter. Note the graphite-sourced families inherit a slower
              # floor: graphite_exporter holds samples for 15m (see
              # graphite-exporter.yaml), so worst-case detection there is nearer
              # 25 minutes than 10.
              - alert: TrueNASMetricSeriesMissing
                expr: absent(cpu_total{job="truenas"})
                for: 10m
                labels:
                  severity: warning
                  series: cpu_total
                annotations:
                  summary: "TrueNAS has stopped reporting cpu_total"
                  description: >-
                    Source: netdata /proc/stat, via graphite. CPU usage alerting goes blind.
                    The scrape target is likely still up -- this alert exists because a
                    metric family that simply stops arriving is invisible, and an alert
                    built on it reads as permanently healthy rather than broken.
              - alert: TrueNASMetricSeriesMissing
                expr: absent(physical_memory{job="truenas"})
                for: 10m
                labels:
                  severity: warning
                  series: physical_memory
                annotations:
                  summary: "TrueNAS has stopped reporting physical_memory"
                  description: >-
                    Source: netdata /proc/meminfo, via graphite. Memory pressure alerting goes blind. Dropped by a TrueNAS update resetting netdata.conf.
                    The scrape target is likely still up -- this alert exists because a
                    metric family that simply stops arriving is invisible, and an alert
                    built on it reads as permanently healthy rather than broken.
              - alert: TrueNASMetricSeriesMissing
                expr: absent(truenas_arcstats{job="truenas"})
                for: 10m
                labels:
                  severity: warning
                  series: truenas_arcstats
                annotations:
                  summary: "TrueNAS has stopped reporting truenas_arcstats"
                  description: >-
                    Source: netdata /proc/spl/kstat/zfs/arcstats, via graphite. ARC hit ratio alerting goes blind. Dropped by a TrueNAS update resetting netdata.conf.
                    The scrape target is likely still up -- this alert exists because a
                    metric family that simply stops arriving is invisible, and an alert
                    built on it reads as permanently healthy rather than broken.
              - alert: TrueNASMetricSeriesMissing
                expr: absent(disk_bytes_used{job="truenas"})
                for: 10m
                labels:
                  severity: warning
                  series: disk_bytes_used
                annotations:
                  summary: "TrueNAS has stopped reporting disk_bytes_used"
                  description: >-
                    Source: netdata diskspace, via graphite. Pool capacity alerting goes blind. Dropped by a TrueNAS update resetting netdata.conf.
                    The scrape target is likely still up -- this alert exists because a
                    metric family that simply stops arriving is invisible, and an alert
                    built on it reads as permanently healthy rather than broken.
              - alert: TrueNASMetricSeriesMissing
                expr: absent(disk_temperature{job="truenas"})
                for: 10m
                labels:
                  severity: warning
                  series: disk_temperature
                annotations:
                  summary: "TrueNAS has stopped reporting disk_temperature"
                  description: >-
                    Source: truenas-api-exporter, read from the API. Thermal alerting on six NVMe drives goes blind. This is the one that was already broken for a day without anyone noticing.
                    The scrape target is likely still up -- this alert exists because a
                    metric family that simply stops arriving is invisible, and an alert
                    built on it reads as permanently healthy rather than broken.
              # absent() cannot see this one.
              #
              # truenas-api-exporter deliberately keeps its last readings
              # when a poll fails, because a failed scrape is not a cold drive.
              # That means disk_temperature stays present but stale, and the
              # guard above never fires. This is the metric that says the
              # readings are old. Same shape as EolCatalogMissing.
              #
              # If the pod dies outright, this series disappears too and the
              # absent() guard on disk_temperature is what catches it. The two
              # together cover both failures; neither covers both alone.
              - alert: TrueNASMetricSeriesMissing
                expr: absent(truenas_dataset_used_bytes)
                for: 10m
                labels:
                  severity: warning
                  series: truenas_dataset_used_bytes
                annotations:
                  summary: "TrueNAS has stopped reporting truenas_dataset_used_bytes"
                  description: >-
                    Source: pool.dataset.query, via the API exporter -- not graphite, so
                    this one detects in 10m rather than 25. Every dataset capacity alert
                    goes blind, which is the state this whole family was added to end:
                    before it, nothing in Prometheus could see the space on any dataset
                    behind a PVC.

              # Distinct from the absent() guard above, for the reason the disk
              # temperature pair already documents: the exporter serves its last
              # known values, so the series stay present and look healthy while
              # the numbers freeze. This is also the alert that fires if the
              # prom-exporter account loses DATASET_READ, since the exporter
              # deliberately degrades to temperatures-only rather than dying.
              - alert: TrueNASDatasetExporterFailing
                expr: truenas_dataset_scrape_success == 0
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "TrueNAS dataset metrics are stale (truenas-api-exporter)"
                  description: >-
                    pool.dataset.query is failing while the exporter keeps serving its
                    last known values, so truenas_dataset_* still resolves and looks
                    healthy. Likely causes: the prom-exporter account losing DATASET_READ,
                    the API key being revoked, or the gateway route being down.

              - alert: TrueNASDiskTempExporterFailing
                expr: truenas_disk_temp_scrape_success == 0
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "TrueNAS temperatures are stale (truenas-api-exporter)"
                  description: >-
                    The exporter is running and serving its last known readings, so
                    disk_temperature still resolves and looks healthy -- but the values
                    are frozen at whatever they were when polling last worked. Check the
                    pod log; the likely causes are the API key being revoked, its account
                    losing the REPORTING_READ role, or the gateway route being down.
      proxmox-health:
        groups:
          - name: proxmox-health
            rules:
              # Every pve-exporter target reports the whole cluster, so each of
              # the three scrapes carries all three nodes and all six storages.
              # Without `max by (id)` a single node going down raises the same
              # alert three times, distinguished only by which host answered.
              # The `id` label already names the subject; `instance` only names
              # the messenger, so dropping it loses nothing.
              - alert: ProxmoxNodeDown
                expr: max by (id) (pve_up{id=~"node/.*"}) == 0
                for: 1m
                labels:
                  severity: critical
                annotations:
                  summary: "Proxmox node {{ $labels.id }} is down"
                  description: "Proxmox node {{ $labels.id }} has been unreachable for more than 1 minute."
              - alert: ProxmoxVMDown
                expr: max by (id) (pve_up{id=~"qemu/(100|201|301)"}) == 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Proxmox VM {{ $labels.id }} is down"
                  description: "VM {{ $labels.id }} has been down for more than 5 minutes."
              - alert: ProxmoxHighCPU
                expr: max by (id) (pve_cpu_usage_ratio{id=~"node/.*"}) > 0.9
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "Proxmox node {{ $labels.id }} high CPU ({{ $value | humanizePercentage }})"
                  description: "CPU usage on {{ $labels.id }} has exceeded 90% for 10 minutes."
              - alert: ProxmoxHighMemory
                expr: max by (id) (pve_memory_usage_bytes{id=~"node/.*"} / pve_memory_size_bytes{id=~"node/.*"}) > 0.90
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "Proxmox node {{ $labels.id }} high memory ({{ $value | humanizePercentage }})"
                  description: "Memory usage on {{ $labels.id }} has exceeded 90% for 10 minutes."
              # id is filtered because pve_disk_usage_bytes also covers node/* --
              # the host root filesystem, already watched by ProxmoxHostDisk* --
              # and qemu/*, where usage reads 0 without the guest agent and the
              # ratio is meaningless.
              - alert: ProxmoxStorageAlmostFull
                expr: max by (id) (pve_disk_usage_bytes{id=~"storage/.*"} / pve_disk_size_bytes{id=~"storage/.*"}) > 0.85
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "Proxmox storage {{ $labels.id }} almost full ({{ $value | humanizePercentage }})"
                  description: "Storage {{ $labels.id }} is above 85% used."
              - alert: ProxmoxStorageFull
                expr: max by (id) (pve_disk_usage_bytes{id=~"storage/.*"} / pve_disk_size_bytes{id=~"storage/.*"}) > 0.95
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "Proxmox storage {{ $labels.id }} critically full ({{ $value | humanizePercentage }})"
                  description: "Storage {{ $labels.id }} is above 95% used."
              # The early-warning half of the storage rules. Same shape as the
              # TrueNAS trend alerts: a utilisation guard AND a projection, so a
              # storage that idles at a flat 12% cannot extrapolate its way into
              # an alert. Projecting usage up to size rather than headroom down
              # to zero keeps this free of a subquery.
              #
              # This covers the LVM-thin pools, which is where the guests grew to
              # 63% before anyone noticed in August 2026.
              - alert: ProxmoxStorageFillingUp
                expr: >-
                  max by (id) (
                    (pve_disk_usage_bytes{id=~"storage/.*"} / pve_disk_size_bytes{id=~"storage/.*"} > 0.50)
                    and
                    predict_linear(pve_disk_usage_bytes{id=~"storage/.*"}[7d], 30 * 24 * 3600) > pve_disk_size_bytes{id=~"storage/.*"}
                  )
                for: 6h
                labels:
                  severity: warning
                annotations:
                  summary: "Proxmox storage {{ $labels.id }} is on course to fill within 30 days"
                  description: >-
                    {{ $labels.id }} is over half full ({{ $value | humanizePercentage }})
                    and its seven-day trend projects it full inside 30 days.
              - alert: ProxmoxHostHighCPU
                expr: (1 - avg without(cpu) (rate(node_cpu_seconds_total{job="proxmox-nodes", mode="idle"}[5m]))) > 0.9
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "Proxmox host {{ $labels.instance }} high CPU"
                  description: "OS-level CPU usage on {{ $labels.instance }} has exceeded 90% for 10 minutes.\n  VALUE = {{ $value | humanizePercentage }}"
              - alert: ProxmoxHostDiskAlmostFull
                expr: (1 - node_filesystem_avail_bytes{job="proxmox-nodes", fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="proxmox-nodes", fstype!~"tmpfs|overlay"}) > 0.85
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "Proxmox host {{ $labels.instance }} disk almost full ({{ $labels.mountpoint }})"
                  description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is above 85% used.\n  VALUE = {{ $value | humanizePercentage }}"
              - alert: ProxmoxHostDiskFull
                expr: (1 - node_filesystem_avail_bytes{job="proxmox-nodes", fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="proxmox-nodes", fstype!~"tmpfs|overlay"}) > 0.95
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "Proxmox host {{ $labels.instance }} disk critically full ({{ $labels.mountpoint }})"
                  description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is above 95% used.\n  VALUE = {{ $value | humanizePercentage }}"

              # The hosts already export a full NVMe SMART set -- wear, spare,
              # media errors, the controller's own critical-warning bitfield --
              # and nothing has ever read any of it. The drives are at 9-10%
              # wear after roughly 474 days, which is fine, and is exactly why
              # this is worth watching: the number only becomes interesting long
              # after anyone has stopped thinking about it.
              #
              # Space alerts do not substitute for these. A drive wearing out
              # gives no warning through a filesystem; it reports healthy right
              # up to the point the controller goes read-only.
              - alert: ProxmoxNvmeWearHigh
                expr: nvme_percentage_used_ratio{job="proxmox-nodes"} > 0.80
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: "Proxmox host {{ $labels.instance }} NVMe {{ $labels.device }} at {{ $value | humanizePercentage }} rated life"
                  description: "The drive has consumed over 80% of its rated write endurance. Plan a replacement."
              - alert: ProxmoxNvmeWearCritical
                expr: nvme_percentage_used_ratio{job="proxmox-nodes"} > 0.90
                for: 1h
                labels:
                  severity: critical
                annotations:
                  summary: "Proxmox host {{ $labels.instance }} NVMe {{ $labels.device }} at {{ $value | humanizePercentage }} rated life"
                  description: "The drive has consumed over 90% of its rated write endurance. Replace it."
              # Compared against the drive's own reported threshold rather than a
              # number written here, so the rule stays correct across hardware.
              - alert: ProxmoxNvmeSpareLow
                expr: nvme_available_spare_ratio{job="proxmox-nodes"} <= nvme_available_spare_threshold_ratio{job="proxmox-nodes"}
                for: 15m
                labels:
                  severity: critical
                annotations:
                  summary: "Proxmox host {{ $labels.instance }} NVMe {{ $labels.device }} spare blocks exhausted"
                  description: >-
                    Available spare capacity has fallen to the threshold the drive itself
                    reports. The controller is out of blocks to remap failures onto.
              - alert: ProxmoxNvmeCriticalWarning
                expr: nvme_critical_warning{job="proxmox-nodes"} > 0
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "Proxmox host {{ $labels.instance }} NVMe {{ $labels.device }} raised a critical warning"
                  description: >-
                    The controller's critical-warning bitfield is non-zero (value
                    {{ $value }}): some combination of spare below threshold, temperature
                    beyond limits, degraded reliability, read-only media, or failed volatile
                    memory backup. Run `nvme smart-log /dev/{{ $labels.device }}`.
              - alert: ProxmoxNvmeMediaErrors
                expr: increase(nvme_media_errors_total{job="proxmox-nodes"}[1h]) > 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Proxmox host {{ $labels.instance }} NVMe {{ $labels.device }} logged media errors"
                  description: >-
                    {{ $value | humanize }} unrecovered data-integrity errors in the last
                    hour. The counter has been flat at 0; any movement is new.

              # Thin-pool metadata, from the textfile collector. The PVE API
              # reports DATA fullness only, which ProxmoxStorage* already
              # watches. Metadata is the one that does not forgive: when it
              # fills the pool goes read-only, and deleting data does not bring
              # it back because freeing a block is itself a metadata write. The
              # recovery is lvconvert --repair against a spare LV, offline.
              #
              # It is also the one nothing else would notice, because metadata
              # grows with the number of distinct blocks rather than their
              # volume -- it can approach full while data sits at 13%.
              - alert: ProxmoxThinPoolMetadataAlmostFull
                expr: lvm_thin_metadata_percent{job="proxmox-nodes"} > 80
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Proxmox thin pool {{ $labels.vg }}/{{ $labels.lv }} metadata {{ $value }}% full"
                  description: >-
                    Thin-pool metadata on {{ $labels.instance }} is above 80%. Extend it with
                    `lvextend --poolmetadatasize` while the pool is still writable.
              - alert: ProxmoxThinPoolMetadataFull
                expr: lvm_thin_metadata_percent{job="proxmox-nodes"} > 90
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "Proxmox thin pool {{ $labels.vg }}/{{ $labels.lv }} metadata {{ $value }}% full"
                  description: >-
                    Thin-pool metadata on {{ $labels.instance }} is above 90%. At 100% the pool
                    goes read-only and every guest on it stops writing.

              # A stopped timer does not look like anything. node_exporter keeps
              # serving whatever the file last contained, so lvm_thin_metadata_percent
              # stays resolvable and stays low -- the same failure mode the
              # TrueNAS staleness guards exist for. The timer runs every 5m;
              # 20 minutes of no rewrite means it is not running.
              - alert: ProxmoxThinPoolMetricsStale
                expr: time() - node_textfile_mtime_seconds{job="proxmox-nodes", file=~".*lvm_thin.prom"} > 1200
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "Proxmox host {{ $labels.instance }} thin-pool metrics are stale"
                  description: >-
                    lvm_thin.prom has not been rewritten in over 20 minutes, so the metadata
                    alerts are reading frozen values. Check lvm-thin-metrics.timer.
              # 6h rather than the 10m the other staleness guards use. These
              # rules land through Flux, but the collector behind them is
              # installed by an Ansible job, so there is a window after a merge
              # where the metric legitimately does not exist yet. Six hours is
              # long enough to cover triggering that job by hand and short
              # enough to still catch the collector disappearing.
              - alert: ProxmoxThinPoolMetricsMissing
                expr: absent(lvm_thin_metadata_percent{job="proxmox-nodes"})
                for: 6h
                labels:
                  severity: warning
                annotations:
                  summary: "Proxmox thin-pool metadata metrics are absent"
                  description: >-
                    No host is reporting lvm_thin_metadata_percent. The collector script or its
                    timer is gone; run the ansible-configure-lvm-thin-metrics job.
      release-lifecycle:
        groups:
          - name: release-lifecycle
            rules:
              # The running versions are already scraped, in three different shapes:
              # node_os_info carries the OS for all six machines, kube_node_info the
              # kubelet, pve_version_info the hypervisor. This normalises all of them
              # onto the {product, cycle} pair the endoflife.date catalogue is keyed
              # by, so every alert below is a plain join rather than four
              # near-identical rules. node_os_info covers debian and ubuntu in one
              # arm because its `id` label already holds the product slug.
              #
              # The bare $1 survives Flux postBuild substitution -- a digit-leading
              # token is not a valid variable name, and this was checked with
              # `flux envsubst --strict`. Do not "correct" it to ${1}: that form is
              # a valid reference to an unset variable and would be silently blanked,
              # leaving a label_replace that matches everything and rewrites nothing.
              - record: eol:release_in_use
                expr: |-
                  group by (product, cycle) (
                    label_replace(
                      label_replace(node_os_info, "product", "$1", "id", "(.+)"),
                      "cycle", "$1", "version_id", "(.+)"))
                  or
                  group by (product, cycle) (
                    label_replace(
                      label_replace(kube_node_info, "product", "kubernetes", "", ""),
                      "cycle", "$1", "kubelet_version", "v(\\d+\\.\\d+)\\..*"))
                  or
                  group by (product, cycle) (
                    label_replace(
                      label_replace(pve_version_info, "product", "proxmox-ve", "", ""),
                      "cycle", "$1", "version", "(\\d+)\\..*"))
              # The alert that was missing. PVE 8 reached end of life on 2026-08-31
              # and the upgrade off it beat that by twelve days on luck alone.
              #
              # This fires immediately on rollout, correctly: k3s v1.32.4 is upstream
              # Kubernetes 1.32, which went end of life on 2026-02-28. It is a
              # standing condition rather than an incident, which is why Release*
              # alerts get their own Alertmanager route with a weekly repeat.
              - alert: ReleaseEndOfLife
                expr: eol:release_in_use * on (product, cycle) group_left() eol_cycle_is_eol == 1
                for: 1h
                labels:
                  severity: critical
                annotations:
                  summary: "{{ $labels.product }} {{ $labels.cycle }} is past end of life"
                  description: "{{ $labels.product }} {{ $labels.cycle }} is running somewhere in the stack and no longer receives security updates upstream. This does not resolve on its own -- it needs a major-version upgrade."
              # 90 days is the lead time to plan a hypervisor upgrade rather than
              # scramble one. Bounded below by zero so an already-expired cycle
              # reports only as ReleaseEndOfLife instead of firing twice.
              - alert: ReleaseEndOfLifeApproaching
                expr: |-
                  (
                    eol:release_in_use * on (product, cycle) group_left() eol_cycle_eol_timestamp_seconds
                    - time()
                  ) / 86400 > 0 < 90
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: "{{ $labels.product }} {{ $labels.cycle }} reaches end of life in {{ $value | humanize }} days"
                  description: "{{ $labels.product }} {{ $labels.cycle }} is running somewhere in the stack and loses upstream support in under 90 days. Plan the upgrade now; this is the window the PVE 8 to 9 migration did not have."
              # Fires when something in use is absent from the catalogue entirely --
              # a product dropped from EOL_PRODUCTS, a slug renamed upstream, or a
              # new cycle that endoflife.date has not published yet. Without this,
              # the two alerts above would simply go quiet, which looks identical to
              # everything being supported. Six hours, because it is also what a
              # partially-fetched catalogue looks like just after a restart.
              - alert: ReleaseNotInEolCatalog
                expr: eol:release_in_use unless on (product, cycle) eol_cycle_info
                for: 6h
                labels:
                  severity: warning
                annotations:
                  summary: "No end-of-life data for {{ $labels.product }} {{ $labels.cycle }}"
                  description: "{{ $labels.product }} {{ $labels.cycle }} is running but the exporter has no catalogue entry for it, so no end-of-life alert can fire for it. Check EOL_PRODUCTS in eol-exporter.yaml and that the cycle exists at endoflife.date."
              # 48 hours against a six-hour refresh: seven consecutive failures. A
              # single failed poll is not worth a push when the underlying data
              # changes a few times a year.
              - alert: EolCatalogStale
                expr: time() - max by (product) (eol_fetch_success_timestamp_seconds) > 172800
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: "End-of-life catalogue is stale for {{ $labels.product }}"
                  description: "The exporter has not fetched {{ $labels.product }} successfully in over 48 hours. It is still serving the last good catalogue, so alerts still evaluate, but against data that is no longer being refreshed."
              # The one that catches silent failure, and the reason it is separate
              # from EolCatalogStale: a product that has never fetched has no
              # timestamp series at all, so subtracting from it yields nothing and
              # the stale alert cannot see it. Same shape, and the same reasoning, as
              # PostgresBackupMissing above.
              - alert: EolCatalogMissing
                expr: eol_fetch_success == 0 unless on (product) eol_fetch_success_timestamp_seconds
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: "End-of-life catalogue was never fetched for {{ $labels.product }}"
                  description: "The exporter has not once fetched {{ $labels.product }} since it started. Either the slug is wrong -- it must match an endoflife.date product -- or the pod cannot reach the API."
      postgres-backups:
        groups:
          - name: postgres-backups
            rules:
              # These are the plugin's metrics, not the cnpg_collector_* ones of
              # the same shape. The in-core metrics stopped updating when backups
              # moved to the barman-cloud plugin, and they keep whatever value
              # they last held -- n8n-database still reports a failed backup from
              # the rollout race in #741 through the old metric. Alerting on those
              # names would fire forever on a cluster that is fine.
              - alert: PostgresBackupStale
                expr: time() - max by (namespace, pod) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp > 0) > 36 * 3600
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: "Postgres backup is stale ({{ $labels.namespace }})"
                  description: "The newest base backup for {{ $labels.pod }} is more than 36 hours old. Backups run nightly, so one missed run is tolerated before this fires. WAL archiving may still be working, in which case recovery is possible but slower."
              # Ordered comparison rather than a threshold on the failure
              # timestamp: a failure that is older than the last success is a
              # problem that has already resolved itself.
              - alert: PostgresBackupFailing
                expr: barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp > barman_cloud_cloudnative_pg_io_last_available_backup_timestamp
                for: 15m
                labels:
                  severity: critical
                annotations:
                  summary: "Postgres backups are failing ({{ $labels.namespace }})"
                  description: "The most recent backup attempt for {{ $labels.pod }} failed and no later one has succeeded. Check the plugin-barman-cloud container in the instance pod."
              # The one that catches silent failure. Both timestamps read zero
              # until a cluster's first successful backup, so a cluster that has
              # never been backed up looks exactly like one whose backups are
              # merely quiet -- and PostgresBackupStale cannot see it, because
              # its `> 0` filter drops the series.
              - alert: PostgresBackupMissing
                expr: barman_cloud_cloudnative_pg_io_last_available_backup_timestamp == 0
                for: 6h
                labels:
                  severity: critical
                annotations:
                  summary: "Postgres cluster has never been backed up ({{ $labels.namespace }})"
                  description: "{{ $labels.pod }} reports no available backup at all. Either it was added without an ObjectStore and ScheduledBackup, or its first backup has never succeeded. A restore is not possible."
      pod-not-healthy:
        groups:
          - name: pod-not-healthy-group
            rules:
              - alert: KubernetesPodNotHealthy
                expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed", namespace!="renovate"}) > 0
                for: 10m
                labels:
                  severity: critical
                annotations:
                  summary: Kubernetes Pod not healthy (instance {{ $labels.instance }})
                  description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-running state for longer than 10 minutes.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
              # Renovate needs its own copy of the rule above, but note it excludes the
              # opposite phase to what it used to. Until #775 the exclusion was `Pending`,
              # because a 30+ minute `chown -R` over NFS left the pod in PodInitializing
              # and this rule fired on every single run. That chown is gone and a run is
              # now ~3 minutes, so `Pending` is meaningful again -- it is what catches a
              # pod that cannot schedule, cannot pull, or is waiting on a PVC that will
              # not bind because the NAS is down.
              #
              # `Failed` is excluded instead, and for a different reason: it does not
              # decay. With backoffLimit: 0 a failed run is normal and self-correcting --
              # a drained node, a github blip, the next tick 30 minutes later is the retry
              # -- but the pod sits in Failed for the full ttlSecondsAfterFinished (24h),
              # so a `> 0` gauge latches for a day off one transient event. That is the
              # exact shape that made KubeJobFailed unreadable before it was null-routed.
              # RenovateStale is what covers a run that is genuinely, repeatedly failing.
              - alert: KubernetesPodNotHealthy
                expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown", namespace="renovate"}) > 0
                for: 10m
                labels:
                  severity: critical
                annotations:
                  summary: Kubernetes Pod not healthy (instance {{ $labels.instance }})
                  description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-running state for longer than 10 minutes.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
              - alert: KubernetesDaemonsetRolloutStuck
                expr: kube_daemonset_status_number_ready / kube_daemonset_status_desired_number_scheduled * 100 < 100 or kube_daemonset_status_desired_number_scheduled - kube_daemonset_status_current_number_scheduled > 0
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: Kubernetes DaemonSet rollout stuck (instance {{ $labels.instance }})
                  description: "Some Pods of DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} are not scheduled or not ready\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
              - alert: ContainerHighCpuUtilization
                expr: (sum(rate(container_cpu_usage_seconds_total{container!=""}[5m])) by (pod, container) / sum(container_spec_cpu_quota{container!=""}/container_spec_cpu_period{container!=""}) by (pod, container) * 100) > 80
                for: 2m
                labels:
                  severity: warning
                annotations:
                  summary: Container High CPU utilization (instance {{ $labels.instance }})
                  description: "Container CPU utilization is above 80%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
              - alert: ContainerHighMemoryUsage
                expr: (sum(container_memory_working_set_bytes{name!=""}) BY (instance, name) / sum(container_spec_memory_limit_bytes > 0) BY (instance, name) * 100) > 80
                for: 2m
                labels:
                  severity: warning
                annotations:
                  summary: Container High Memory usage (instance {{ $labels.instance }})
                  description: "Container Memory usage is above 80%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
              - alert: KubernetesContainerOomKiller
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                for: 0m
                labels:
                  severity: warning
                annotations:
                  summary: Kubernetes Container oom killer (instance {{ $labels.instance }})
                  description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
              - alert: KubernetesPodCrashLooping
                expr: increase(kube_pod_container_status_restarts_total[1m]) > 3
                for: 2m
                labels:
                  severity: warning
                annotations:
                  summary: Kubernetes pod crash looping (instance {{ $labels.instance }})
                  description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
      renovate:
        groups:
          - name: renovate-group
            rules:
              # A CronJob is healthy when it recently *succeeded*, not when no failed
              # Job object happens to exist. The upstream KubeJobFailed is a bare
              # `> 0` gauge, so with ttlSecondsAfterFinished at 24h a single dead pod
              # held it firing for a full day and re-notified at the 12h repeat -- one
              # transient failure read as a permanent outage. That alert is routed to
              # "null" for this namespace; this is what replaces it.
              #
              # 6h is ~12 consecutive missed runs against the */30 schedule: wide
              # enough to sit out a rolling k3s upgrade draining nodes under a job
              # with backoffLimit: 0, narrow enough to still mean something. Unlike
              # any pod-phase rule, this also catches "never ran at all".
              - alert: RenovateStale
                expr: time() - kube_cronjob_status_last_successful_time{namespace="renovate", cronjob="renovate-bot"} > 21600
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: Renovate has not completed a successful run in over 6 hours
                  description: "renovate-bot last succeeded {{ $value | humanizeDuration }} ago. Runs are scheduled every 30 minutes, so this is ~12 consecutive failures or a CronJob that is suspended and was never resumed."
      flux-reconciliation:
        groups:
          - name: flux-reconciliation-group
            rules:
              - alert: FluxReconciliationFailure
                expr: gotk_reconcile_condition{type="Ready", status="False", kind=~"Kustomization|HelmRelease"} == 1
                for: 15m
                labels:
                  severity: critical
                annotations:
                  summary: "Flux {{ $labels.kind }} {{ $labels.namespace }}/{{ $labels.name }} reconciliation failing"
                  description: "{{ $labels.kind }} {{ $labels.name }} in namespace {{ $labels.namespace }} has not reconciled successfully for more than 15 minutes."
              - alert: FluxReconciliationStalled
                expr: gotk_reconcile_condition{type="Ready", status="Unknown", kind=~"Kustomization|HelmRelease"} == 1
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: "Flux {{ $labels.kind }} {{ $labels.namespace }}/{{ $labels.name }} reconciliation stalled"
                  description: "{{ $labels.kind }} {{ $labels.name }} in namespace {{ $labels.namespace }} has been in Unknown state for more than 30 minutes."
              - alert: FluxSourceFailure
                expr: gotk_reconcile_condition{type="Ready", status="False", kind=~"GitRepository|HelmRepository|OCIRepository|Bucket"} == 1
                for: 15m
                labels:
                  severity: critical
                annotations:
                  summary: "Flux source {{ $labels.namespace }}/{{ $labels.name }} failing"
                  description: "{{ $labels.kind }} {{ $labels.name }} in namespace {{ $labels.namespace }} has failed to fetch for more than 15 minutes."
              - alert: FluxSuspendedTooLong
                expr: gotk_suspend_status == 1
                for: 24h
                labels:
                  severity: warning
                annotations:
                  summary: "Flux {{ $labels.kind }} {{ $labels.namespace }}/{{ $labels.name }} suspended for >24h"
                  description: "{{ $labels.kind }} {{ $labels.name }} in namespace {{ $labels.namespace }} has been suspended for more than 24 hours. This may be intentional, but verify it wasn't forgotten."
