# Lifecycle awareness. PVE 8 went end of life on 2026-08-31 and the upgrade off it
# landed on 2026-08-19 with twelve days to spare -- not because anything watched,
# but because someone happened to open the PVE web UI. Renovate covers images and
# charts, ansible-update-linux covers packages; neither has any notion of a major
# release reaching the end of its support window.
#
# The poller itself is data/eol_exporter.py, pulled in by the configMapGenerator in
# kustomization.yaml so it stays a real Python file rather than a YAML block scalar.
# It publishes only the endoflife.date catalogue and deliberately does not discover
# what this cluster runs -- node_os_info, kube_node_info and pve_version_info already
# carry that for all six machines, so gathering it again here would mean a second
# source of truth and PVE credentials this pod has no other reason to hold. The join
# happens in PromQL, in the release-lifecycle rule group in helm.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eol-exporter
  namespace: prometheus
  labels:
    app: eol-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eol-exporter
  template:
    metadata:
      labels:
        app: eol-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: eol-exporter
          image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/eol_exporter.py"]
          env:
            # Products are configuration, not code -- tracking another one is an
            # edit here, not a change to the script. Names are endoflife.date
            # product slugs. There is no k3s slug, so kubernetes stands in for it;
            # the rule group strips the +k3s suffix off kubelet_version to match.
            - name: EOL_PRODUCTS
              value: "proxmox-ve,debian,ubuntu,kubernetes"
            # Six hours. The data changes a few times a year.
            - name: EOL_REFRESH_SECONDS
              value: "21600"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 9099
              protocol: TCP
          # Gated on having a catalogue, not on the port being open, so a pod that
          # has never reached endoflife.date is never scraped as though its empty
          # catalogue were the truth.
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /app
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: eol-exporter-config
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: eol-exporter-svc
  namespace: prometheus
  labels:
    app: eol-exporter
spec:
  type: ClusterIP
  selector:
    app: eol-exporter
  ports:
    - name: http
      port: 9099
      targetPort: http
      protocol: TCP
