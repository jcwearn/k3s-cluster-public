# k3s reads this Secret (--etcd-s3-config-secret) for the credentials and
# target of every etcd snapshot upload, so the nodes' config.yaml carries
# only `etcd-s3: true` and the Secret's name. Rotating the token never
# touches a node.
#
# The three values come from cloudflare-infra's outputs -- see its README,
# "The etcd snapshot token, likewise". The endpoint is the account's R2
# hostname WITHOUT a scheme; it embeds the account id, which is why it lives
# in the encrypted half rather than as ${R2_ENDPOINT} (that has the scheme,
# and this path has no postBuild anyway).
#
# Fill in the three placeholders, then encrypt in place:
#
#   sops -e -i infrastructure/k3s-server/etcd-s3-secret.sops.yaml
#
# Never copy another encrypted file to make this one.
