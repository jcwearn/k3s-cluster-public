# kube-linter runs in CI against the RENDERED overlays (scripts/render-all.sh),
# so it sees what Flux applies, post-substitution. It never sees the objects a
# HelmRelease produces, so chart-managed workloads are out of its reach.
#
# Checks are opted in one at a time rather than with addAllBuiltIn, and only
# once every existing violation is either fixed or carries an
#   ignore-check.kube-linter.io/<check>: "<reason>"
# annotation. That annotation list IS the exception list -- there is no second
# one -- so a new exception needs a reason written next to it.
#
# The rollout of the remaining checks is tracked in
# docs/plans/cluster-hardening/. Each phase adds its check here in the same PR
# that fixes the workloads it would flag:
#
# schema-validation is deliberately absent: kubeconform does the same job with
# the CRD schemas kube-linter lacks, in the step before this one.
checks:
  doNotAutoAddDefaults: true
  addAllBuiltIn: false
  include:
    # Repo rule from CLAUDE.md: every container declares requests and limits.
    - unset-cpu-requirements
    - unset-memory-requirements
    # Renovate pins by digest; an untagged or :latest image escapes it.
    - latest-tag
    # Wiring mistakes that render fine and fail on the cluster.
    - invalid-target-ports
    - mismatching-selector
    - dangling-service
    - dangling-ingress
    - dangling-servicemonitor
    - dangling-networkpolicy
    - dangling-networkpolicypeer-podselector
    - non-existent-service-account
    - duplicate-env-var
    # Host-namespace and host-filesystem access.
    - host-network
    - host-pid
    - host-ipc
    - privileged-container
    - docker-sock
    - sensitive-host-mounts
    - unsafe-proc-mount
    # Not the built-in unsafe-sysctls: its list is the bare prefix "net.",
    # which flags the sysctls Kubernetes itself calls safe. The custom check
    # below uses the same template with a list that mirrors the kubelet's.
    - unsafe-sysctls-k8s
    # A Secret's value belongs in a volume or a secretKeyRef, not a literal.
    - env-var-secret
    # A hung pod without a liveness probe stays hung; one without readiness
    # stays in the Service while it is hung.
    - no-liveness-probe
    - no-readiness-probe
    # The restricted Pod Security profile, as far as a linter can see it. The
    # exceptions carry an annotation with the reason; today those are the
    # linuxserver s6 images (root, then drop to PUID), paperless-ngx (the
    # same), the ansible CronJobs (a root-owned 0400 key), gluetun and
    # kube-vip (NET_ADMIN/NET_RAW are the job).
    - run-as-non-root
    - privilege-escalation-container
    - drop-net-raw-capability

customChecks:
  # The kubelet's safe sysctls, which the restricted Pod Security profile
  # also allows, are net.ipv4.ip_unprivileged_port_start (how the nginx
  # frontends bind :80 as uid 101), ip_local_port_range, ip_local_reserved_ports,
  # ping_group_range, tcp_syncookies, tcp_keepalive_*, tcp_fin_timeout and
  # kernel.shm_rmid_forced. Everything else namespaced is unsafe. The template
  # matches by prefix, so the list below names the unsafe families one level
  # more specifically than "net." in order to leave those alone. tcp_* and
  # kernel.shm* are listed whole -- stricter than the kubelet -- because nothing
  # here uses the safe members and widening is a one-line edit when it does.
  - name: unsafe-sysctls-k8s
    template: unsafe-sysctls
    description: "Flags sysctls outside the kubelet's safe set"
    remediation: "Use only the safe sysctls (see .kube-linter.yaml) or drop the sysctl."
    scope:
      objectKinds:
        - DeploymentLike
    params:
      unsafeSysCtls:
        - kernel.msg
        - kernel.sem
        - kernel.shm
        - fs.mqueue.
        - net.core.
        - net.ipv6.
        - net.netfilter.
        - net.bridge.
        - net.ipv4.conf.
        - net.ipv4.route.
        - net.ipv4.neigh.
        - net.ipv4.icmp_
        - net.ipv4.igmp_
        - net.ipv4.ip_forward
        - net.ipv4.ip_default_ttl
        - net.ipv4.ip_no_pmtu_disc
        - net.ipv4.tcp_
        - net.ipv4.udp_
        - net.unix.
