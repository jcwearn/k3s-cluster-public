name: Validate Manifests

# Everything here reads ONE rendering of the repo, produced by
# scripts/render-all.sh: every kustomize overlay built and, where Flux has
# postBuild substitution enabled for the path, passed through
# `flux envsubst --strict`. The checks therefore see what Flux applies, and
# agree with each other about what that is.
#
# On that rendering:
#
#   1. kubeconform  -- every object matches its API schema, including the CRDs
#                      (Flux, Gateway API, CNPG, cert-manager, ...) from the
#                      datreeio catalog. Strict, so an unknown field fails: a
#                      `labels:` block one indent too far left is silently
#                      dropped by the API server and caught here.
#   2. kube-linter  -- the repo's own rules (resources on every container, no
#                      untagged image, host namespaces, wiring mistakes). The
#                      checks are listed in .kube-linter.yaml.
#   3. digest check -- every image is pinned by digest unless allowlisted.
#   4. rendered diff, pull requests only -- what actually changes on the
#                      cluster, in the job summary. Not a gate. It is how a
#                      reviewer sees a `$$` collapse or a hostname change
#                      without building both trees by hand.
#
# Before rendering, scripts/check-sops-files.sh checks the encrypted secrets
# structurally, and a separate, lighter job runs yamllint over every tracked
# YAML file and zizmor over the workflows themselves.
#
# The substitution check is the guard that matters most. postBuild replaces a
# variable it cannot resolve with an empty string and reports success, so a
# typo'd name or a stray ${1} from an upstream config produces a
# healthy-looking reconcile and a silently broken resource.
# `flux envsubst --strict` is the only thing that turns that into a failure.
#
# Renovate's own config is checked separately in validate-renovate.yaml, which
# is path-filtered so it does not pay a ~45s npm install on every pull request.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint YAML and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # yamllint ships on the runner image; the version moves with it, which
      # is fine for a whitespace-and-structure linter.
      - name: yamllint
        run: yamllint --strict -f github .

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # SARIF upload needs code scanning, which a private repo on the
          # free plan does not have. Findings go to the log and fail the job.
          advanced-security: false

  validate:
    name: Render, validate schemas, lint objects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The rendered diff needs the PR base too; on push this is 0 and
          # harmless.
          fetch-depth: 0

      - name: Install flux
        uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2 # v2.9.5

      - name: Install kustomize, yq, kubeconform, kube-linter
        env:
          # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize extractVersion=^kustomize/v(?<version>.*)$
          KUSTOMIZE_VERSION: "5.8.1"
          # renovate: datasource=github-releases depName=mikefarah/yq extractVersion=^v(?<version>.*)$
          YQ_VERSION: "4.53.6"
          # renovate: datasource=github-releases depName=yannh/kubeconform extractVersion=^v(?<version>.*)$
          KUBECONFORM_VERSION: "0.8.0"
          # renovate: datasource=github-releases depName=stackrox/kube-linter extractVersion=^v(?<version>.*)$
          KUBE_LINTER_VERSION: "0.8.3"
        run: |
          set -euo pipefail
          curl -fsSL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz kustomize
          sudo install -m 755 kustomize /usr/local/bin/kustomize
          curl -fsSL -o yq \
            "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo install -m 755 yq /usr/local/bin/yq
          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 755 kubeconform /usr/local/bin/kubeconform
          curl -fsSL -o kube-linter.tar.gz \
            "https://github.com/stackrox/kube-linter/releases/download/v${KUBE_LINTER_VERSION}/kube-linter-linux.tar.gz"
          tar -xzf kube-linter.tar.gz kube-linter
          sudo install -m 755 kube-linter /usr/local/bin/kube-linter

      # Runs without the age key, so it cannot verify a MAC -- the MAC is itself
      # encrypted. What it can catch is the mistake that produced a broken file
      # here: two *.sops.yaml sharing a MAC, which means one was copied from the
      # other rather than encrypted. Flux accepts such a file; `sops -d` does
      # not, so it hides until somebody tries to edit it.
      - name: Check encrypted secrets
        run: ./scripts/check-sops-files.sh

      - name: Render every overlay
        run: ./scripts/render-all.sh rendered

      # Strict, with the `sops:` block stripped first: it is sops metadata that
      # Flux's decryption removes before apply, so the API server never sees
      # it, and the Secret schema rightly rejects it as an unknown field.
      #
      # Kinds with no schema in either location are skipped rather than
      # failed, and listed so the gap stays visible. Two whole-file-encrypted
      # secrets show up here with an ENC[...] kind; they are on the
      # cluster-hardening follow-up list.
      - name: Validate schemas (kubeconform)
        env:
          # renovate: datasource=github-releases depName=k3s-io/k3s extractVersion=^v(?<version>[0-9.]+)\+k3s\d+$
          KUBERNETES_VERSION: "1.36.4"
        run: |
          set -euo pipefail
          crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          yq 'del(.sops)' rendered/*.yaml > rendered-nosops.yaml
          kubeconform -strict -summary -ignore-missing-schemas \
            -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location default -schema-location "$crds" \
            rendered-nosops.yaml
          echo "Skipped (no schema found):"
          kubeconform -ignore-missing-schemas -output json -verbose \
            -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location default -schema-location "$crds" \
            rendered-nosops.yaml \
            | yq -p json '.resources[] | select(.status == "statusSkipped") | "  " + .kind + " " + .name' \
            || true

      - name: Lint objects (kube-linter)
        run: kube-linter lint --config .kube-linter.yaml rendered/

      - name: Check image digests
        run: ./scripts/check-image-digests.sh rendered

      # Informational. The base is rendered with the SAME scripts from this
      # checkout, so a change to the scripts themselves does not show up as a
      # change to every overlay.
      - name: Rendered diff against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git worktree add --detach base "$BASE_SHA"
          cp scripts/*.sh base/scripts/
          (cd base && ./scripts/render-all.sh ../rendered-base) || true
          {
            echo '## Rendered diff against base'
            echo
            if diff -ruN rendered-base rendered > rendered.diff; then
              echo 'No change to any rendered overlay.'
            else
              echo '```diff'
              head -c 60000 rendered.diff
              echo '```'
              if [ "$(wc -c < rendered.diff)" -gt 60000 ]; then
                echo
                echo '_Truncated at 60 kB; the full diff is in the step log._'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat rendered.diff || true
