name: Validate Renovate Config

# Renovate's config is the one thing in this repo that kustomize cannot check. The bot
# config is mounted as a ConfigMap, so a misspelled option is valid JSON, builds cleanly,
# renders cleanly -- and is then discarded at runtime behind a WARN that only appears in
# pod logs. A deprecated `dockerUser` lived there that way until somebody read the logs
# for an unrelated reason.
#
# Split out of validate.yaml rather than living beside the other checks, because `paths`
# is a workflow-level trigger in GitHub Actions and cannot be applied to a single step.
# The image pull costs the better part of a minute, which is not worth paying on pull
# requests that do not touch Renovate at all -- the vast majority of them.
#
# The validator runs from the renovate/renovate image rather than the npm package because
# the image is what a bot self-bump introduces: it exists by the time the PR is opened, or
# the bot could not have proposed it. The npm package lands a few minutes after the Docker
# tag, and validating against npm failed with ETARGET inside that window -- twice on
# 2026-09-12. The minimumReleaseAge gate added to work around that stalled every
# self-update for a week instead: Docker Hub timestamps for this image are lost whenever
# its ~46k-tag crawl fails, and a release with no timestamp is withheld permanently.
#
# apps/renovate/** is deliberately broader than the two config files: the version below
# is read from cronjob.yaml, so Renovate's own image bumps must re-trigger this and
# re-validate the config against the version they introduce. A narrower filter would let
# a bump that deprecates an option merge without ever checking.

on:
  push:
    branches:
      - main
    paths:
      # Kept in sync by hand with the pull_request list below -- GitHub Actions does not
      # support YAML anchors, so there is no way to declare this once.
      - "renovate.json"
      - "apps/renovate/**"
      - ".github/workflows/validate-renovate.yaml"
  pull_request:
    paths:
      - "renovate.json"
      - "apps/renovate/**"
      - ".github/workflows/validate-renovate.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-renovate:
    name: Validate Renovate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install yq
        env:
          YQ_VERSION: "4.53.3"
        run: |
          set -euo pipefail
          curl -fsSL -o yq \
            "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo install -m 755 yq /usr/local/bin/yq

      # The two files need opposite treatment, and getting it wrong makes the check
      # weaker rather than louder:
      #
      #   apps/renovate/data/renovate.json is global self-hosted config -- repositories,
      #   platform, hostRules -- which is the validator's default for named files.
      #
      #   renovate.json at the root is repo config. Only --no-global makes the validator
      #   reject a global-only option placed there; by default it would validate as
      #   global config, pass, and the bot would silently ignore the option at runtime.
      #
      # The version is read from the CronJob instead of pinned here, so it cannot drift
      # from the binary that actually consumes these files. The slim tag is pulled, not the
      # -full variant the bot runs: same package inside, the validator needs none of the
      # third-party tools that make -full 2.5 GiB. It is pulled by tag because the repo
      # holds no digest for it and pinning a second reference here is exactly the drift
      # reading the version from the CronJob avoids; the job has contents: read, no
      # secrets and no persisted credentials. Warnings already exit non-zero; --strict
      # additionally fails when a config migration is needed, which is the signal that
      # would otherwise decay quietly across upgrades.
      - name: Validate Renovate config
        run: |
          set -euo pipefail

          version=$(yq -r '.spec.jobTemplate.spec.template.spec.containers[0].image' \
            apps/renovate/cronjob.yaml | sed -E 's|.*renovate/renovate:([^@-]+).*|\1|')

          if [ -z "$version" ]; then
            echo "::error file=apps/renovate/cronjob.yaml::could not read the renovate image tag"
            exit 1
          fi
          image="renovate/renovate:${version}"
          echo "Validating with ${image}"
          docker pull --quiet "$image"

          validate() {
            docker run --rm -v "$PWD:/repo:ro" -w /repo "$image" \
              renovate-config-validator "$@"
          }

          validate --strict apps/renovate/data/renovate.json
          validate --strict --no-global renovate.json
