name: Reconcile Coder Infrastructure

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/coder-reconcile.yaml"
      - "apps/coder/data/workspaces.yaml"
      - "apps/coder/data/templates/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "plan or apply"
        type: choice
        required: true
        default: "plan"
        options: [plan, apply]
      recreate_on_param_change:
        description: "If checked, delete + recreate workspaces to apply parameter changes"
        type: boolean
        required: true
        default: false
      delete_missing:
        description: "If checked, delete workspaces not in workspaces.yaml"
        type: boolean
        required: true
        default: false
      push_templates:
        description: "If checked, push templates before managing workspaces"
        type: boolean
        required: true
        default: true

env:
  # Pinned to match the Coder Helm chart version in apps/coder/helm.yaml so the CLI and the
  # server stay in lockstep.
  # renovate: datasource=github-releases depName=coder/coder
  CODER_VERSION: "2.36.0"

jobs:
  push-templates:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.push_templates == true)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Runs before Tailscale so the lookup uses the runner's own resolver. The record is a
      # CNAME to a *.ts.net name that only the tailnet can turn into an address, so the node
      # name is carried forward and resolved from the peer list once Tailscale is up.
      - name: Resolve Coder host
        env:
          CODER_URL: ${{ vars.CODER_URL }}
        run: |
          set -euo pipefail

          # vars.CODER_URL expands to an empty string when the repository variable is
          # unset, and the Coder CLI would then act against an empty endpoint rather
          # than erroring. A push to main runs this workflow in apply mode, so fail here.
          if [ -z "$CODER_URL" ]; then
            echo "::error::Repository variable CODER_URL is not set."
            echo "Set it with: gh variable set CODER_URL --body https://<coder-host>"
            exit 1
          fi

          host="${CODER_URL#*://}"
          host="${host%%/*}"
          node="$(dig +short CNAME "$host" | head -1 | sed 's/\.$//')"
          if [ -z "$node" ]; then
            echo "::error::The CODER_URL host does not CNAME to a tailnet node."
            exit 1
          fi
          {
            echo "CODER_HOST=$host"
            echo "CODER_TS_NODE=${node%%.*}"
          } >> "$GITHUB_ENV"

      # Must stay above "Connect to Tailscale". The action brings the runner up with
      # --accept-routes and adopts the tailnet DNS config, which points every lookup at the
      # AdGuard resolvers on the LAN -- reachable only through the subnet router. A public
      # name like github.com then resolves only while that path is healthy, and a blip fails
      # the download. Everything fetched from the internet is fetched before that happens.
      #
      # The install.sh one-liner resolves the mainline version through an unauthenticated
      # api.github.com call, and that limit is 60/hr per IP shared across every hosted
      # runner, so it 403s at random. Release assets are not on that limit.
      - name: Install Coder CLI
        run: |
          set -euo pipefail
          # The archive carries a README and a LICENSE alongside the binary, so unpack it
          # somewhere other than the checkout.
          tmp="$(mktemp -d)"
          curl -fsSL --retry 3 --retry-delay 5 -o "$tmp/coder.tar.gz" \
            "https://github.com/coder/coder/releases/download/v${CODER_VERSION}/coder_${CODER_VERSION}_linux_amd64.tar.gz"
          tar -xzf "$tmp/coder.tar.gz" -C "$tmp"
          sudo install -m 755 "$tmp/coder" /usr/local/bin/coder
          coder version

      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: coder

      # The tailnet hands out the LAN resolvers as its nameservers, and a runner can only
      # reach those through the subnet router -- the hop that has been failing and taking
      # the whole workflow down with it. Take the address from the tailnet peer list
      # instead: /etc/hosts wins over DNS, so the Coder calls need no lookup at all.
      - name: Point Coder host at its tailnet address
        run: |
          set -euo pipefail
          addr="$(sudo tailscale ip -4 "$CODER_TS_NODE")"
          echo "$addr $CODER_HOST" | sudo tee -a /etc/hosts >/dev/null

          # tailscale up returning does not mean the path to the gateway is ready, so give
          # it a few tries before failing the job.
          for i in $(seq 1 6); do
            if curl -fsS --max-time 10 -o /dev/null "https://$CODER_HOST/api/v2/buildinfo"; then
              echo "Coder API reachable."
              exit 0
            fi
            echo "Attempt $i: Coder API not reachable yet; retrying in 10s."
            sleep 10
          done
          echo "::error::Coder API did not become reachable over the tailnet."
          exit 1

      - name: Push Kubernetes Template
        env:
          CODER_URL: ${{ vars.CODER_URL }}
          CODER_SESSION_TOKEN: ${{ secrets.CODER_SESSION_TOKEN }}
        run: |
          coder templates push kubernetes \
            --directory apps/coder/data/templates/kubernetes \
            --variable namespace=coder \
            --yes

  manage-workspaces:
    runs-on: ubuntu-latest
    needs: push-templates
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Runs before Tailscale so the lookup uses the runner's own resolver. The record is a
      # CNAME to a *.ts.net name that only the tailnet can turn into an address, so the node
      # name is carried forward and resolved from the peer list once Tailscale is up.
      - name: Resolve Coder host
        env:
          CODER_URL: ${{ vars.CODER_URL }}
        run: |
          set -euo pipefail

          # vars.CODER_URL expands to an empty string when the repository variable is
          # unset, and the Coder CLI would then act against an empty endpoint rather
          # than erroring. A push to main runs this workflow in apply mode, so fail here.
          if [ -z "$CODER_URL" ]; then
            echo "::error::Repository variable CODER_URL is not set."
            echo "Set it with: gh variable set CODER_URL --body https://<coder-host>"
            exit 1
          fi

          host="${CODER_URL#*://}"
          host="${host%%/*}"
          node="$(dig +short CNAME "$host" | head -1 | sed 's/\.$//')"
          if [ -z "$node" ]; then
            echo "::error::The CODER_URL host does not CNAME to a tailnet node."
            exit 1
          fi
          {
            echo "CODER_HOST=$host"
            echo "CODER_TS_NODE=${node%%.*}"
          } >> "$GITHUB_ENV"

      # Must stay above "Connect to Tailscale" -- see the note in push-templates. jq is
      # preinstalled on ubuntu-latest, so only yq is fetched here.
      - name: Install Coder CLI
        run: |
          set -euo pipefail
          # The archive carries a README and a LICENSE alongside the binary, so unpack it
          # somewhere other than the checkout.
          tmp="$(mktemp -d)"
          curl -fsSL --retry 3 --retry-delay 5 -o "$tmp/coder.tar.gz" \
            "https://github.com/coder/coder/releases/download/v${CODER_VERSION}/coder_${CODER_VERSION}_linux_amd64.tar.gz"
          tar -xzf "$tmp/coder.tar.gz" -C "$tmp"
          sudo install -m 755 "$tmp/coder" /usr/local/bin/coder
          coder version

      - name: Install yq
        env:
          YQ_VERSION: "4.53.3"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 -o yq \
            "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo install -m 755 yq /usr/local/bin/yq

      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: coder

      # See the note in push-templates.
      - name: Point Coder host at its tailnet address
        run: |
          set -euo pipefail
          addr="$(sudo tailscale ip -4 "$CODER_TS_NODE")"
          echo "$addr $CODER_HOST" | sudo tee -a /etc/hosts >/dev/null

          for i in $(seq 1 6); do
            if curl -fsS --max-time 10 -o /dev/null "https://$CODER_HOST/api/v2/buildinfo"; then
              echo "Coder API reachable."
              exit 0
            fi
            echo "Attempt $i: Coder API not reachable yet; retrying in 10s."
            sleep 10
          done
          echo "::error::Coder API did not become reachable over the tailnet."
          exit 1

      - name: Reconcile Workspaces (plan/apply)
        env:
          CODER_URL: ${{ vars.CODER_URL }}
          CODER_SESSION_TOKEN: ${{ secrets.CODER_SESSION_TOKEN }}
          MODE: ${{ inputs.mode || 'apply' }}
          RECREATE_ON_PARAM_CHANGE: ${{ inputs.recreate_on_param_change || 'false' }}
          DELETE_MISSING: ${{ inputs.delete_missing || 'false' }}
        run: |
          set -euo pipefail

          WORKSPACES_FILE="apps/coder/data/workspaces.yaml"
          DOTFILES_URI="https://github.com/jcwearn/dotfiles-coder"

          echo "MODE=$MODE"
          echo "RECREATE_ON_PARAM_CHANGE=$RECREATE_ON_PARAM_CHANGE"
          echo "DELETE_MISSING=$DELETE_MISSING"

          actual_json="$(coder list --output json)"
          actual_names="$(echo "$actual_json" | jq -r '.[].name' | sort -u)"

          desired_count="$(yq '.workspaces | length' "$WORKSPACES_FILE")"
          if [ "$desired_count" -eq 0 ]; then
            echo "No workspaces found in $WORKSPACES_FILE"
            exit 0
          fi

          desired_names=()

          workspace_exists() {
            local n="$1"
            echo "$actual_json" | jq -e --arg n "$n" '.[] | select(.name == $n)' >/dev/null 2>&1
          }

          plan_actions=()

          for ((i=0; i<desired_count; i++)); do
            name="$(yq -r ".workspaces[$i].name" "$WORKSPACES_FILE")"
            template="$(yq -r ".workspaces[$i].template" "$WORKSPACES_FILE")"
            repo="$(yq -r ".workspaces[$i].repo" "$WORKSPACES_FILE")"
            cpu="$(yq -r ".workspaces[$i].parameters.cpu" "$WORKSPACES_FILE")"
            memory="$(yq -r ".workspaces[$i].parameters.memory" "$WORKSPACES_FILE")"
            home_disk_size="$(yq -r ".workspaces[$i].parameters.home_disk_size" "$WORKSPACES_FILE")"
            autostart="$(yq -r ".workspaces[$i].schedule.autostart // \"\"" "$WORKSPACES_FILE")"
            autostop_ttl="$(yq -r ".workspaces[$i].schedule.autostop_ttl // \"\"" "$WORKSPACES_FILE")"

            desired_names+=("$name")

            if workspace_exists "$name"; then
              if [ "$RECREATE_ON_PARAM_CHANGE" = "true" ]; then
                plan_actions+=("RECREATE $name (delete+create to apply params) template=$template repo=$repo")
              else
                plan_actions+=("UPDATE $name (coder update to latest template version)")
              fi
            else
              plan_actions+=("CREATE $name template=$template repo=$repo")
            fi
          done

          # Optional delete for workspaces not in YAML
          if [ "$DELETE_MISSING" = "true" ]; then
            desired_set="$(printf "%s\n" "${desired_names[@]}" | sort -u)"
            missing="$(comm -23 <(echo "$actual_names") <(echo "$desired_set") || true)"
            if [ -n "$missing" ]; then
              while IFS= read -r n; do
                [ -n "$n" ] && plan_actions+=("DELETE $n (not in workspaces.yaml)")
              done <<< "$missing"
            fi
          fi

          echo "Planned actions:"
          printf ' - %s\n' "${plan_actions[@]}"
          echo ""

          if [ "$MODE" = "plan" ]; then
            echo "Plan mode: no changes applied."
            exit 0
          fi

          # APPLY
          for ((i=0; i<desired_count; i++)); do
            name="$(yq -r ".workspaces[$i].name" "$WORKSPACES_FILE")"
            template="$(yq -r ".workspaces[$i].template" "$WORKSPACES_FILE")"
            repo="$(yq -r ".workspaces[$i].repo" "$WORKSPACES_FILE")"
            cpu="$(yq -r ".workspaces[$i].parameters.cpu" "$WORKSPACES_FILE")"
            memory="$(yq -r ".workspaces[$i].parameters.memory" "$WORKSPACES_FILE")"
            home_disk_size="$(yq -r ".workspaces[$i].parameters.home_disk_size" "$WORKSPACES_FILE")"
            autostart="$(yq -r ".workspaces[$i].schedule.autostart // \"\"" "$WORKSPACES_FILE")"
            autostop_ttl="$(yq -r ".workspaces[$i].schedule.autostop_ttl // \"\"" "$WORKSPACES_FILE")"

            # Build schedule args if provided
            schedule_args=()
            if [ -n "$autostart" ]; then
              schedule_args+=(--start-at "$autostart")
            fi
            if [ -n "$autostop_ttl" ]; then
              schedule_args+=(--stop-after "$autostop_ttl")
            fi

            # Build repo param if provided
            repo_args=()
            if [ -n "$repo" ] && [ "$repo" != "null" ]; then
              repo_args+=(--parameter git_repo="$repo")
            fi

            if workspace_exists "$name"; then
              if [ "$RECREATE_ON_PARAM_CHANGE" = "true" ]; then
                echo "Recreating workspace: $name"
                coder delete "$name" --yes

                echo "Creating workspace: $name"
                coder create "$name" \
                  --template "$template" \
                  --use-parameter-defaults \
                  --parameter cpu="$cpu" \
                  --parameter memory="$memory" \
                  --parameter home_disk_size="$home_disk_size" \
                  "${repo_args[@]}" \
                  --parameter dotfiles_uri="$DOTFILES_URI" \
                  "${schedule_args[@]}" \
                  --yes
              else
                echo "Updating workspace to latest template version: $name"
                # No --yes here: coder update has no such flag, and passing it made this a
                # silent no-op. Defaults cover any parameter a new template version adds.
                coder update "$name" --use-parameter-defaults \
                  || echo "WARNING: Failed to update $name"
                # Update schedule for existing workspaces
                if [ -n "$autostart" ]; then
                  echo "Setting autostart schedule for $name"
                  coder schedule start "$name" "$autostart" || true
                fi
                if [ -n "$autostop_ttl" ]; then
                  echo "Setting autostop TTL for $name"
                  coder schedule stop "$name" "$autostop_ttl" || true
                fi
              fi
            else
              echo "Creating workspace: $name"
              # --yes only skips the final confirmation. On create the CLI asks for every
              # parameter it was not given a value for, so a module that adds one (the
              # dotfiles branch, say) would block on a prompt with no stdin to read.
              coder create "$name" \
                --template "$template" \
                --use-parameter-defaults \
                --parameter cpu="$cpu" \
                --parameter memory="$memory" \
                --parameter home_disk_size="$home_disk_size" \
                "${repo_args[@]}" \
                --parameter dotfiles_uri="$DOTFILES_URI" \
                "${schedule_args[@]}" \
                --yes
            fi
          done

          if [ "$DELETE_MISSING" = "true" ]; then
            desired_set="$(yq -r '.workspaces[].name' "$WORKSPACES_FILE" | sort -u)"
            missing="$(comm -23 <(echo "$actual_names") <(echo "$desired_set") || true)"
            if [ -n "$missing" ]; then
              while IFS= read -r n; do
                [ -n "$n" ] || continue
                echo "Deleting workspace not in YAML: $n"
                coder delete "$n" --yes
              done <<< "$missing"
            fi
          fi

          echo "Reconcile complete."
