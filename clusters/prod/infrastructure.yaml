---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/prometheus
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
  # csi-driver-nfs provides the StorageClass the TSDB, Grafana and Alertmanager
  # volumes are claimed from. Without this they sit in the same dependency tier,
  # and a cold bootstrap can reach wait: true with no provisioner yet and fail
  # on the 5m timeout.
  dependsOn:
    - name: cluster-vars
    - name: csi-driver-nfs
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
