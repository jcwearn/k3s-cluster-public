apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/cloudnative-pg
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # The barman-cloud plugin's chart creates a cert-manager Issuer and two
  # Certificates for the mTLS channel between the plugin and the operator.
  # Without cert-manager's CRDs already present, those fail to apply.
  dependsOn:
    - name: cert-manager
  wait: true
---
