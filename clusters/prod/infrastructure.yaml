  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/loki
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # prometheus for the ServiceMonitor CRD, csi-driver-nfs for the
  # truenas-nfs-logs StorageClass. Nothing depends on this in turn: apps must
  # keep deploying when the log store is down.
  dependsOn:
    - name: prometheus
    - name: csi-driver-nfs
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/alloy
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # loki for the HelmRepository it shares and the endpoint it pushes to.
  # Alloy would only buffer and retry without it, but a cold bootstrap reads
  # better in order.
  dependsOn:
    - name: loki
  wait: true
---
