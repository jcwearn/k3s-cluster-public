apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/flux-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
---
# The notification objects the FluxInstance's CRDs serve. They live apart from
# flux-operator because a Flux release can promote their apiVersion: in one
# Kustomization the new apiVersion fails the server-side dry-run against the
# old CRDs, nothing applies, and the FluxInstance that would serve it never
# upgrades. dependsOn holds this one until flux-operator is Ready at the same
# revision, by which point the new CRDs are in place.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-notifications
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/flux-operator/notifications
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-operator
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-upgrade-controller
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/system-upgrade-controller
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # No postBuild. Nothing under this path uses a cluster variable, and the
  # vendored CRD is 1300 lines of upstream schema that would have to be audited
  # for braced references before substitution could be turned on safely.
  wait: true
---
# Phase 4 acceptance drill for the alert triage agent. cache-warmer's memory
# limit is too small for its working set, so it is OOMKilled and the agent
# opens a PR; the reviewer then talks to the agent about that PR from the UI
# and in PR comments. Its own Kustomization, without wait, because inside
# `apps` (wait: true) a crashlooping Deployment would fail every reconcile.
# Removed once the drill is done.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: medic-drill
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  path: ./infrastructure/medic-drill
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
