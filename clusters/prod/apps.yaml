apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
  retryInterval: 1m
  dependsOn:
    - name: cluster-vars
    - name: cert-manager-issuer
    - name: external-dns
    - name: envoy-gateway-config
    - name: prometheus
    # tailscale-operator, not tailscale-connector: the per-Service expose proxies are
    # created by the operator watching Services and do not need the Connector. Depending
    # on the Connector meant an unhealthy exit node blocked Flux from redeploying the
    # apps -- including AdGuard, which is what you would need to fix it.
    - name: tailscale-operator
    - name: truenas-nfs
    - name: cloudnative-pg
    - name: llama-cpp
  wait: true
  timeout: 5m
