apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
  retryInterval: 1m
  dependsOn:
    - name: cluster-vars
    - name: cert-manager-issuer
    - name: external-dns
    - name: envoy-gateway-config
    - name: prometheus
    - name: tailscale-connector
    - name: truenas-nfs
    - name: cloudnative-pg
    - name: llama-cpp
  wait: true
  timeout: 5m
