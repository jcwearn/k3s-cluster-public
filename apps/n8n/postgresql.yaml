apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-database
  namespace: n8n
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: 5Gi
    storageClass: truenas-nfs-postgres
  bootstrap:
    initdb:
      database: n8n
      owner: n8n
      secret:
        name: n8n-database-credentials
