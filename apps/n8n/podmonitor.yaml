# Scrape the CloudNativePG instance manager, which is where the barman-cloud
# plugin publishes its backup timestamps.
#
# Written by hand rather than generated: spec.monitoring.enablePodMonitor on the
# Cluster is deprecated in CNPG 1.30 and slated for removal.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: n8n-database
  namespace: n8n
  labels:
    # Load-bearing. kube-prometheus-stack leaves
    # podMonitorSelectorNilUsesHelmValues at its default of true, so Prometheus
    # only selects monitors carrying this label. Without it this object applies
    # cleanly, is never scraped, and every alert built on it silently never
    # evaluates.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: n8n-database
  podMetricsEndpoints:
    - port: metrics
