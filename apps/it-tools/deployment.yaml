apiVersion: apps/v1
kind: Deployment
metadata:
  name: it-tools
  namespace: it-tools
  labels:
    app.kubernetes.io/name: it-tools
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: it-tools
  template:
    metadata:
      labels:
        app.kubernetes.io/name: it-tools
    spec:
      serviceAccountName: it-tools
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
        # The image's nginx listens on 80. Lowering the unprivileged-port
        # floor lets uid 101 bind it; NET_BIND_SERVICE would not, since a
        # non-root process gets no ambient capabilities. This sysctl is on
        # the kubelet's safe list and allowed under the restricted profile.
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      containers:
        - name: it-tools
          image: "ghcr.io/corentinth/it-tools:2024.10.22-7ca5933@sha256:8b8128748339583ca951af03dfe02a9a4d7363f61a216226fc28030731a5a61f"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # The only two places stock nginx writes: the pid file and the
          # temp/cache dirs. As root it would create them; as 101 it cannot.
          volumeMounts:
            - name: run
              mountPath: /run
            - name: cache
              mountPath: /var/cache/nginx
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: run
          emptyDir: {}
        - name: cache
          emptyDir: {}
