apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
  namespace: immich
spec:
  instances: 1
  # A single-instance cluster has no replica to protect, but CNPG still generates
  # a PDB with minAvailable: 1, which reports 0 allowed disruptions. Any drain of
  # this pod's node then hangs rather than failing, so it has to be relaxed by
  # hand every time -- it blocked the Proxmox 8->9 window, and an unattended
  # system-upgrade-controller Job would simply sit there until its deadline.
  enablePDB: false
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.9-0.4.3
  # Restoring this cluster means pinning the SAME image. A recovery bootstrap
  # replays the data directory rather than running initdb, so postInitApplicationSQL
  # below does not execute -- the vchord extension comes back with the data and
  # needs the binaries that match it. Restoring onto a stock postgres image gives a
  # cluster that will not start.
  # Backups and WAL archiving, via the barman-cloud CNPG-I plugin installed in
  # cnpg-system. isWALArchiver is what makes archive_command point here; without
  # it the plugin would take base backups with no WAL to replay onto them, and
  # point-in-time recovery would not work.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-database-backups
  storage:
    size: 20Gi
    storageClass: truenas-nfs-postgres
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich-database-credentials
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
        # Might need these for proper functionality, manually granted running:
        # kubectl exec -n immich immich-database-1 -- psql -U postgres -d immich -c "GRANT pg_read_all_data TO immich; GRANT pg_read_all_stats TO immich; ALTER USER immich WITH REPLICATION;" 2>&1
        # - GRANT pg_read_all_data TO immich;
        # - GRANT pg_read_all_stats TO immich;
        # - ALTER USER immich WITH REPLICATION;
