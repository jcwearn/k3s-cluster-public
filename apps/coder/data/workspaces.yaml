workspaces:
  - name: k3s-cluster
    template: kubernetes
    repo: https://github.com/jcwearn/k3s-cluster
    parameters:
      cpu: "2"
      memory: "4"
      home_disk_size: "20"
    schedule:
      autostart: "08:00 * America/New_York"
      autostop_ttl: "16h"
  - name: cf-worker-email
    template: kubernetes
    repo: https://github.com/jcwearn/cf-worker-email
    parameters:
      cpu: "2"
      memory: "4"
      home_disk_size: "10"
    schedule:
      autostop_ttl: "1h"
  - name: anupamaandjackson
