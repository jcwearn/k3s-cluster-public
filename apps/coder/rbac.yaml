apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-read-secrets
  namespace: coder
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["coder-anthropic", "coder-kubeconfig"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-read-secrets
  namespace: coder
subjects:
  - kind: ServiceAccount
    name: coder
    namespace: coder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-read-secrets
