apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder-workspace-k3s
  namespace: coder
---
apiVersion: v1
kind: Secret
metadata:
  name: coder-workspace-k3s-token
  namespace: coder
  annotations:
    kubernetes.io/service-account.name: coder-workspace-k3s
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coder-workspace-k3s
rules:
  # Core resources - read-only
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - nodes
      - namespaces
      - persistentvolumeclaims
      - persistentvolumes
      - events
      - configmaps
    verbs: ["get", "list", "watch"]
  # Apps - read-only
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - replicasets
      - daemonsets
    verbs: ["get", "list", "watch"]
  # Batch - read-only
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  # Networking - read-only
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - httproutes
      - gateways
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  # Certificates - read-only
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificates
      - certificaterequests
      - issuers
      - clusterissuers
    verbs: ["get", "list", "watch"]
  # Flux - read-only + reconcile (patch status)
  - apiGroups:
      - source.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
    resources: ["*"]
    verbs: ["get", "list", "watch", "patch"]
  # Helm releases - read-only
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  # External DNS - read-only
  - apiGroups: ["externaldns.k8s.io"]
    resources:
      - dnsendpoints
    verbs: ["get", "list", "watch"]
  # Envoy Gateway - read-only
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Metrics
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coder-workspace-k3s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: coder-workspace-k3s
subjects:
  - kind: ServiceAccount
    name: coder-workspace-k3s
    namespace: coder
