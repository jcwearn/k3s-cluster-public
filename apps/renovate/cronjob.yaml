apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-bot
  namespace: renovate
  annotations:
    # A Job runs to completion; a probe would only ever restart it mid-run.
    ignore-check.kube-linter.io/no-liveness-probe: "run-to-completion Job"
    ignore-check.kube-linter.io/no-readiness-probe: "run-to-completion Job"
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1500
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: github-app-installation-token
              image: ghcr.io/mshekow/github-app-installation-token:2026.10.15@sha256:3ee7d5b1eae1333aa457e90f3822edcb715ccb4a5536b544714186202a43f7a8
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - >
                  token=$(node index.js $GITHUB_APP_ID $GITHUB_APP_INSTALLATION_ID /private-key/private-key.txt);
                  echo $token > /shared/token;
              volumeMounts:
                - name: private-key-volume
                  mountPath: /private-key
                - name: shared-volume
                  mountPath: /shared
              envFrom:
                - secretRef:
                    name: renovate-env
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
            # The -full image has no tofu, and truenas-infra's postUpgradeTask
            # runs `tofu init` to keep .terraform.lock.hcl in step with the
            # provider pin. Copy the binary out of the official image rather
            # than download it at run time. Not -minimal: that one is FROM
            # scratch and has no cp.
            - name: tofu
              image: ghcr.io/opentofu/opentofu:1.13.1@sha256:1df996fca13806a20d5a3d3ad54acdcf76bcb1aa4ac30b5ba169b9e4cecdbcc8
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - >
                  mkdir -p /shared/bin;
                  cp /usr/local/bin/tofu /shared/bin/tofu;
              volumeMounts:
                - name: shared-volume
                  mountPath: /shared
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: renovate-bot
              image: renovate/renovate:44.164.10-full@sha256:a19d9f806c2300b06db72761681bb933a3e6b8a539b9f1bb07bd3004ec3de6f9
              command: ["/bin/sh", "-c"]
              args:
                - >
                  export RENOVATE_TOKEN=$(cat /shared/token);
                  export PATH="/tmp/renovate/go-bin:/shared/bin:$PATH";
                  exec renovate;
              volumeMounts:
                - name: work-volume
                  mountPath: /tmp/renovate/
                - name: shared-volume
                  mountPath: /shared
                - name: renovate-config
                  mountPath: /config/renovate.json
                  subPath: renovate.json
                  readOnly: true
              resources:
                requests:
                  memory: 1.25Gi
                  cpu: 250m
                limits:
                  memory: 2Gi
                  cpu: "2"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: LOG_LEVEL
                  value: info
                - name: RENOVATE_CONFIG_FILE
                  value: /config/renovate.json
                - name: RENOVATE_CACHE_DIR
                  value: /tmp/renovate/cache
          restartPolicy: Never
          volumes:
            - name: work-volume
              # Everything that is not the config or the token: cloned repos,
              # Renovate's own cache (RENOVATE_CACHE_DIR above) and every
              # package manager's cache (pointed here by customEnvVariables).
              # All of it dies with the pod, which is the point -- see the
              # Renovate page in mkdocs for why the cache stopped being
              # persistent.
              #
              # customEnvVariables is not redundant just because the cache dir
              # is already ephemeral. Without it GOCACHE and GOMODCACHE land in
              # the container's writable layer, which no sizeLimit bounds and
              # no eviction reclaims until the node is under pressure. GOBIN is
              # load-bearing besides: the container args put it on PATH.
              #
              # sizeLimit is what keeps a runaway run from being the node's
              # problem -- an emptyDir is otherwise bounded only by node disk.
              emptyDir:
                sizeLimit: 4Gi
            - name: shared-volume
              emptyDir: {}
            - name: private-key-volume
              secret:
                secretName: renovate-env
                items:
                  - key: GITHUB_APP_PRIVATE_KEY
                    path: private-key.txt
            - name: renovate-config
              configMap:
                name: renovate-config
                defaultMode: 0444
