apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-bot
  namespace: renovate
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 2700
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
          initContainers:
            - name: init-cache-permissions
              image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
              command: ["/bin/sh", "-c"]
              args:
                - mkdir -p /cache && chown -R 1000:1000 /cache || true
              volumeMounts:
                - name: renovate-cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
            - name: github-app-installation-token
              image: ghcr.io/mshekow/github-app-installation-token:2026.07.31@sha256:cb8752da9c957f470b47abf07926bb4eb579b4e1d82a0f19b585a0474d1f1bd7
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - >
                  token=$(node index.js $GITHUB_APP_ID $GITHUB_APP_INSTALLATION_ID /private-key/private-key.txt);
                  echo $token > /shared/token;
              volumeMounts:
                - name: private-key-volume
                  mountPath: /private-key
                - name: shared-volume
                  mountPath: /shared
              envFrom:
                - secretRef:
                    name: renovate-env
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          containers:
            - image: renovate/renovate:44.30.0-full@sha256:857176fa3266e6ee75ef3a5711fcc1a7dd386d9c78dae4efe23f328415c0bb71
              name: renovate-bot
              command: ["/bin/sh", "-c"]
              args:
                - >
                  export RENOVATE_TOKEN=$(cat /shared/token);
                  export PATH="/tmp/renovate/go-bin:$PATH";
                  exec renovate;
              volumeMounts:
                - name: work-volume
                  mountPath: /tmp/renovate/
                - name: shared-volume
                  mountPath: /shared
                - name: renovate-config
                  mountPath: /config/renovate.json
                  subPath: renovate.json
                  readOnly: true
                - name: renovate-cache
                  mountPath: /cache
              resources:
                requests:
                  memory: 1.25Gi
                  cpu: 250m
                limits:
                  memory: 2Gi
                  cpu: "1"
              env:
                - name: LOG_LEVEL
                  value: info
                - name: RENOVATE_CONFIG_FILE
                  value: /config/renovate.json
                - name: RENOVATE_CACHE_DIR
                  value: /cache
          restartPolicy: Never
          volumes:
            - name: work-volume
              emptyDir: {}
            - name: shared-volume
              emptyDir: {}
            - name: private-key-volume
              secret:
                secretName: renovate-env
                items:
                  - key: GITHUB_APP_PRIVATE_KEY
                    path: private-key.txt
            - name: renovate-config
              configMap:
                name: renovate-config
                defaultMode: 0444
            - name: renovate-cache
              persistentVolumeClaim:
                claimName: renovate-cache-pvc
