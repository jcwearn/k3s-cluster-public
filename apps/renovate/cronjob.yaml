apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-bot
  namespace: renovate
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1500
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
          initContainers:
            - name: github-app-installation-token
              image: ghcr.io/mshekow/github-app-installation-token:2026.08.28@sha256:e3eb02c09fa9cc11091f75712ae4d1a850b3b21c412e5ff8a20469db577430a3
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - >
                  token=$(node index.js $GITHUB_APP_ID $GITHUB_APP_INSTALLATION_ID /private-key/private-key.txt);
                  echo $token > /shared/token;
              volumeMounts:
                - name: private-key-volume
                  mountPath: /private-key
                - name: shared-volume
                  mountPath: /shared
              envFrom:
                - secretRef:
                    name: renovate-env
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          containers:
            - image: renovate/renovate:44.62.1-full@sha256:52b9de8f3635bf48e34e2d4f702b450c081aff4882faf6302089c32d49d07e72
              name: renovate-bot
              command: ["/bin/sh", "-c"]
              args:
                - >
                  export RENOVATE_TOKEN=$(cat /shared/token);
                  export PATH="/tmp/renovate/go-bin:$PATH";
                  exec renovate;
              volumeMounts:
                - name: work-volume
                  mountPath: /tmp/renovate/
                - name: shared-volume
                  mountPath: /shared
                - name: renovate-config
                  mountPath: /config/renovate.json
                  subPath: renovate.json
                  readOnly: true
              resources:
                requests:
                  memory: 1.25Gi
                  cpu: 250m
                limits:
                  memory: 2Gi
                  cpu: "2"
              env:
                - name: LOG_LEVEL
                  value: info
                - name: RENOVATE_CONFIG_FILE
                  value: /config/renovate.json
                - name: RENOVATE_CACHE_DIR
                  value: /tmp/renovate/cache
          restartPolicy: Never
          volumes:
            - name: work-volume
              # Everything that is not the config or the token: cloned repos,
              # Renovate's own cache (RENOVATE_CACHE_DIR above) and every
              # package manager's cache (pointed here by customEnvVariables).
              # All of it dies with the pod, which is the point -- see the
              # Renovate page in mkdocs for why the cache stopped being
              # persistent.
              #
              # customEnvVariables is not redundant just because the cache dir
              # is already ephemeral. Without it GOCACHE and GOMODCACHE land in
              # the container's writable layer, which no sizeLimit bounds and
              # no eviction reclaims until the node is under pressure. GOBIN is
              # load-bearing besides: the container args put it on PATH.
              #
              # sizeLimit is what keeps a runaway run from being the node's
              # problem -- an emptyDir is otherwise bounded only by node disk.
              emptyDir:
                sizeLimit: 4Gi
            - name: shared-volume
              emptyDir: {}
            - name: private-key-volume
              secret:
                secretName: renovate-env
                items:
                  - key: GITHUB_APP_PRIVATE_KEY
                    path: private-key.txt
            - name: renovate-config
              configMap:
                name: renovate-config
                defaultMode: 0444
