apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: stirling-pdf
  namespace: flux-system
spec:
  url: https://stirling-tools.github.io/Stirling-PDF-chart
  interval: 10m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  interval: 10m
  chart:
    spec:
      chart: stirling-pdf-chart
      version: 3.1.0
      sourceRef:
        kind: HelmRepository
        name: stirling-pdf
        namespace: flux-system
  install:
    createNamespace: true
    crds: Create
    timeout: 10m
  upgrade:
    crds: CreateReplace
    timeout: 10m
  values:
    envs:
      - name: APP_LOCALE
        value: en_US
    deployment:
      annotations:
        reloader.stakater.com/auto: "true"
    service:
      type: LoadBalancer
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: "stirling-pdf"
        kube-vip.io/loadbalancerIPs: "${LAN_PREFIX}.16"
      externalTrafficPolicy: Cluster
    resources:
      limits:
        cpu: 4000m
        memory: 8192Mi
      requests:
        cpu: 500m
        memory: 512Mi
    ingress:
      enabled: false
