---
apiVersion: v1
kind: Service
metadata:
  name: adguardhome-headless
  namespace: adguardhome
labels:
  app: adguardhome
spec:
  clusterIP: None
  selector:
    app: adguardhome
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      protocol: TCP
    - name: http
      port: 80
    - name: https
      port: 443
    - name: admin
      port: 3000
    - name: dot
      port: 853
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: adguardhome
  namespace: adguardhome
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: adguardhome-headless
  replicas: 1
  selector:
    matchLabels:
      app: adguardhome
  template:
    metadata:
      labels:
        app: adguardhome
    spec:
      initContainers:
        - name: move-config
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache gettext &&
              envsubst < /config/AdGuardHome.yaml > /config-target/AdGuardHome.yaml &&
              chown -R 1000:1000 /config-target &&
              chmod -R 755 /config-target
          env:
            - name: TLS_SERVER_NAME
              value: dns.${DOMAIN}
          envFrom:
            - secretRef:
                name: adguardhome-secrets
          volumeMounts:
            - name: config-volume
              mountPath: /config/AdGuardHome.yaml
              subPath: AdGuardHome.yaml
            - name: config-target
              mountPath: /config-target
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      containers:
        - name: adguardhome
          image: adguard/adguardhome:v0.107.78@sha256:1ea34eafe5dc691007946e8eaab7bf46b0de9412f39213d8c06e48b53bf9a6c5
          imagePullPolicy: IfNotPresent
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
            - name: admin
              containerPort: 3000
            - name: dot
              containerPort: 853
          resources:
            limits:
              memory: "2048Mi"
              cpu: "1000m"
            requests:
              memory: "512Mi"
              cpu: "250m"
          volumeMounts:
            - name: config-target
              mountPath: /opt/adguardhome/conf
            - name: work-volume
              mountPath: /opt/adguardhome/work
            - name: tls-volume
              mountPath: /certs
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: adguardhome-config
        - name: config-target
          emptyDir: {}
        - name: work-volume
          persistentVolumeClaim:
            claimName: adguardhome-work
        - name: tls-volume
          secret:
            secretName: adguardhome-letsencrypt
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
