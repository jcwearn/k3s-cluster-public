http:
  pprof:
    port: 6060
    enabled: false
  address: 0.0.0.0:80
  session_ttl: 720h
users:
  - name: jackson
    password: $HASHED_PASSWORD
auth_attempts: 5
block_auth_min: 15
http_proxy: ""
language: ""
theme: auto
dns:
  bind_hosts:
    - 0.0.0.0
  port: 53
  anonymize_client_ip: false
  ratelimit: 0
  ratelimit_subnet_len_ipv4: 24
  ratelimit_subnet_len_ipv6: 56
  ratelimit_whitelist: []
  refuse_any: true
  upstream_dns:
    - "[/cluster.local/]10.43.0.10"
    - https://dns10.quad9.net/dns-query
    - https://dns.adguard-dns.com/dns-query
    - https://cloudflare-dns.com/dns-query
  upstream_dns_file: ""
  bootstrap_dns:
    - 9.9.9.10
    - 149.112.112.10
    - 2620:fe::10
    - 2620:fe::fe:10
  fallback_dns:
    - 1.1.1.1
    - 9.9.9.9
  upstream_mode: parallel
  fastest_timeout: 1s
  allowed_clients: []
  disallowed_clients: []
  blocked_hosts:
    - version.bind
    - id.server
    - hostname.bind
  trusted_proxies:
    - 127.0.0.0/8
    - ::1/128
  cache_enabled: true
  cache_size: 4194304
  cache_ttl_min: 0
  cache_ttl_max: 0
  cache_optimistic: true
  bogus_nxdomain: []
  aaaa_disabled: false
  enable_dnssec: false
  edns_client_subnet:
    custom_ip: ""
    enabled: false
    use_custom: false
  max_goroutines: 300
  handle_ddr: true
  ipset: []
  ipset_file: ""
  bootstrap_prefer_ipv6: false
  upstream_timeout: 10s
  private_networks: []
  use_private_ptr_resolvers: true
  local_ptr_upstreams: []
  use_dns64: false
  dns64_prefixes: []
  serve_http3: false
  use_http3_upstreams: false
  serve_plain_dns: true
  hostsfile_enabled: true
  pending_requests:
    enabled: true
tls:
  enabled: true
  server_name: $TLS_SERVER_NAME
  force_https: true
  port_https: 443
  port_dns_over_tls: 853
  port_dns_over_quic: 853
  port_dnscrypt: 0
  dnscrypt_config_file: ""
  allow_unencrypted_doh: false
  certificate_chain: ""
  private_key: ""
  certificate_path: /certs/tls.crt
  private_key_path: /certs/tls.key
  strict_sni_check: false
querylog:
  dir_path: ""
  ignored: []
  interval: 2160h
  size_memory: 1000
  enabled: true
  file_enabled: true
statistics:
  dir_path: ""
  ignored: []
  interval: 24h
  enabled: true
filters:
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
    name: AdGuard DNS filter
    id: 1
  - enabled: false
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt
    name: AdAway Default Blocklist
    id: 2
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_48.txt
    name: HaGeZi's Pro Blocklist
    id: 1745967957
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_44.txt
    name: HaGeZi's Threat Intelligence Feeds
    id: 1745967958
whitelist_filters: []
user_rules: []
dhcp:
  enabled: false
  interface_name: ""
  local_domain_name: lan
  dhcpv4:
    gateway_ip: ""
    subnet_mask: ""
    range_start: ""
    range_end: ""
    lease_duration: 86400
    icmp_timeout_msec: 1000
    options: []
  dhcpv6:
    range_start: ""
    lease_duration: 86400
    ra_slaac_only: false
    ra_allow_slaac: false
filtering:
  blocking_ipv4: ""
  blocking_ipv6: ""
  blocked_services:
    schedule:
      time_zone: UTC
    ids: []
  protection_disabled_until: null
  safe_search:
    enabled: false
    bing: true
    duckduckgo: true
    ecosia: true
    google: true
    pixabay: true
    yandex: true
    youtube: true
  blocking_mode: default
  parental_block_host: family-block.dns.adguard.com
  safebrowsing_block_host: standard-block.dns.adguard.com
  rewrites:
    - domain: homeassistant
      answer: ${MGMT_PREFIX}.52
      enabled: true
    - domain: router
      answer: ${MGMT_PREFIX}.1
      enabled: true
    - domain: pve-01
      answer: ${LAN_PREFIX}.21
      enabled: true
    - domain: pve-02
      answer: ${LAN_PREFIX}.22
      enabled: true
    - domain: pve-03
      answer: ${LAN_PREFIX}.23
      enabled: true
    - domain: k3s-01
      answer: ${LAN_PREFIX}.11
      enabled: true
    - domain: k3s-02
      answer: ${LAN_PREFIX}.12
      enabled: true
    - domain: k3s-03
      answer: ${LAN_PREFIX}.13
      enabled: true
    - domain: truenas
      answer: ${LAN_PREFIX}.200
      enabled: true
    # Send ${DOMAIN} straight to the Envoy proxy on the LAN.
    #
    # Public DNS answers these with a CNAME to the gateway's MagicDNS name, and the apex
    # with the gateway's tailnet address (apps/homepage/dnsendpoint.yaml) -- both of which
    # only resolve on a device running Tailscale. Without these rewrites a LAN client with
    # no tailnet connection cannot reach any internal site at all, even standing in the house.
    #
    # Envoy serves the wildcard cert (SAN: *.${DOMAIN}, ${DOMAIN}) and selects by SNI, so TLS
    # is unaffected; LAN traffic also stops hairpinning out to the tailnet and back.
    #
    # Only clients that use AdGuard see these answers -- LAN and the exit node pod. Remote
    # tailnet clients resolve via the tailnet's own nameserver and are unaffected.
    #
    # The wildcard does not match the apex, hence the separate entry. Note this captures
    # every ${DOMAIN} subdomain: if one is ever hosted somewhere other than this cluster,
    # it needs an explicit rewrite above this line. Mail is unaffected -- MX points at
    # Cloudflare's own domain, not at a ${DOMAIN} name.
    - domain: ${DOMAIN}
      answer: ${LAN_PREFIX}.5
      enabled: true
    - domain: "*.${DOMAIN}"
      answer: ${LAN_PREFIX}.5
      enabled: true
  safe_fs_patterns:
    - /opt/adguardhome/work/userfilters/*
  safebrowsing_cache_size: 1048576
  safesearch_cache_size: 1048576
  parental_cache_size: 1048576
  cache_time: 30
  filters_update_interval: 24
  blocked_response_ttl: 10
  filtering_enabled: true
  rewrites_enabled: true
  parental_enabled: false
  safebrowsing_enabled: false
  protection_enabled: true
clients:
  runtime_sources:
    whois: true
    arp: true
    rdns: true
    dhcp: true
    hosts: true
  persistent: []
log:
  enabled: true
  file: ""
  max_backups: 0
  max_size: 100
  max_age: 3
  compress: false
  local_time: false
  verbose: false
os:
  group: ""
  user: ""
  rlimit_nofile: 0
schema_version: 31