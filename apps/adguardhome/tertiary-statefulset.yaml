---
apiVersion: v1
kind: Service
metadata:
  name: adguardhome-tertiary-headless
  namespace: adguardhome
  labels:
    app: adguardhome-tertiary
spec:
  clusterIP: None
  selector:
    app: adguardhome-tertiary
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      protocol: TCP
    - name: http
      port: 80
    - name: https
      port: 443
    - name: admin
      port: 3000
    - name: dot
      port: 853
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: adguardhome-tertiary
  namespace: adguardhome
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: adguardhome-tertiary-headless
  replicas: 1
  selector:
    matchLabels:
      app: adguardhome-tertiary
  template:
    metadata:
      labels:
        app: adguardhome-tertiary
        app.kubernetes.io/name: adguardhome
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: adguardhome
      initContainers:
        - name: move-config
          # nginx purely for the envsubst binary it ships for its own template feature.
          # The previous alpine image had to `apk add gettext` first, which meant this
          # container needed working DNS and internet before AdGuard could start -- a
          # deadlock on a cold boot, since the DNS it was waiting on was AdGuard itself.
          image: nginx:1.31-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              envsubst < /config/AdGuardHome.yaml > /config-target/AdGuardHome.yaml &&
              chown -R 1000:1000 /config-target &&
              chmod -R 755 /config-target
          env:
            - name: TLS_SERVER_NAME
              value: dns-tertiary.${DOMAIN}
          envFrom:
            - secretRef:
                name: adguardhome-secrets
          volumeMounts:
            - name: config-volume
              mountPath: /config/AdGuardHome.yaml
              subPath: AdGuardHome.yaml
            - name: config-target
              mountPath: /config-target
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      containers:
        - name: adguardhome-tertiary
          image: adguard/adguardhome:v0.107.78@sha256:1ea34eafe5dc691007946e8eaab7bf46b0de9412f39213d8c06e48b53bf9a6c5
          imagePullPolicy: IfNotPresent
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
            - name: admin
              containerPort: 3000
            - name: dot
              containerPort: 853
          # Functional probes: a running-but-wedged AdGuard would otherwise keep its
          # Service endpoint and silently blackhole its VIP.
          #
          # Readiness queries a rewrite rather than a real domain on purpose. A rewrite is
          # answered from local config with no upstream involved, so an ISP outage cannot
          # mark every instance unready at once and take LAN DNS down with it -- which is
          # the exact failure this is meant to prevent. Keep at least one rewrite defined.
          readinessProbe:
            exec:
              command: ["/usr/bin/nslookup", "router", "127.0.0.1"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            limits:
              memory: "2048Mi"
              cpu: "1000m"
            requests:
              memory: "512Mi"
              cpu: "250m"
          volumeMounts:
            - name: config-target
              mountPath: /opt/adguardhome/conf
            - name: work-volume
              mountPath: /opt/adguardhome/work
            - name: tls-volume
              mountPath: /certs
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: adguardhome-config
        - name: config-target
          emptyDir: {}
        - name: work-volume
          persistentVolumeClaim:
            claimName: adguardhome-tertiary-work
        - name: tls-volume
          secret:
            secretName: adguardhome-tertiary-letsencrypt
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
