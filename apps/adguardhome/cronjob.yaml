apiVersion: batch/v1
kind: CronJob
metadata:
  name: adguardhome-sync
  namespace: adguardhome
  annotations:
    # A Job runs to completion; a probe would only ever restart it mid-run.
    ignore-check.kube-linter.io/no-liveness-probe: "run-to-completion Job"
    ignore-check.kube-linter.io/no-readiness-probe: "run-to-completion Job"
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Replace
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: move-config
              # nginx purely for the envsubst binary it ships for its own template feature.
              # The previous alpine image had to `apk add gettext` first, which meant this
              # container needed working DNS and internet before AdGuard could start -- a
              # deadlock on a cold boot, since the DNS it was waiting on was AdGuard itself.
              image: nginx:1.31-alpine@sha256:62ff2089abf5a9ed33bd232895bef5e22f7bb4b200675cec49a5ebc48e3d4ac8
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  envsubst < /config/adguardhome-sync.yaml > /config-target/adguardhome-sync.yaml &&
                  chown -R 1000:1000 /config-target &&
                  chmod -R 755 /config-target
              envFrom:
                - secretRef:
                    name: adguardhome-secrets
              volumeMounts:
                - name: config-volume
                  mountPath: /config
                  readOnly: true
                - name: config-target
                  mountPath: /config-target
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: adguardhome-sync
              image: "ghcr.io/bakito/adguardhome-sync:v0.9.3@sha256:b3499852640866c5742fd72cca190f40e2741c279d60fd62b9130cd8142aafec"
              imagePullPolicy: IfNotPresent
              env:
                - name: LOG_LEVEL
                  value: "info"
              volumeMounts:
                - name: config-target
                  mountPath: /config
                  readOnly: true
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "250m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          restartPolicy: Never
          volumes:
            - name: config-volume
              configMap:
                name: adguardhome-sync-config
            - name: config-target
              emptyDir: {}
