apiVersion: batch/v1
kind: CronJob
metadata:
  name: adguardhome-sync
  namespace: adguardhome
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Replace
  jobTemplate:
    spec:
      template:
        spec: 
          initContainers:
            - name: move-config
              # nginx purely for the envsubst binary it ships for its own template feature.
              # The previous alpine image had to `apk add gettext` first, which meant this
              # container needed working DNS and internet before AdGuard could start -- a
              # deadlock on a cold boot, since the DNS it was waiting on was AdGuard itself.
              image: nginx:1.31-alpine@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  envsubst < /config/adguardhome-sync.yaml > /config-target/adguardhome-sync.yaml &&
                  chown -R 1000:1000 /config-target &&
                  chmod -R 755 /config-target
              envFrom:
                - secretRef:
                    name: adguardhome-secrets
              volumeMounts:
                - name: config-volume
                  mountPath: /config
                  readOnly: true
                - name: config-target
                  mountPath: /config-target
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
          containers:
            - name: adguardhome-sync
              image: "ghcr.io/bakito/adguardhome-sync:v0.9.2@sha256:fb7224aeeab74d68990c3ecf51594a6f92428fcc93c7a162c3bc221e77a49025"
              imagePullPolicy: IfNotPresent
              env:
                - name: LOG_LEVEL
                  value: "info"
              volumeMounts:
                - name: config-target
                  mountPath: /config
                  readOnly: true
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "250m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
          restartPolicy: Never
          volumes:
            - name: config-volume
              configMap:
                name: adguardhome-sync-config
            - name: config-target
              emptyDir: {}
