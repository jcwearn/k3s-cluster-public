apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 10m
  chart:
    spec:
      chart: headlamp
      version: "0.44.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
  install:
    createNamespace: true
  values:
    replicaCount: 1
    config:
      inCluster: true
      enableHelm: true
      # Bypasses: https://github.com/kubernetes-sigs/headlamp/issues/4883
      sessionTTL: null
    clusterRoleBinding:
      create: true
      clusterRoleName: cluster-admin
    service:
      type: LoadBalancer
      port: 80
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: "headlamp"
        kube-vip.io/loadbalancerIPs: "${LAN_PREFIX}.6"
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    ingress:
      enabled: false
