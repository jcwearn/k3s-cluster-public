# A long-lived token for the pod's own ServiceAccount, which holds `view`:
# read-only, no Secrets. It is the everyday login. Write sessions use a
# short-lived token for headlamp-admin instead -- see rbac-admin.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-token
  namespace: headlamp
  annotations:
    kubernetes.io/service-account.name: headlamp
type: kubernetes.io/service-account-token
