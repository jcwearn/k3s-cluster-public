apiVersion: apps/v1
kind: Deployment
metadata:
  name: mkdocs
  namespace: mkdocs
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mkdocs
  template:
    metadata:
      labels:
        app: mkdocs
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-mkdocs
          image: squidfunk/mkdocs-material:9.8.0@sha256:dc3b5de76c6e30d18dc0922d4c4a7bed817e5e155f9ff0e594a53eb56e537e64
          imagePullPolicy: IfNotPresent
          args:
            - build
            - --site-dir=/site
            - --strict
            - --clean
          volumeMounts:
            - name: mkdocs-root
              mountPath: /docs/mkdocs.yml
              subPath: mkdocs.yml
              readOnly: true
            - name: mkdocs-root
              mountPath: /docs/docs/index.md
              subPath: index.md
              readOnly: true
            - name: mkdocs-apps
              mountPath: /docs/docs/apps
              readOnly: true
            - name: mkdocs-infra
              mountPath: /docs/docs/infrastructure
              readOnly: true
            - name: mkdocs-misc
              mountPath: /docs/docs/misc
              readOnly: true
            - name: site-volume
              mountPath: /site
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: mkdocs
          # The unprivileged variant: listens on 8080 as uid 101, writes its pid
          # and cache under /tmp. Nothing here needed root.
          image: nginxinc/nginx-unprivileged:1.31.7-alpine-slim@sha256:a8cb0f33d51fa107c96fd2bd3a71aaf564ec131e9d2bdf8700944f0ed8b170d7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: site-volume
              mountPath: /usr/share/nginx/html
      volumes:
        - name: mkdocs-root
          configMap:
            name: mkdocs-root
            defaultMode: 0444
        - name: mkdocs-apps
          configMap:
            name: mkdocs-apps
            defaultMode: 0444
        - name: mkdocs-infra
          configMap:
            name: mkdocs-infra
            defaultMode: 0444
        - name: mkdocs-misc
          configMap:
            name: mkdocs-misc
            defaultMode: 0444
        - name: site-volume
          emptyDir: {}
