apiVersion: apps/v1
kind: Deployment
metadata:
  name: mkdocs
  namespace: mkdocs
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mkdocs
  template:
    metadata:
      labels:
        app: mkdocs
    spec:
      initContainers:
        - name: init-mkdocs
          image: squidfunk/mkdocs-material:9.7.7@sha256:51b87149d227691486b5f08993d28c65ca7e4990010664b697265b8e6fcd5287
          imagePullPolicy: IfNotPresent
          args:
            - build
            - --site-dir=/site
            - --strict
            - --clean
          volumeMounts:
            - name: mkdocs-root
              mountPath: /docs/mkdocs.yml
              subPath: mkdocs.yml
              readOnly: true
            - name: mkdocs-root
              mountPath: /docs/docs/index.md
              subPath: index.md
              readOnly: true
            - name: mkdocs-apps
              mountPath: /docs/docs/apps
              readOnly: true
            - name: mkdocs-infra
              mountPath: /docs/docs/infrastructure
              readOnly: true
            - name: mkdocs-misc
              mountPath: /docs/docs/misc
              readOnly: true
            - name: site-volume
              mountPath: /site
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: mkdocs
          image: nginx:1.31.6-alpine-slim@sha256:5a9423ea46b45f4025fe28a74c7ccea42291c8f54f828c7cadc2d75faca1abe5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: site-volume
              mountPath: /usr/share/nginx/html
      volumes:
        - name: mkdocs-root
          configMap:
            name: mkdocs-root
            defaultMode: 0444
        - name: mkdocs-apps
          configMap:
            name: mkdocs-apps
            defaultMode: 0444
        - name: mkdocs-infra
          configMap:
            name: mkdocs-infra
            defaultMode: 0444
        - name: mkdocs-misc
          configMap:
            name: mkdocs-misc
            defaultMode: 0444
        - name: site-volume
          emptyDir: {}
