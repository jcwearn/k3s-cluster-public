site_name: "Jackson's Homelab"
theme:
  name: "material"
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jcwearn/k3s-cluster
nav:
  - Home: "index.md"
  - Apps: "apps/index.md"
  - Infra: "infrastructure/index.md"
  - Misc: "misc/index.md"
