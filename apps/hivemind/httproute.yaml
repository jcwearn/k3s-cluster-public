apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hivemind
  namespace: hivemind
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - hivemind.${DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hivemind
          port: 8080
