apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-ntfy-deployment
  namespace: ntfy
  labels:
    app: alertmanager-ntfy-deployment
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager-ntfy-pod
  template:
    metadata:
      labels:
        app: alertmanager-ntfy-pod
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: move-config
          # nginx purely for the envsubst binary it ships for its own template
          # feature. The previous alpine
          # init ran `apk add gettext` on every boot -- a network dependency at
          # the worst moment -- and then chowned as root. The target is an
          # emptyDir, writable by any uid, so neither is needed.
          image: nginx:1.31.6-alpine-slim@sha256:80149a0e5bc9fa0b8beaff5b8a453f71ba8ba038895d418381297ffa5cd57782
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - envsubst < /config/alertmanager-ntfy.yaml > /config-target/alertmanager-ntfy.yaml
          envFrom:
            - secretRef:
                name: ntfy-secrets
          volumeMounts:
            - name: config-volume
              mountPath: /config/alertmanager-ntfy.yaml
              subPath: alertmanager-ntfy.yaml
            - name: config-target
              mountPath: /config-target
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: alertmanager-ntfy
          image: ghcr.io/alexbakker/alertmanager-ntfy:1.2.1@sha256:2a862f23c8fb67f777824979487c06a417b2f9bbbc2eb45a974a1fb45b9bbff3
          imagePullPolicy: IfNotPresent
          args:
            - "--configs"
            - "/config/alertmanager-ntfy.yaml"
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              memory: 300Mi
              cpu: 200m
            requests:
              cpu: 150m
              memory: 150Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # The only route is POST /hook behind auth; a GET would be a 4xx.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: config-target
              mountPath: /config/alertmanager-ntfy.yaml
              subPath: alertmanager-ntfy.yaml
      volumes:
        - name: config-volume
          configMap:
            name: alertmanager-ntfy-config
        - name: config-target
          emptyDir: {}
