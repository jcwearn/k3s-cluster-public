apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-ntfy-deployment
  namespace: ntfy
  labels:
    app: alertmanager-ntfy-deployment
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager-ntfy-pod
  template:
    metadata:
      labels:
        app: alertmanager-ntfy-pod
    spec:
      initContainers:
        - name: move-config
          image: alpine:3.24@sha256:5b02b42e375f7426f8d65c3af331ca05d9878f9989230354504e0b9dfd431f60
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache gettext &&
              envsubst < /config/alertmanager-ntfy.yaml > /config-target/alertmanager-ntfy.yaml &&
              chown -R 1000:1000 /config-target &&
              chmod -R 755 /config-target
          envFrom:
            - secretRef:
                name: ntfy-secrets
          volumeMounts:
            - name: config-volume
              mountPath: /config/alertmanager-ntfy.yaml
              subPath: alertmanager-ntfy.yaml
            - name: config-target
              mountPath: /config-target
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: alertmanager-ntfy
          image: ghcr.io/alexbakker/alertmanager-ntfy:1.2.1@sha256:2a862f23c8fb67f777824979487c06a417b2f9bbbc2eb45a974a1fb45b9bbff3
          imagePullPolicy: IfNotPresent
          args:
            - "--configs"
            - "/config/alertmanager-ntfy.yaml"
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              memory: 300Mi
              cpu: 200m
            requests:
              cpu: 150m
              memory: 150Mi
          # The only route is POST /hook behind auth; a GET would be a 4xx.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: config-target
              mountPath: /config/alertmanager-ntfy.yaml
              subPath: alertmanager-ntfy.yaml
      volumes:
        - name: config-volume
          configMap:
            name: alertmanager-ntfy-config
        - name: config-target
          emptyDir: {}
