apiVersion: apps/v1
kind: Deployment
metadata:
  name: world-clock
  namespace: world-clock
  labels:
    app.kubernetes.io/name: world-clock
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: world-clock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: world-clock
    spec:
      containers:
        - name: world-clock
          image: "ghcr.io/jcwearn/world-clock:v0.2.12@sha256:dd6cf1e849b436268ca1d9e8726c77059b1a15fc7cf3b573f493b4df944da0ae"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
