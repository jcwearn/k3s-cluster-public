apiVersion: apps/v1
kind: Deployment
metadata:
  name: world-clock
  namespace: world-clock
  labels:
    app.kubernetes.io/name: world-clock
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: world-clock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: world-clock
    spec:
      containers:
        - name: world-clock
          image: "ghcr.io/jcwearn/world-clock:v0.4.45@sha256:9d43b2038d97d4afa95e385eeae69042cc0fedd5f8cbb290ce7a7b35c464bbfa"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
