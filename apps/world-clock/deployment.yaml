apiVersion: apps/v1
kind: Deployment
metadata:
  name: world-clock
  namespace: world-clock
  labels:
    app.kubernetes.io/name: world-clock
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: world-clock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: world-clock
    spec:
      containers:
        - name: world-clock
          image: "ghcr.io/jcwearn/world-clock:v0.2.3@sha256:a9f7e9f6062d11d340631ddba4b160c4888f411a7d35fc7c16cd21d99a7b9a06"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
