apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelfmark
  namespace: ebooks
  labels:
    app.kubernetes.io/name: shelfmark
  annotations:
    # shelfmark is a linuxserver-style s6 image; gluetun needs NET_ADMIN and
    # NET_RAW to build the WireGuard tunnel the pod routes through.
    ignore-check.kube-linter.io/run-as-non-root: "s6 image drops to PUID; gluetun needs root for the tunnel"
    ignore-check.kube-linter.io/drop-net-raw-capability: "gluetun builds the WireGuard tunnel"
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: shelfmark
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shelfmark
    spec:
      containers:
        - name: shelfmark
          image: ghcr.io/calibrain/shelfmark:v1.4.0@sha256:4ef757349c3c7a7d90ba95b1e2a46ce4dd460a4776efbcf2aa1b1c476e7d5de5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Chicago
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: books
              mountPath: /books
            - name: calibre-web-auth
              mountPath: /auth
              readOnly: true
        - name: gluetun
          image: ghcr.io/qdm12/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: VPN_SERVICE_PROVIDER
              value: protonvpn
            - name: VPN_TYPE
              value: wireguard
            - name: SERVER_COUNTRIES
              value: Netherlands
          envFrom:
            - secretRef:
                name: gluetun-vpn-credentials
          volumeMounts:
            - name: tun-device
              mountPath: /dev/net/tun
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          # gluetun's own check, the one its image's HEALTHCHECK runs; it fails
          # while the tunnel is down. The pod shares its network namespace, so a
          # failing readiness here pulls shelfmark out of the Service too, which is
          # right: without the tunnel it cannot do its job.
          livenessProbe:
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            periodSeconds: 60
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: shelfmark-config
        - name: books
          persistentVolumeClaim:
            claimName: shelfmark-books
        - name: calibre-web-auth
          persistentVolumeClaim:
            claimName: calibre-web-config
        - name: tun-device
          hostPath:
            path: /dev/net/tun
            type: CharDevice
