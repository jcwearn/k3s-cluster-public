apiVersion: v1
kind: Namespace
metadata:
  name: ebooks
  labels:
    # gluetun needs NET_ADMIN and /dev/net/tun to build shelfmark's VPN tunnel,
    # which baseline forbids. calibre-web alone would be baseline.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
