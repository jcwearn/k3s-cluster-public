# ClusterIP only. The UI is reached at alert-agent.${DOMAIN} through the
# gateway, which is tailnet-only (see apps/job-track/service.yaml). The webhook
# port (Alertmanager) and the runner port (runner Jobs) are in-cluster only
# and never routed.
apiVersion: v1
kind: Service
metadata:
  name: alert-agent
  namespace: alert-agent
spec:
  selector:
    app: alert-agent
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: webhook
      port: 8081
      targetPort: webhook
      protocol: TCP
    - name: runner
      port: 8082
      targetPort: runner
      protocol: TCP
