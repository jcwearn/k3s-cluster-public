# ClusterIP only. The UI is reached at alert-agent.${DOMAIN} through the
# gateway, which is tailnet-only (see apps/job-track/service.yaml). The webhook
# port is for Alertmanager in-cluster and is never routed.
apiVersion: v1
kind: Service
metadata:
  name: alert-agent
  namespace: alert-agent
spec:
  selector:
    app: alert-agent
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: webhook
      port: 8081
      targetPort: webhook
      protocol: TCP
