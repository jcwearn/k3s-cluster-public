apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-agent
  namespace: alert-agent
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # One controller at a time: it owns the runner queue. (The database also
  # refuses a second running run, so two replicas would idle, not collide.)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alert-agent
  template:
    metadata:
      labels:
        app: alert-agent
    spec:
      # The controller creates runner Jobs and their per-run Secrets; see
      # rbac.yaml for exactly what it may touch.
      serviceAccountName: alert-agent
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Secret volume files are owned by root; fsGroup gives them the pod's
        # group so the 0440 key below is readable by the controller and no one
        # else.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Migrations run here rather than at controller startup, as in
        # job-track: same image, same embedded SQL, different subcommand.
        - name: migrate
          image: ghcr.io/jcwearn/alert-agent:0.14.1@sha256:3e7129a8badb2f0cd250bec886552731c2d7da755982a784c01b95b2ec132b7d
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          env:
            - name: DB_HOST
              value: alert-agent-database-rw
            # The operator-generated app Secret; see postgresql.yaml.
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: alert-agent-database-app
                  key: dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: alert-agent-database-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alert-agent-database-app
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
      containers:
        - name: controller
          image: ghcr.io/jcwearn/alert-agent:0.14.1@sha256:3e7129a8badb2f0cd250bec886552731c2d7da755982a784c01b95b2ec132b7d
          imagePullPolicy: IfNotPresent
          args: ["controller"]
          ports:
            - name: http
              containerPort: 8080
            - name: webhook
              containerPort: 8081
            - name: runner
              containerPort: 8082
          env:
            - name: DB_HOST
              value: alert-agent-database-rw
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: alert-agent-database-app
                  key: dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: alert-agent-database-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alert-agent-database-app
                  key: password
            # The UI shows absolute times; render them in local time.
            - name: TZ
              value: America/New_York
            # Phase 2: every new incident gets a read-only diagnosis. Set to
            # "false" to stop starting runs; incidents are still recorded.
            - name: AGENT_ENABLED
              value: "true"
            - name: PUBLIC_URL
              value: https://medic.${DOMAIN}
            - name: RUN_MODEL
              value: opus
            # Alert runs (diagnoses) started per hour. Chat turns have their
            # own budget below and never count against this one.
            - name: RUN_MAX_PER_HOUR
              value: "12"
            # Phase 3.5: a new incident's run waits this long, and incidents
            # opening in the same namespace meanwhile join it, so a burst of
            # alerts about one problem costs one run.
            - name: RUN_HOLD
              value: 60s
            # How far back a run's context lists other incidents (to merge or
            # link with), and how old a resolved one may be to take a merge.
            - name: RECENT_WINDOW
              value: 30m
            # Chat turns one conversation (an incident's, or a general one) may
            # start per hour, within CHAT_MAX_PER_HOUR. A message over either
            # cap is answered "not processed", not queued.
            - name: CHAT_MAX_PER_THREAD_HOUR
              value: "4"
            # Chat turns across all conversations per hour.
            - name: CHAT_MAX_PER_HOUR
              value: "12"
            # Phase 4: comments on agent PRs by these GitHub logins become
            # chat turns, answered by the App in the PR. Everyone else, bots
            # and the App itself are ignored. Polled every 30s
            # (COMMENT_POLL_INTERVAL).
            - name: CHAT_ALLOWED_LOGINS
              value: jcwearn
            # Phase 3: runners may propose a PR with propose_pr. The controller
            # applies the patch to main, runs the repo's .githooks on it and
            # pushes agent/<incident-id>; it never merges.
            - name: PR_ENABLED
              value: "true"
            # Exact strings the hooks must refuse in a proposed commit (their
            # .publicgate-local). Flux substitutes them, so neither is written
            # here.
            - name: PUBLIC_GATE
              value: ${DOMAIN},${TAILNET}
            # "Needs your review" pushes (also posted to Slack); diagnoses go
            # to Slack only.
            - name: NTFY_URL
              value: http://ntfy-svc.ntfy.svc.cluster.local:4080
            - name: NTFY_TOPIC
              value: medic
            - name: NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: alert-agent-notify
                  key: NTFY_TOKEN
            # Runner Jobs use this pod's own controller image, which the
            # controller reads through the API by name -- so a Renovate bump of
            # the image above moves the runners too.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: alert-agent-github
                  key: app-id
            - name: GITHUB_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: alert-agent-github
                  key: installation-id
            - name: GITHUB_PRIVATE_KEY_FILE
              value: /etc/alert-agent/github/private-key
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: alert-agent-notify
                  key: SLACK_WEBHOOK_URL
          # Liveness never touches the database: a restart does not fix an
          # outage there. Readiness does, taking the pod out of the Service --
          # and Alertmanager retries deliveries it could not make.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - name: github-app
              mountPath: /etc/alert-agent/github
              readOnly: true
            # Each proposal clones the repo here, commits through its hooks and
            # removes the clone.
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Limits cover a proposal: a shallow clone of the repo and the hooks'
          # kustomize renders, in bursts.
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        # Only the private key, as a file: the App ID and installation ID
        # come in as env above. The runner Jobs never mount this Secret.
        - name: github-app
          secret:
            secretName: alert-agent-github
            defaultMode: 0440
            items:
              - key: private-key
                path: private-key
        - name: work
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
