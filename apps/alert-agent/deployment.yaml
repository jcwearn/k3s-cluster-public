apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-agent
  namespace: alert-agent
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # One controller at a time: it owns the runner queue. (The database also
  # refuses a second running run, so two replicas would idle, not collide.)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alert-agent
  template:
    metadata:
      labels:
        app: alert-agent
    spec:
      # The controller creates runner Jobs and their per-run Secrets; see
      # rbac.yaml for exactly what it may touch.
      serviceAccountName: alert-agent
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Secret volume files are owned by root; fsGroup gives them the pod's
        # group so the 0440 key below is readable by the controller and no one
        # else.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Migrations run here rather than at controller startup, as in
        # job-track: same image, same embedded SQL, different subcommand.
        - name: migrate
          image: ghcr.io/jcwearn/alert-agent:0.3.0@sha256:46b3d2b639228bf0c568fcdf8d3e2fa2c4a6aa1c9fd967cc1a8ed60de58abf26
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          env:
            - name: DB_HOST
              value: alert-agent-database-rw
            # The operator-generated app Secret; see postgresql.yaml.
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: alert-agent-database-app
                  key: dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: alert-agent-database-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alert-agent-database-app
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
      containers:
        - name: controller
          image: ghcr.io/jcwearn/alert-agent:0.3.0@sha256:46b3d2b639228bf0c568fcdf8d3e2fa2c4a6aa1c9fd967cc1a8ed60de58abf26
          imagePullPolicy: IfNotPresent
          args: ["controller"]
          ports:
            - name: http
              containerPort: 8080
            - name: webhook
              containerPort: 8081
            - name: runner
              containerPort: 8082
          env:
            - name: DB_HOST
              value: alert-agent-database-rw
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: alert-agent-database-app
                  key: dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: alert-agent-database-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alert-agent-database-app
                  key: password
            # The UI shows absolute times; render them in local time.
            - name: TZ
              value: America/New_York
            # Phase 2: every new incident gets a read-only diagnosis. Set to
            # "false" to stop starting runs; incidents are still recorded.
            #
            # Paused: CLAUDE_CODE_SUBPROCESS_ENV_SCRUB needs bubblewrap, which
            # the restricted runner pod cannot run, so every run fails at
            # start. Re-enabled when runners use MCP read tools instead of
            # Bash (docs/plans/alert-agent).
            - name: AGENT_ENABLED
              value: "false"
            - name: PUBLIC_URL
              value: https://alert-agent.${DOMAIN}
            - name: RUN_MODEL
              value: opus
            - name: RUN_MAX_PER_HOUR
              value: "6"
            # Runner Jobs use this pod's own controller image, which the
            # controller reads through the API by name -- so a Renovate bump of
            # the image above moves the runners too.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: alert-agent-github
                  key: app-id
            - name: GITHUB_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: alert-agent-github
                  key: installation-id
            - name: GITHUB_PRIVATE_KEY_FILE
              value: /etc/alert-agent/github/private-key
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: alert-agent-notify
                  key: SLACK_WEBHOOK_URL
          # Liveness never touches the database: a restart does not fix an
          # outage there. Readiness does, taking the pod out of the Service --
          # and Alertmanager retries deliveries it could not make.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - name: github-app
              mountPath: /etc/alert-agent/github
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        # Only the private key, as a file: the App ID and installation ID
        # come in as env above. The runner Jobs never mount this Secret.
        - name: github-app
          secret:
            secretName: alert-agent-github
            defaultMode: 0440
            items:
              - key: private-key
                path: private-key
