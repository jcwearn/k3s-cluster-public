apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alert-agent
  namespace: alert-agent
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - alert-agent.${DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: alert-agent
          port: 8080
