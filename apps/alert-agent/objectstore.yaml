# Where alert-agent's Postgres backups go. Same bucket as the other CNPG
# clusters; barman writes each under a directory named after its cluster. See
# apps/job-track/objectstore.yaml for the reasoning behind each setting.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: alert-agent-database-backups
  namespace: alert-agent
spec:
  configuration:
    destinationPath: s3://k3s-postgres-backups/
    endpointURL: ${R2_ENDPOINT}
    s3Credentials:
      accessKeyId:
        name: postgres-backup-r2
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgres-backup-r2
        key: ACCESS_SECRET_KEY
    data:
      compression: gzip
    wal:
      compression: gzip
  retentionPolicy: 30d
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
      - name: AWS_DEFAULT_REGION
        value: auto
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: "1"
        memory: 256Mi
