# flux_reconcile on Kustomizations, sources and flux-operator's HelmRelease.
# Flux objects only: no rights on the Flux controllers themselves.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alert-agent-actor-flux
  namespace: flux-system
rules:
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "patch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "patch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "helmrepositories", "ocirepositories"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alert-agent-actor-flux
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alert-agent-actor-flux
subjects:
  - kind: ServiceAccount
    name: alert-agent-actor
    namespace: alert-agent
