# Two scrape targets. The release label is load-bearing on both: Prometheus
# only selects monitors carrying it (see apps/job-track/podmonitor.yaml).
#
# The database's instance manager, where barman-cloud publishes backup times.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: alert-agent-database
  namespace: alert-agent
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: alert-agent-database
  podMetricsEndpoints:
    - port: metrics
---
# The controller's own /metrics: webhook outcomes and incident counts.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: alert-agent
  namespace: alert-agent
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: alert-agent
  podMetricsEndpoints:
    - port: http
      path: /metrics
