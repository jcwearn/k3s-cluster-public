apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: job-track-database
  namespace: job-track
spec:
  # A primary and one streaming replica, never on the same node. With a single
  # instance, a dead node took the database down until the node came back: the
  # pod sat Terminating and nothing replaced it (node-outage drill, 2026-10-13).
  # Now the operator promotes the replica instead, with no one at the keyboard.
  instances: 2
  affinity:
    podAntiAffinityType: required
  # On a spec change that needs new pods (image, affinity, resources), update
  # the replica, switch over to it, then update the old primary. The default,
  # restart, recreates the primary in place: when the replica was added, that
  # took the database down for 3m20s, most of it the smart-shutdown wait for the
  # app's connections to close.
  primaryUpdateMethod: switchover
  # CNPG's generated PDB keeps the primary at minAvailable: 1, which reports 0
  # allowed disruptions, so a drain of the primary's node hangs rather than
  # failing. Without it, the drain evicts the primary and the operator fails
  # over to the replica. See the same note on apps/n8n/postgresql.yaml.
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  # Backups and WAL archiving, via the barman-cloud CNPG-I plugin installed in
  # cnpg-system. isWALArchiver is what makes archive_command point here; without
  # it the plugin would take base backups with no WAL to replay onto them, and
  # point-in-time recovery would not work.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: job-track-database-backups
  storage:
    # The whole dataset is a few hundred leads of text. 2Gi is already an order
    # of magnitude more than it will hold, and the class allows expansion.
    size: 2Gi
    storageClass: truenas-nfs-postgres
  bootstrap:
    initdb:
      database: jobtrack
      owner: jobtrack
      secret:
        name: job-track-database-credentials
