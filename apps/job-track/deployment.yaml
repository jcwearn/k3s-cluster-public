apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-track
  namespace: job-track
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # The database is single-instance on NFS and the app holds no session state
  # worth preserving, so a brief gap during a roll is cheaper than two replicas
  # briefly running different schema versions.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: job-track
  template:
    metadata:
      labels:
        app: job-track
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      initContainers:
        # Migrations run here rather than at startup so that raising replicas
        # later cannot have two processes race each other through the same
        # migration. Same image, same embedded SQL, different flag.
        - name: migrate
          image: ghcr.io/jcwearn/job-track:v0.3.0@sha256:f3f2ac09cf939e982c184c91e29fc62f5f5dd3340e07f14257eff84f570b2eeb
          imagePullPolicy: IfNotPresent
          args: ["-migrate"]
          env:
            - name: JOBTRACK_DB_HOST
              value: "job-track-database-rw"
            - name: JOBTRACK_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: job-track-database-credentials
                  key: database
            - name: JOBTRACK_DB_USER
              valueFrom:
                secretKeyRef:
                  name: job-track-database-credentials
                  key: username
            - name: JOBTRACK_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: job-track-database-credentials
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
      containers:
        - name: job-track
          image: ghcr.io/jcwearn/job-track:v0.3.0@sha256:f3f2ac09cf939e982c184c91e29fc62f5f5dd3340e07f14257eff84f570b2eeb
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JOBTRACK_DB_HOST
              value: "job-track-database-rw"
            - name: JOBTRACK_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: job-track-database-credentials
                  key: database
            - name: JOBTRACK_DB_USER
              valueFrom:
                secretKeyRef:
                  name: job-track-database-credentials
                  key: username
            - name: JOBTRACK_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: job-track-database-credentials
                  key: password
            # Due dates are human dates typed into a date field. Without this
            # the container runs UTC and "due Friday" renders as Thursday all
            # evening.
            - name: TZ
              value: America/New_York
          # Liveness deliberately does not touch the database: an outage there
          # is not something a restart fixes, and wiring it in turns one into a
          # crash loop. Readiness does, which takes the pod out of the Service
          # while leaving it running.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
