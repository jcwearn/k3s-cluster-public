# Who may open a connection to the database pod. Three callers, nothing else:
#
#   5432  the app itself (its migrate init and the server share the label)
#   9187  Prometheus, for the PodMonitor
#   8000  the CloudNativePG operator, for the instance manager's status API
#
# The kubelet's liveness and readiness probes also hit 8000. They arrive from
# the node's own cni0 address, and k3s's embedded policy controller
# (kube-router) permits traffic whose source is the pod's local node before
# any policy is evaluated, so they need no rule. This was the first policy
# written and the one that proved that.
#
# Ingress only. The pod's egress -- WAL archiving to R2 through the barman
# sidecar, the instance manager reaching the API server -- is untouched.
#
# A one-off client (a restore Job, a psql from a debug pod) will be refused
# with connection refused rather than a hang; give it the app's label or add
# it here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: job-track-database
  namespace: job-track
  annotations:
    # The pod is created by the CloudNativePG operator from the Cluster object,
    # not by a manifest the linter can see. cnpg.io/cluster is the label the
    # operator puts on every instance pod.
    ignore-check.kube-linter.io/dangling-networkpolicy: "selects pods the CNPG operator creates from the Cluster object"
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: job-track-database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: job-track
      ports:
        - port: 5432
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prometheus
      ports:
        - port: 9187
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
          protocol: TCP
