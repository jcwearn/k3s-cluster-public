apiVersion: v1
kind: ServiceAccount
metadata:
  name: mazanoke
  namespace: mazanoke
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mazanoke-read
  namespace: mazanoke
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mazanoke-read-binding
  namespace: mazanoke
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mazanoke-read
subjects:
  - kind: ServiceAccount
    name: mazanoke
    namespace: mazanoke
