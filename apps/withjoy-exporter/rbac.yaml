apiVersion: v1
kind: ServiceAccount
metadata:
  name: withjoy-exporter-web
  namespace: withjoy-exporter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: withjoy-exporter-web
  namespace: withjoy-exporter
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: withjoy-exporter-web
  namespace: withjoy-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: withjoy-exporter-web
subjects:
  - kind: ServiceAccount
    name: withjoy-exporter-web
    namespace: withjoy-exporter
