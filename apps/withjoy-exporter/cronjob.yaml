apiVersion: batch/v1
kind: CronJob
metadata:
  name: withjoy-exporter
  namespace: withjoy-exporter
spec:
  schedule: "0 6 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: withjoy-exporter
              image: ghcr.io/jcwearn/withjoy-exporter:v0.4.2@sha256:bef16d803865578a8b11686e57a1a4ceb8446cebb53b2050847b54ecff34cd1b
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: withjoy-exporter-env
                - configMapRef:
                    name: withjoy-exporter-config
              volumeMounts:
                - name: google-credentials
                  mountPath: /secrets
                  readOnly: true
              resources:
                requests:
                  cpu: 200m
                  memory: 1Gi
                limits:
                  cpu: "1"
                  memory: 2Gi
          volumes:
            - name: google-credentials
              secret:
                secretName: withjoy-exporter-google-credentials
                defaultMode: 0400
                items:
                  - key: google-service-account.json
                    path: google-service-account.json
