apiVersion: batch/v1
kind: CronJob
metadata:
  name: withjoy-exporter
  namespace: withjoy-exporter
  annotations:
    # A Job runs to completion; a probe would only ever restart it mid-run.
    ignore-check.kube-linter.io/no-liveness-probe: "run-to-completion Job"
    ignore-check.kube-linter.io/no-readiness-probe: "run-to-completion Job"
spec:
  schedule: "0 6 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            # The secret volume is 0440 root:fsGroup; without this the file is
            # root:root and uid 1000 cannot read it.
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
          containers:
            - name: withjoy-exporter
              image: ghcr.io/jcwearn/withjoy-exporter:v0.4.24@sha256:ab0efe9ded292956ec2f15205fcd58cc4c3c7e1cbc19e81a6641c2eec9d9b4af
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: withjoy-exporter-env
                - configMapRef:
                    name: withjoy-exporter-config
              volumeMounts:
                - name: google-credentials
                  mountPath: /secrets
                  readOnly: true
              resources:
                requests:
                  cpu: 200m
                  memory: 1Gi
                limits:
                  cpu: "1"
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: google-credentials
              secret:
                secretName: withjoy-exporter-google-credentials
                defaultMode: 0440
                items:
                  - key: google-service-account.json
                    path: google-service-account.json
