apiVersion: batch/v1
kind: CronJob
metadata:
  name: withjoy-exporter
  namespace: withjoy-exporter
  annotations:
    # A Job runs to completion; a probe would only ever restart it mid-run.
    ignore-check.kube-linter.io/no-liveness-probe: "run-to-completion Job"
    ignore-check.kube-linter.io/no-readiness-probe: "run-to-completion Job"
spec:
  schedule: "0 6 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
          containers:
            - name: withjoy-exporter
              image: ghcr.io/jcwearn/withjoy-exporter:v0.4.23@sha256:4d80930de92e64e546e8c11b2a3e174d7290fbe6afce9d91840de03f90754748
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: withjoy-exporter-env
                - configMapRef:
                    name: withjoy-exporter-config
              volumeMounts:
                - name: google-credentials
                  mountPath: /secrets
                  readOnly: true
              resources:
                requests:
                  cpu: 200m
                  memory: 1Gi
                limits:
                  cpu: "1"
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: google-credentials
              secret:
                secretName: withjoy-exporter-google-credentials
                defaultMode: 0400
                items:
                  - key: google-service-account.json
                    path: google-service-account.json
