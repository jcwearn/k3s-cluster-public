apiVersion: apps/v1
kind: Deployment
metadata:
  name: withjoy-exporter-web
  namespace: withjoy-exporter
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: withjoy-exporter-web
  template:
    metadata:
      labels:
        app: withjoy-exporter-web
    spec:
      serviceAccountName: withjoy-exporter-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: withjoy-exporter-web
          image: ghcr.io/jcwearn/withjoy-exporter:v0.4.23@sha256:4d80930de92e64e546e8c11b2a3e174d7290fbe6afce9d91840de03f90754748
          imagePullPolicy: IfNotPresent
          command: ["python", "web.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NAMESPACE
              value: "withjoy-exporter"
            - name: CRONJOB_NAME
              value: "withjoy-exporter"
            # Dispatches the wedding site's "Refresh schedule index" workflow,
            # which rebuilds the site's schedule from the sheet this app exports.
            - name: GITHUB_REPO
              value: "jcwearn/anupamaandjackson"
            - name: GITHUB_WORKFLOW_FILE
              value: "refresh-schedule-index.yml"
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: withjoy-exporter-github-app
                  key: GITHUB_APP_ID
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: withjoy-exporter-github-app
                  key: GITHUB_APP_INSTALLATION_ID
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: withjoy-exporter-github-app
                  key: GITHUB_APP_PRIVATE_KEY
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # / renders a static page; the API calls are behind /api/status,
          # so a probe here does not touch the Kubernetes API.
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
