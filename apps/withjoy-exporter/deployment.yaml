apiVersion: apps/v1
kind: Deployment
metadata:
  name: withjoy-exporter-web
  namespace: withjoy-exporter
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: withjoy-exporter-web
  template:
    metadata:
      labels:
        app: withjoy-exporter-web
    spec:
      serviceAccountName: withjoy-exporter-web
      containers:
        - name: withjoy-exporter-web
          image: ghcr.io/jcwearn/withjoy-exporter:v0.4.22@sha256:a2b63f823cce664b60f1b40717dd73c07216768fa43b452e7a14f432014fa9d2
          imagePullPolicy: IfNotPresent
          command: ["python", "web.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NAMESPACE
              value: "withjoy-exporter"
            - name: CRONJOB_NAME
              value: "withjoy-exporter"
            # Dispatches the wedding site's "Refresh schedule index" workflow,
            # which rebuilds the site's schedule from the sheet this app exports.
            - name: GITHUB_REPO
              value: "jcwearn/anupamaandjackson"
            - name: GITHUB_WORKFLOW_FILE
              value: "refresh-schedule-index.yml"
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: withjoy-exporter-github-app
                  key: GITHUB_APP_ID
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: withjoy-exporter-github-app
                  key: GITHUB_APP_INSTALLATION_ID
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: withjoy-exporter-github-app
                  key: GITHUB_APP_PRIVATE_KEY
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          # / renders a static page; the API calls are behind /api/status,
          # so a probe here does not touch the Kubernetes API.
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
