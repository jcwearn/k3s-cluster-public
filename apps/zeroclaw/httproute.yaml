apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zeroclaw
  namespace: zeroclaw
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - zeroclaw.${DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zeroclaw-svc
          port: 42617
