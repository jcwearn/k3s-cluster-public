# zeroclaw is an LLM agent with a shell, a Telegram token and a Gemini key.
# Its job needs exactly two things from the network: DNS, and HTTPS to the
# internet. This lets it reach nothing else -- not another pod, not a
# Service, not the LAN, not the tailnet -- so a prompt that talks it into
# curl'ing something internal gets connection refused.
#
# Egress only. Its ingress (the gateway for the dashboard and /health, the
# kubelet for probes) is unchanged.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zeroclaw-egress
  namespace: zeroclaw
spec:
  podSelector:
    matchLabels:
      app: zeroclaw
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16          # pods
              - 10.43.0.0/16          # Services
              - ${LAN_PREFIX}.0/24    # the cluster LAN
              - ${MGMT_PREFIX}.0/24   # the management LAN
              - 100.64.0.0/10         # the tailnet
              - 169.254.0.0/16        # link-local, metadata-style endpoints
      ports:
        - port: 443
          protocol: TCP
