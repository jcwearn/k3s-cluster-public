apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeroclaw
  namespace: zeroclaw
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 1
  replicas: 1
  # Recreate, not RollingUpdate: the daemon takes an exclusive lock on
  # daemon.sock in its PVC, so a new pod cannot start while the old one runs.
  # With a readiness probe a RollingUpdate deadlocks -- the new pod never
  # becomes Ready, so the old one is never told to stop.
  # Switching a live Deployment to Recreate is rejected by the API server
  # ("rollingUpdate may not be specified when type is Recreate") because it
  # defaulted rollingUpdate while the type was RollingUpdate and nobody owns
  # that field. An explicit `rollingUpdate: null` does not clear it through
  # Flux. The fix was to delete the Deployment once and let Flux recreate it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zeroclaw
  template:
    metadata:
      labels:
        app: zeroclaw
    spec:
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init-config
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /zeroclaw-data/.zeroclaw /zeroclaw-data/workspace
              cp /config-source/config.toml /zeroclaw-data/.zeroclaw/config.toml
              cp /config-source/AGENTS.md /zeroclaw-data/workspace/AGENTS.md
              # Bare $VAR, not the curly-brace form, deliberately. Flux
              # postBuild substitution rewrites braced references and replaces
              # anything it cannot resolve with an empty string -- which would
              # deploy a pod that starts cleanly and writes a blank token into
              # the config. No error, no crash, a bot that cannot authenticate.
              # Bash treats the two forms identically here, because the next
              # character is a pipe and cannot be part of an identifier.
              sed -i "s|__SECRET_TELEGRAM_BOT_TOKEN__|$TELEGRAM_BOT_TOKEN|g" /zeroclaw-data/.zeroclaw/config.toml
              sed -i "s|__SECRET_TELEGRAM_ALLOWED_USER__|$TELEGRAM_ALLOWED_USER|g" /zeroclaw-data/.zeroclaw/config.toml
              chmod 600 /zeroclaw-data/.zeroclaw/config.toml
              chown -R 65534:65534 /zeroclaw-data
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zeroclaw-secrets
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_ALLOWED_USER
              valueFrom:
                secretKeyRef:
                  name: zeroclaw-secrets
                  key: TELEGRAM_ALLOWED_USER
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: config-volume
              mountPath: /config-source
            - name: data-volume
              mountPath: /zeroclaw-data
      containers:
        - name: zeroclaw
          image: ghcr.io/zeroclaw-labs/zeroclaw:v0.8.5-debian@sha256:c5f21204f56ecc5f9df72d8d929bfca04c65b3ee8bca8cc7bbcb8cb261851236
          imagePullPolicy: IfNotPresent
          args: ["daemon"]
          ports:
            - name: http
              containerPort: 42617
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: zeroclaw-secrets
                  key: API_KEY
            - name: PROVIDER
              value: gemini
            - name: ZEROCLAW_HOME
              value: /zeroclaw-data
            - name: SHELL
              value: /bin/bash
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # /health reports each runtime component's status as JSON.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: data-volume
              mountPath: /zeroclaw-data

      volumes:
        - name: config-volume
          configMap:
            name: zeroclaw-config
        - name: data-volume
          persistentVolumeClaim:
            claimName: zeroclaw-data-pvc
