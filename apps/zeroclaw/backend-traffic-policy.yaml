apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: zeroclaw-timeouts
  namespace: zeroclaw
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: zeroclaw
  timeout:
    http:
      requestTimeout: 3600s
      connectionIdleTimeout: 3600s
    tcp:
      connectTimeout: 10s
