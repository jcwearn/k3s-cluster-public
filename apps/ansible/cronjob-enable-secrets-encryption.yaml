# Runs enable-secrets-encryption.yml: the one-time, ordered procedure that
# turns on encryption of Secrets at rest, restarting k3s on each server twice
# along the way. Suspended with a placeholder schedule: it is run by hand, once,
# as
#
#   kubectl -n ansible create job --from=cronjob/ansible-enable-secrets-encryption \
#     enable-secrets-encryption-$(date +%s)
#
# and watched. A later run finds everything done and restarts nothing; the
# CronJob stays so the procedure stays runnable from Git.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ansible-enable-secrets-encryption
  namespace: ansible
  annotations:
    # A Job runs to completion; a probe would only ever restart it mid-run.
    ignore-check.kube-linter.io/no-liveness-probe: "run-to-completion Job"
    ignore-check.kube-linter.io/no-readiness-probe: "run-to-completion Job"
    # The SSH key Secret is mounted 0400 and owned by root; only root can read
    # it. Dropping root here means fsGroup plus a 0440 mode on that mount,
    # which is a change to the automation that reboots the hypervisors and
    # gets a supervised run of its own.
    ignore-check.kube-linter.io/run-as-non-root: "reads a root-owned 0400 SSH key; see comment"
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: ansible-enable-secrets-encryption
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 259200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ansible-enable-secrets-encryption
        spec:
          serviceAccountName: ansible-runner
          containers:
            - name: ansible
              image: ghcr.io/jcwearn/ansible-runner:0.1.52@sha256:1396dec8c1d85d22bf577683da3c67247896b2577338d66a2b0132fdfe478540
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 0
              command: ["ansible-playbook"]
              args: ["/ansible/playbooks/enable-secrets-encryption.yml"]
              env:
                - name: ANSIBLE_CONFIG
                  value: /ansible/ansible.cfg
              volumeMounts:
                - name: ansible-data
                  mountPath: /ansible
                - name: ssh-key
                  mountPath: /secrets
                  readOnly: true
                - name: kubectl
                  mountPath: /opt/kubectl
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          restartPolicy: Never
          volumes:
            - name: ansible-data
              configMap:
                name: ansible-data
                items:
                  - key: ansible.cfg
                    path: ansible.cfg
                  - key: inventory.yml
                    path: inventory.yml
                  - key: enable-secrets-encryption.yml
                    path: playbooks/enable-secrets-encryption.yml
                  - key: restart-k3s.yml
                    path: tasks/restart-k3s.yml
            - name: ssh-key
              secret:
                secretName: ansible-secrets
                defaultMode: 0400
                items:
                  - key: ssh-private-key
                    path: ssh-private-key
                  - key: ssh-public-key
                    path: ssh-public-key
            # kubectl for the gates and waits, as an image volume: the
            # rancher/kubectl image has no shell to copy the binary out with.
            - name: kubectl
              image:
                reference: rancher/kubectl:v1.36.2@sha256:06c7a7a9772737494ae1e0c3af90f1b5385630c147e47c1c7cea92f4bed55fbe
                pullPolicy: IfNotPresent
