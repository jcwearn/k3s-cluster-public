apiVersion: batch/v1
kind: CronJob
metadata:
  name: ansible-upgrade-hypervisor-01
  namespace: ansible
  annotations:
    # A Job runs to completion; a probe would only ever restart it mid-run.
    ignore-check.kube-linter.io/no-liveness-probe: "run-to-completion Job"
    ignore-check.kube-linter.io/no-readiness-probe: "run-to-completion Job"
    # The SSH key Secret is mounted 0400 and owned by root; only root can read
    # it. Dropping root here means fsGroup plus a 0440 mode on that mount,
    # which is a change to the automation that reboots the hypervisors and
    # gets a supervised run of its own.
    ignore-check.kube-linter.io/run-as-non-root: "reads a root-owned 0400 SSH key; see comment"
spec:
  # Last of three; the header in cronjob-upgrade-hypervisor-03.yaml explains
  # the shape and the spacing.
  schedule: "10 8 * * 6"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: ansible-upgrade-hypervisor
    spec:
      backoffLimit: 0
      # The backstop for a hung apt or a drain that never finishes. When it
      # fires the playbook's always: block does not run, so the Alertmanager
      # silence is created with its own expiry rather than relying on this.
      activeDeadlineSeconds: 7200
      # Pod logs are the only full record of a run; the ntfy summary is a
      # digest. Three days covers a Saturday run being read on Monday.
      ttlSecondsAfterFinished: 259200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ansible-upgrade-hypervisor
        spec:
          serviceAccountName: ansible-runner
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values: ["k3s-01"]
          containers:
            - name: ansible
              image: ghcr.io/jcwearn/ansible-runner:0.1.51@sha256:ea8d4f01bf1307ab82569881f47e686505ca0e4684040b09d95431462ac39233
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 0
              command: ["ansible-playbook"]
              args: ["/ansible/playbooks/upgrade-hypervisor.yml", "-e", "target=proxmox-01"]
              env:
                - name: ANSIBLE_CONFIG
                  value: /ansible/ansible.cfg
                # Lets the gate tell its own Job apart from a sibling's.
                - name: JOB_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['batch.kubernetes.io/job-name']
                - name: NTFY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: ansible-secrets
                      key: ntfy-token
              volumeMounts:
                - name: ansible-data
                  mountPath: /ansible
                - name: ssh-key
                  mountPath: /secrets
                  readOnly: true
                - name: kubectl
                  mountPath: /opt/kubectl
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          restartPolicy: Never
          volumes:
            - name: ansible-data
              configMap:
                name: ansible-data
                items:
                  - key: ansible.cfg
                    path: ansible.cfg
                  - key: inventory.yml
                    path: inventory.yml
                  - key: upgrade-hypervisor.yml
                    path: playbooks/upgrade-hypervisor.yml
                  - key: pve-reboot-required.sh
                    path: scripts/pve-reboot-required.sh
            - name: ssh-key
              secret:
                secretName: ansible-secrets
                defaultMode: 0400
                items:
                  - key: ssh-private-key
                    path: ssh-private-key
                  - key: ssh-public-key
                    path: ssh-public-key
            # The kubectl that drains. rancher/kubectl is a from-scratch image
            # holding exactly one file, /bin/kubectl -- no shell, no cp -- so an
            # initContainer cannot copy it out, and the runner image is not
            # rebuilt for it. An image volume mounts the image's filesystem
            # directly; the binary is at /opt/kubectl/bin/kubectl.
            #
            # Same tag as system-upgrade-controller's drain kubectl and under
            # the same rule: within one minor of the apiserver, moved by the
            # k3s hop PR, never ahead of it. Renovate reads `reference:` here
            # through a customManager in renovate.json, since the kubernetes
            # manager only sees `image:` keys.
            - name: kubectl
              image:
                reference: rancher/kubectl:v1.36.2@sha256:06c7a7a9772737494ae1e0c3af90f1b5385630c147e47c1c7cea92f4bed55fbe
                pullPolicy: IfNotPresent
