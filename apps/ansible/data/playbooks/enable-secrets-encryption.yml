---
# Playbook to turn on encryption of Secrets at rest, on a cluster that was
# started without it, following k3s's documented procedure for exactly that
# (docs.k3s.io/cli/secrets-encrypt, "Enable Secrets Encryption on an Existing
# Cluster", available from v1.35.3). The order is the point: k3s warns that
# doing these steps out of order can corrupt the cluster, so it is one
# playbook rather than a drop-in and a note.
#
#   1. On the first server: `k3s secrets-encrypt enable`, which writes an
#      encryption config with only the identity (plaintext) provider and
#      saves it into the cluster's bootstrap data for the other servers.
#   2. On every server, one at a time: write 40-secrets-encryption.yaml and
#      restart k3s. The apiserver now loads the config; nothing is encrypted
#      yet ("Disabled", stage "start").
#   3. On the first server: `k3s secrets-encrypt rotate-keys`. The running
#      server adds a key of the configured provider, rewrites every Secret
#      through it (about five a second) and drops the identity provider from
#      the write path. The command returns when that has finished.
#   4. On every server, one at a time: restart k3s again, so each reloads
#      the config the first server saved. Until it does, its encryption hash
#      differs from the first server's, which is the trigger.
#   5. On every server: the status must read Enabled, reencrypt_finished,
#      all hashes match, with a secretbox key active.
#
# Every step is guarded by `k3s secrets-encrypt status`, so a run on a
# cluster where this has already happened changes nothing and restarts
# nothing, and a run interrupted part-way picks up where it stopped.
#
# The drop-in is deliberately not written by configure-k3s-server.yml: that
# playbook restarts k3s whenever a file changes, and restarting with the
# flag before step 1 has run is the out-of-order case above.
#
# Run it as a Job from its CronJob:
#
#   kubectl -n ansible create job --from=cronjob/ansible-enable-secrets-encryption \
#     enable-secrets-encryption-$(date +%s)
#
# The etcd snapshots taken before this run hold Secrets in plaintext; the
# retention in 10-etcd-s3.yaml rolls them out of the bucket within a week.

- name: Enable secrets encryption on the first server
  hosts: k3s[0]
  gather_facts: false
  become: true

  vars:
    kubectl: /opt/kubectl/bin/kubectl
    sa_dir: /var/run/secrets/kubernetes.io/serviceaccount
    k3s_ips: "{{ groups['k3s'] | map('extract', hostvars, 'ansible_host') | list }}"

  tasks:
    - name: "Gate: every node Ready"
      ansible.builtin.command: >-
        {{ kubectl }} get nodes -o 'custom-columns=NAME:.metadata.name,READY:.status.conditions[?(@.type=="Ready")].status'
        --no-headers
      register: node_rows
      changed_when: false
      failed_when: >-
        node_rows.rc != 0
        or node_rows.stdout_lines | map('split') | rejectattr('1', 'equalto', 'True') | list | length > 0
      delegate_to: localhost
      become: false

    - name: "Gate: etcd healthy on every node"
      ansible.builtin.shell: >-
        {{ kubectl }} --server https://{{ item }}:6443
        --certificate-authority {{ sa_dir }}/ca.crt
        --token "$(cat {{ sa_dir }}/token)"
        get --raw /healthz/etcd
      register: etcd_health
      changed_when: false
      failed_when: etcd_health.rc != 0 or etcd_health.stdout | trim != 'ok'
      loop: "{{ k3s_ips }}"
      delegate_to: localhost
      become: false

    # With no encryption config on the cluster the JSON has no `enable` key
    # at all; once `enable` has run it is false; once keys have been rotated
    # it is true. Between `enable` and the first restart the command fails
    # with "missing annotation": the server only writes its hash annotation
    # at start. A run interrupted there must get past this gate.
    - name: Read the secrets encryption status
      ansible.builtin.command: k3s secrets-encrypt status --output json
      register: status_before
      changed_when: false
      failed_when: status_before.rc != 0 and 'missing annotation' not in status_before.stderr

    - name: Write the identity-only encryption config into the cluster
      ansible.builtin.command: k3s secrets-encrypt enable
      when: status_before.rc == 0 and (status_before.stdout | from_json).enable is not defined
      changed_when: true

- name: Restart every server with the flag
  hosts: k3s
  serial: 1
  gather_facts: false
  become: true

  vars:
    kubectl: /opt/kubectl/bin/kubectl
    sa_dir: /var/run/secrets/kubernetes.io/serviceaccount
    k3s_ips: "{{ groups['k3s'] | map('extract', hostvars, 'ansible_host') | list }}"
    config_dir: /etc/rancher/k3s/config.yaml.d

  tasks:
    - name: Write the secrets encryption drop-in
      ansible.builtin.copy:
        dest: "{{ config_dir }}/40-secrets-encryption.yaml"
        content: |
          # Secrets are encrypted before they reach etcd, so a copy of the
          # datastore -- a snapshot in R2, a disk image of a guest -- does not
          # hold them in the clear. The keys live in
          # /var/lib/rancher/k3s/server/cred/encryption-config.json on each
          # server and in the cluster's bootstrap data, which the server token
          # protects.
          #
          # secretbox (XSalsa20-Poly1305) rather than k3s's default aescbc,
          # which upstream Kubernetes marks not recommended. The provider is
          # read when keys are rotated, not at every start, so changing it
          # here means another `rotate-keys` round.
          #
          # Written by enable-secrets-encryption.yml, not configure-k3s-server.yml,
          # because enabling has an order to it; see that playbook.
          secrets-encryption: true
          secrets-encryption-provider: secretbox
        mode: "0600"
      register: encryption_dropin

    - name: Restart k3s and wait for the cluster to be whole
      ansible.builtin.include_tasks: /ansible/tasks/restart-k3s.yml
      when: encryption_dropin.changed

- name: Rotate keys on the first server
  hosts: k3s[0]
  gather_facts: false
  become: true

  tasks:
    - name: Read the secrets encryption status
      ansible.builtin.command: k3s secrets-encrypt status --output json
      register: status_loaded
      changed_when: false

    - name: Decide whether keys need rotating
      ansible.builtin.set_fact:
        status_now: "{{ status_loaded.stdout | from_json }}"

    - name: Confirm the server loaded an encryption config
      ansible.builtin.assert:
        that: status_now.enable is defined
        fail_msg: "status is {{ status_now }}; no encryption config was loaded, so `enable` or the restart did not happen"

    # rotate-keys refuses to start unless every server is at `start` or
    # `reencrypt_finished` with matching hashes; checking here gives a
    # readable failure instead of the command's.
    - name: Confirm every server loaded the same config at the start stage
      ansible.builtin.assert:
        that:
          - status_now.hashmatch | default(false) | bool
          - status_now.stage in ['start', 'reencrypt_finished']
        fail_msg: "status is {{ status_now }}; the servers are not ready for rotate-keys"
      when: not status_now.enable | bool

    - name: Rotate keys and reencrypt every Secret
      ansible.builtin.command: k3s secrets-encrypt rotate-keys
      when: not status_now.enable | bool
      changed_when: true

- name: Restart every server onto the new keys
  hosts: k3s
  serial: 1
  gather_facts: false
  become: true

  vars:
    kubectl: /opt/kubectl/bin/kubectl
    sa_dir: /var/run/secrets/kubernetes.io/serviceaccount
    k3s_ips: "{{ groups['k3s'] | map('extract', hostvars, 'ansible_host') | list }}"

  tasks:
    - name: Read the secrets encryption status
      ansible.builtin.command: k3s secrets-encrypt status --output json
      register: status_rotated
      changed_when: false

    # After rotate-keys the first server carries the new config and the
    # others still hold what they loaded in the first round, so the hashes
    # differ until each has restarted. The first server restarts too, as
    # the procedure says; once all three have, the hashes match and a re-run
    # restarts nobody.
    - name: Restart k3s and wait for the cluster to be whole
      ansible.builtin.include_tasks: /ansible/tasks/restart-k3s.yml
      when: not (status_rotated.stdout | from_json).hashmatch | default(false) | bool

- name: Verify on every server
  hosts: k3s
  gather_facts: false
  become: true

  tasks:
    - name: Read the secrets encryption status
      ansible.builtin.command: k3s secrets-encrypt status --output json
      register: status_final
      changed_when: false

    - name: Confirm encryption is on, reencryption finished, and the servers agree
      ansible.builtin.assert:
        that:
          - (status_final.stdout | from_json).enable | default(false) | bool
          - (status_final.stdout | from_json).stage == 'reencrypt_finished'
          - (status_final.stdout | from_json).hashmatch | default(false) | bool
          - (status_final.stdout | from_json).activekey is search('^XSalsa20-POLY1305 secretboxkey')
        fail_msg: "status is {{ status_final.stdout }}"
        success_msg: "{{ status_final.stdout }}"
