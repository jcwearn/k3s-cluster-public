---
- name: Update Linux servers
  hosts: linux_servers
  become: true
  gather_facts: true

  tasks:
    - name: Configure apt to prefer IPv4
      ansible.builtin.copy:
        content: 'Acquire::ForceIPv4 "true";'
        dest: /etc/apt/apt.conf.d/99-force-ipv4
        mode: "0644"

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoclean: true
      register: upgrade_result

    - name: Remove unnecessary packages
      ansible.builtin.apt:
        autoremove: true
      register: autoremove_result

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Read reboot-required packages
      ansible.builtin.slurp:
        src: /var/run/reboot-required.pkgs
      register: reboot_pkgs
      when: reboot_required.stat.exists
      failed_when: false

    - name: Build host summary
      ansible.builtin.set_fact:
        host_summary:
          hostname: "{{ inventory_hostname }}"
          changed: "{{ upgrade_result.changed or autoremove_result.changed }}"
          reboot_required: "{{ reboot_required.stat.exists }}"
          reboot_packages: "{{ (reboot_pkgs.content | default('') | b64decode).strip() | replace('\n', ', ') if reboot_required.stat.exists else 'N/A' }}"
          stdout: "{{ upgrade_result.stdout | default('No output') }}"

- name: Send update report email
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Collect summaries from all hosts
      ansible.builtin.set_fact:
        all_summaries: >-
          {{ groups['linux_servers'] | map('extract', hostvars) | selectattr('host_summary', 'defined') | map(attribute='host_summary') | list }}

    - name: Build report body
      ansible.builtin.set_fact:
        report_body: |
          Server Update Report - {{ ansible_facts["date_time"].date }}
          ================================================

          {% for summary in all_summaries %}
          Host: {{ summary.hostname }}
            Changes applied: {{ summary.changed }}
            Reboot required: {{ summary.reboot_required }}
            Packages requiring reboot: {{ summary.reboot_packages }}

          {% endfor %}

          ---
          Generated by ansible-update-linux CronJob

    - name: Send email report
      community.general.mail:
        host: smtp.gmail.com
        port: 587
        secure: starttls
        username: "{{ lookup('env', 'SMTP_USERNAME') }}"
        password: "{{ lookup('env', 'SMTP_PASSWORD') }}"
        from: "{{ lookup('env', 'SMTP_USERNAME') }}"
        to: "{{ lookup('env', 'SMTP_USERNAME') }}"
        subject: "Server Update Report - {{ ansible_facts['date_time'].date }}"
        body: "{{ report_body }}"
