---
# Playbook to manage the k3s server configuration on the three control-plane
# nodes, one node at a time, restarting k3s where something changed.
#
# Every k3s argument lives in the systemd unit's ExecStart today, and nothing
# in Git describes it. This playbook owns the part that should be declarative:
# drop-in files under /etc/rancher/k3s/config.yaml.d/, which k3s merges with
# the unit's flags at start. Each drop-in is one concern, numbered so the
# merge order is obvious. Today:
#
#   10-etcd-s3.yaml   upload every etcd snapshot to R2 (credentials in the
#                     kube-system/k3s-etcd-s3 Secret, managed by Flux from
#                     infrastructure/k3s-server/), every six hours, keep 28
#   20-audit.yaml     kube-apiserver audit log on the node, under the policy
#                     in /var/lib/rancher/k3s/server/audit-policy.yaml
#   30-psa.yaml       a Pod Security default for namespaces without labels,
#                     from /var/lib/rancher/k3s/server/psa.yaml
#   50-hardening.yaml protect-kernel-defaults: the kubelet refuses to start
#                     unless the six sysctls configure-node-sysctl.yml sets
#                     are in place, so that playbook runs first
#
# Not this playbook's: 40-secrets-encryption.yaml, written by
# enable-secrets-encryption.yml, because turning encryption on has an order
# (enable, restart, rotate-keys, restart) that "restart where a file changed"
# cannot express. This playbook leaves that file alone.
#
# The two policy files come from apps/ansible/data/k3s/, mounted into the Job
# at /ansible/k3s/. k3s reads them only at start, so a change to either is a
# restart as much as a drop-in change is.
#
# A key that appears in two drop-ins is replaced by the later file, lists
# included -- unless the later file writes the key with a `+` suffix, which
# appends instead. 20-audit.yaml owns `kube-apiserver-arg`; 30-psa.yaml and
# any later drop-in that adds an apiserver flag must write
# `kube-apiserver-arg+`, and the check after the restart reads the flags the
# apiserver actually started with. Grep this file and upgrade-hypervisor.yml
# for a flag before adding it to a drop-in: a config.yaml key is read by every
# k3s subcommand, not only `k3s server`.
#
# A drop-in only takes effect when k3s restarts. `systemctl restart k3s`
# restarts the supervisor and the apiserver on that node; containerd and the
# pods keep running (the unit's KillMode is process), and the control-plane
# VIP fails over to another node for the seconds it takes. Between nodes the
# play waits for the node to be Ready and for etcd to report healthy on all
# three, so a config that k3s refuses to start with stops the play at one node
# with the other two holding quorum.
#
# Run it as a Job from its CronJob (the schedule is a placeholder and the
# CronJob is suspended):
#
#   kubectl -n ansible create job --from=cronjob/ansible-configure-k3s-server \
#     configure-k3s-server-$(date +%s)
#
# To write the files and inspect them without restarting anything, make a copy
# of the Job with `-e restart_k3s=false` appended to the args.

- name: Configure the k3s servers
  hosts: k3s
  serial: 1
  gather_facts: false
  become: true

  vars:
    restart_k3s: true
    kubectl: /opt/kubectl/bin/kubectl
    sa_dir: /var/run/secrets/kubernetes.io/serviceaccount
    config_dir: /etc/rancher/k3s/config.yaml.d
    k3s_ips: "{{ groups['k3s'] | map('extract', hostvars, 'ansible_host') | list }}"

  tasks:
    - name: "Gate: every node Ready"
      ansible.builtin.command: >-
        {{ kubectl }} get nodes -o 'custom-columns=NAME:.metadata.name,READY:.status.conditions[?(@.type=="Ready")].status'
        --no-headers
      register: node_rows
      changed_when: false
      failed_when: >-
        node_rows.rc != 0
        or node_rows.stdout_lines | map('split') | rejectattr('1', 'equalto', 'True') | list | length > 0
      delegate_to: localhost
      become: false

    - name: "Gate: etcd healthy on every node"
      ansible.builtin.shell: >-
        {{ kubectl }} --server https://{{ item }}:6443
        --certificate-authority {{ sa_dir }}/ca.crt
        --token "$(cat {{ sa_dir }}/token)"
        get --raw /healthz/etcd
      register: etcd_health
      changed_when: false
      failed_when: etcd_health.rc != 0 or etcd_health.stdout | trim != 'ok'
      loop: "{{ k3s_ips }}"
      delegate_to: localhost
      become: false

    - name: Ensure the drop-in directory exists
      ansible.builtin.file:
        path: "{{ config_dir }}"
        state: directory
        mode: "0700"

    # k3s reads config.yaml and then config.yaml.d/*.yaml. The main file has
    # never existed on these nodes; an empty one with a pointer removes any
    # doubt about whether the directory is read without it.
    - name: Ensure config.yaml exists and points at the drop-ins
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        content: |
          # Managed by apps/ansible/data/playbooks/configure-k3s-server.yml in
          # jcwearn/k3s-cluster. Settings live in config.yaml.d/, one file per
          # concern. The flags in the systemd unit still apply and win on conflict.
        mode: "0600"
        force: false

    - name: Write the etcd snapshot drop-in
      ansible.builtin.copy:
        dest: "{{ config_dir }}/10-etcd-s3.yaml"
        content: |
          # Every etcd snapshot is uploaded to R2 as well as kept locally, so
          # the cluster's state survives the loss of the three guests. The
          # endpoint and credentials are read from the kube-system/k3s-etcd-s3
          # Secret, which Flux manages from infrastructure/k3s-server/ -- so
          # rotating them never touches a node.
          #
          # Every six hours, keep 28: a week. Retention applies to the bucket
          # too; k3s prunes its own uploads.
          etcd-s3: true
          etcd-s3-config-secret: k3s-etcd-s3
          etcd-snapshot-schedule-cron: "0 */6 * * *"
          etcd-snapshot-retention: 28
        mode: "0600"
      register: etcd_s3_dropin

    # The apiserver does not create this directory and will not start
    # without it once audit-log-path points into it.
    - name: Ensure the audit log directory exists
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/server/logs
        state: directory
        mode: "0700"

    - name: Write the audit policy
      ansible.builtin.copy:
        src: /ansible/k3s/audit-policy.yaml
        dest: /var/lib/rancher/k3s/server/audit-policy.yaml
        mode: "0600"
      register: audit_policy

    - name: Write the audit log drop-in
      ansible.builtin.copy:
        dest: "{{ config_dir }}/20-audit.yaml"
        content: |
          # Every API request is recorded on this node under the policy in
          # audit-policy.yaml (next to the log: who touched a Secret, never
          # what was in it; request bodies for writes; metadata otherwise).
          # The log stays on the node -- nothing ships it anywhere -- and is
          # capped at ten 100 MB files or thirty days, whichever comes first.
          #
          # This file owns kube-apiserver-arg. A later drop-in adding a flag
          # must write `kube-apiserver-arg+` or it replaces this list.
          kube-apiserver-arg:
            - audit-log-path=/var/lib/rancher/k3s/server/logs/audit.log
            - audit-policy-file=/var/lib/rancher/k3s/server/audit-policy.yaml
            - audit-log-maxage=30
            - audit-log-maxbackup=10
            - audit-log-maxsize=100
        mode: "0600"
      register: audit_dropin

    - name: Write the admission configuration
      ansible.builtin.copy:
        src: /ansible/k3s/psa.yaml
        dest: /var/lib/rancher/k3s/server/psa.yaml
        mode: "0600"
      register: psa_config

    - name: Write the Pod Security default drop-in
      ansible.builtin.copy:
        dest: "{{ config_dir }}/30-psa.yaml"
        content: |
          # A namespace with no pod-security.kubernetes.io labels gets the
          # levels in psa.yaml (enforce baseline, warn and audit restricted;
          # kube-system exempt). Every namespace in Git carries labels, which
          # win; this is the floor for the ones created outside Git.
          #
          # `+` appends to the list 20-audit.yaml started. Without it this
          # file would replace that list and the audit log would go away.
          kube-apiserver-arg+:
            - admission-control-config-file=/var/lib/rancher/k3s/server/psa.yaml
        mode: "0600"
      register: psa_dropin

    # The gate before the drop-in: the values the kubelet will demand, read
    # on this node right now. A node whose sysctls are not in place fails
    # here, with the file unwritten and k3s untouched, instead of failing to
    # start after the restart. The list is the kubelet's (setupKernelTunables)
    # and matches configure-node-sysctl.yml.
    - name: Confirm the sysctls protect-kernel-defaults checks are in place
      ansible.builtin.command: "sysctl -n {{ item.name }}"
      register: kernel_default
      changed_when: false
      failed_when: kernel_default.rc != 0 or kernel_default.stdout | trim != item.value
      loop:
        - {name: vm.overcommit_memory, value: "1"}
        - {name: vm.panic_on_oom, value: "0"}
        - {name: kernel.panic, value: "10"}
        - {name: kernel.panic_on_oops, value: "1"}
        - {name: kernel.keys.root_maxkeys, value: "1000000"}
        - {name: kernel.keys.root_maxbytes, value: "25000000"}
      loop_control:
        label: "{{ item.name }}={{ item.value }}"

    - name: Write the kernel defaults drop-in
      ansible.builtin.copy:
        dest: "{{ config_dir }}/50-hardening.yaml"
        content: |
          # The kubelet checks six kernel parameters at start and, with this
          # on, refuses to run if any is not what it expects rather than
          # setting it itself. configure-node-sysctl.yml owns those values;
          # configure-k3s-server.yml reads them back before writing this
          # file. Turn this off first if that playbook ever stops setting
          # them.
          protect-kernel-defaults: true
        mode: "0600"
      register: hardening_dropin

    - name: Note whether anything k3s reads at start changed
      ansible.builtin.set_fact:
        k3s_config_changed: >-
          {{ etcd_s3_dropin.changed or audit_policy.changed or audit_dropin.changed
             or psa_config.changed or psa_dropin.changed or hardening_dropin.changed }}

    - name: Report what changed
      ansible.builtin.debug:
        msg: >-
          {{ 'k3s configuration changed; k3s will be restarted' if k3s_config_changed | bool and restart_k3s | bool
             else 'k3s configuration changed; restart_k3s is false, nothing restarted' if k3s_config_changed | bool
             else 'nothing changed; nothing to restart' }}

    - name: Restart k3s and wait for it to return
      when: k3s_config_changed | bool and restart_k3s | bool
      block:
        - name: Restart k3s
          ansible.builtin.systemd:
            name: k3s
            state: restarted

        - name: Wait for the node to be Ready
          ansible.builtin.command: >-
            {{ kubectl }} get node {{ inventory_hostname }} -o 'jsonpath={.status.conditions[?(@.type=="Ready")].status}'
          register: node_ready
          changed_when: false
          retries: 30
          delay: 10
          until: node_ready.rc == 0 and node_ready.stdout | trim == 'True'
          delegate_to: localhost
          become: false

        - name: Wait for etcd to be healthy on every node
          ansible.builtin.shell: >-
            {{ kubectl }} --server https://{{ item }}:6443
            --certificate-authority {{ sa_dir }}/ca.crt
            --token "$(cat {{ sa_dir }}/token)"
            get --raw /healthz/etcd
          register: etcd_health_after
          changed_when: false
          retries: 12
          delay: 10
          until: etcd_health_after.rc == 0 and etcd_health_after.stdout | trim == 'ok'
          loop: "{{ k3s_ips }}"
          delegate_to: localhost
          become: false

        # k3s logs the full apiserver command line once per start. Both
        # flags on it is the proof that 30-psa.yaml appended to the list
        # rather than replacing it; a lost `+` stops the play here, on the
        # first node, with the other two holding quorum.
        - name: Read the flags the apiserver started with
          ansible.builtin.shell: >-
            journalctl -u k3s -b --no-pager | grep 'Running kube-apiserver' | tail -n 1
          register: apiserver_args
          changed_when: false
          failed_when: >-
            apiserver_args.rc != 0
            or '--audit-log-path=' not in apiserver_args.stdout
            or '--admission-control-config-file=' not in apiserver_args.stdout

        - name: Read the flags the kubelet started with
          ansible.builtin.shell: >-
            journalctl -u k3s -b --no-pager | grep 'Running kubelet' | tail -n 1
          register: kubelet_args
          changed_when: false
          failed_when: >-
            kubelet_args.rc != 0
            or '--protect-kernel-defaults=true' not in kubelet_args.stdout

        # The file appears on the first request the policy records, which
        # the waits above have already made.
        - name: Wait for the audit log to be written
          ansible.builtin.stat:
            path: /var/lib/rancher/k3s/server/logs/audit.log
          register: audit_log
          retries: 6
          delay: 5
          until: audit_log.stat.exists and audit_log.stat.size > 0

        # The proof that the drop-in works is an upload, not a log line: a
        # named snapshot through the same path the schedule uses. Not pruned
        # with `k3s etcd-snapshot prune`, which reads the drop-in's retention
        # and refuses a second value; it is deleted by name once confirmed.
        - name: Snapshot etcd through the new configuration
          ansible.builtin.command: k3s etcd-snapshot save --name configure-check
          changed_when: true

        - name: Confirm the snapshot reached the bucket
          ansible.builtin.command: "{{ kubectl }} get etcdsnapshotfile -o json"
          register: snapshot_files
          changed_when: false
          retries: 6
          delay: 10
          until: >-
            snapshot_files.rc == 0
            and (snapshot_files.stdout | from_json)['items']
                | selectattr('spec.nodeName', 'equalto', inventory_hostname)
                | selectattr('spec.s3', 'defined')
                | selectattr('spec.snapshotName', 'search', '^configure-check')
                | selectattr('status.readyToUse', 'defined')
                | selectattr('status.readyToUse', 'equalto', true)
                | list | length > 0
          delegate_to: localhost
          become: false

    # Outside the restart block on purpose: a run that changes nothing on this
    # node still sweeps up check snapshots an earlier, failed run left behind.
    - name: List the check snapshots this node has
      ansible.builtin.command: "{{ kubectl }} get etcdsnapshotfile -o json"
      register: leftover_files
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Delete the check snapshots, local and S3
      ansible.builtin.command: "k3s etcd-snapshot delete {{ item }}"
      loop: >-
        {{ (leftover_files.stdout | from_json)['items']
           | selectattr('spec.nodeName', 'equalto', inventory_hostname)
           | map(attribute='spec.snapshotName')
           | select('search', '^configure-check')
           | unique | list }}
      changed_when: true
