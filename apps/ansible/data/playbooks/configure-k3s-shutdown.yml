---
# Playbook to install a systemd pre-shutdown service on all k3s nodes.
# This service runs k3s-killall.sh before the OS shuts down or reboots,
# ensuring all NFS-backed kubelet volumes are unmounted before the final
# filesystem sync. Without this, a reboot can hang in kernel space trying
# to flush dirty NFS buffers (causing the VM to appear "on" but be
# unreachable via SSH/console until a hard stop is performed in Proxmox).
#
# Run manually:
#   kubectl create job -n ansible --from=cronjob/ansible-configure-k3s-shutdown \
#     ansible-configure-k3s-shutdown-$(date +%s)

- name: Configure k3s nodes for clean shutdown
  hosts: k3s
  become: true
  gather_facts: false

  tasks:
    - name: Deploy k3s-pre-shutdown systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s-pre-shutdown.service
        content: |
          [Unit]
          Description=Clean up k3s before shutdown/reboot
          DefaultDependencies=no
          Before=shutdown.target reboot.target halt.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/k3s-killall.sh
          TimeoutStartSec=120
          RemainAfterExit=yes

          [Install]
          WantedBy=halt.target reboot.target shutdown.target
        mode: "0644"
      register: service_file

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
      when: service_file.changed

    - name: Enable k3s-pre-shutdown service
      ansible.builtin.systemd:
        name: k3s-pre-shutdown.service
        enabled: true
