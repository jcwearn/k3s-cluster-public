[defaults]
inventory = /ansible/inventory.yml
host_key_checking = False
retry_files_enabled = False
stdout_callback = ansible.builtin.default
display_args_to_stdout = False
result_format = yaml

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=60 -o ServerAliveCountMax=30
pipelining = True
