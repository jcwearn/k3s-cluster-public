apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jellyfin
  namespace: flux-system
spec:
  url: https://jellyfin.github.io/jellyfin-helm
  interval: 10m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 10m
  chart:
    spec:
      chart: jellyfin
      version: 3.2.0
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: flux-system
  install:
    createNamespace: true
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    podAnnotations:
      reloader.stakater.com/auto: "true"
    service:
      type: LoadBalancer
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: "jellyfin"
        kube-vip.io/loadbalancerIPs: "${LAN_PREFIX}.24"
    ingress:
      enabled: false
    resources:
      limits:
        cpu: 4000m
        memory: 8192Mi
      requests:
        cpu: 2000m
        memory: 4096Mi
    persistence:
      media:
        enabled: false
